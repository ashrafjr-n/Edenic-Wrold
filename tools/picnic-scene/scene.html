<script type="module">
/*
 * The Find scenes, one per shape lesson: `scene.html?scene=picnic` (circles),
 * `squares`, `triangles`, `rectangles`. Same grass, light, camera and clay in
 * all of them; each has its own blanket and its own things — four of the
 * lesson's shape and a few clearly different ones (never a square in the
 * rectangle scene or the other way round, and no blanket pattern in the
 * shape being looked for).
 */
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { DecalGeometry } from "three/addons/geometries/DecalGeometry.js";
import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

const params = new URLSearchParams(location.search);

const SCENE = params.get("scene") || "picnic";
/* `?paint=blank`: everything in plain grey clay — a thing before it is painted. */
const BLANK = params.get("paint") === "blank";

/* The Colors course's paints, one per taught color. */
const PAINT = {
  red: 0xee4645, blue: 0x3f86e8, yellow: 0xffd31a, green: 0x4fbf5a, orange: 0xff8c2e,
  purple: 0x9257de, pink: 0xff86c2, brown: 0x96592f, black: 0x2e2b35, white: 0xfbfbf8,
};

const W = 1000, H = 1250;              // 4:5 — the phone's stage
const VIEW_W = 6.4;                      // world units across
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
/* ACES for the Shapes picnics; the Colors art (single things, and the
   scenes that stand things on their own boxes) uses Neutral, which keeps a
   color's hue and saturation — ACES washes yellows into mustard. */
const VIVID = params.has("thing") || params.has("harvest") || params.has("basket") || params.has("season") || params.has("classroom") || params.has("garden") || ["red", "blue", "yellow", "green", "orange", "purple", "pink", "brown", "black", "white"].includes(params.get("scene"));
renderer.toneMapping = VIVID ? THREE.NeutralToneMapping : THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = VIVID ? 0.86 : 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

/* Orthographic, tipped 18° off straight-down: a circle stays a circle. */
const viewH = VIEW_W * H / W;
const camera = new THREE.OrthographicCamera(-VIEW_W / 2, VIEW_W / 2, viewH / 2, -viewH / 2, 0.1, 100);
const tilt = THREE.MathUtils.degToRad(72);
camera.position.set(0, Math.sin(tilt) * 30, Math.cos(tilt) * 30);
camera.lookAt(0, 0, 0);

const sky = new THREE.HemisphereLight(0xffffff, 0xb9d4f5, 0.75);
scene.add(sky);
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
sun.position.set(-5, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
scene.add(sun);

/* The clay: pastel, soft sheen, a light glossy coat. */
const clay = (color, extra = {}) =>
  new THREE.MeshPhysicalMaterial({ color, roughness: 0.55, clearcoat: 0.45, clearcoatRoughness: 0.35, sheen: 0.4, sheenRoughness: 0.6, sheenColor: 0xffffff, ...extra, ...(BLANK ? { color: 0xc8c5d1, map: null } : {}) });

/* Seeded — the same scene every render. */
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const mesh = (geometry, material) => {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
};

/* Felt with a fine fur (2026-11-09) — the reels' shapes: sage green, soft pink
   patches, no face. The fur is SHELLS: the same mesh drawn `shells` times, each
   pushed a little further out along its normals and keeping only the cells a
   hash says are strands, so it has a real fuzzy edge. The patches are a soft
   mask in OBJECT space (exact at any size). Object-space cells and length mean
   a scaled group has proportionally scaled fur. */
const FUR_HELP = `
  float rr(vec2 p, vec2 c, vec2 h, float r) { vec2 q = abs(p - c) - h + r; return smoothstep(0.07, -0.07, length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r); }
  float tri(vec2 p, float r) { const float k = 1.7320508; p.x = abs(p.x) - r; p.y = p.y + r / k; if (p.x + k * p.y > 0.0) p = vec2(p.x - k * p.y, -k * p.x - p.y) / 2.0; p.x -= clamp(p.x, -2.0 * r, 0.0); return -length(p) * sign(p.y); }
  float blob(vec3 d, vec3 c, float r) { return smoothstep(r, r * 0.7, acos(clamp(dot(d, c), -1.0, 1.0))); }`;
function furShells(geo, { patch = "float patchAt(vec3 p, vec3 n) { return 0.0; }", dens = 90, length = 0.03, shells = 14, green = 0x94bd64, pink = 0xf99dbd, key = "plain", shade = [0.8, 1.1] } = {}) {
  const [GREEN, PINK] = [new THREE.Color(green), new THREE.Color(pink)];
  const g = new THREE.Group();
  for (let i = 0; i < shells; i++) {
    const layer = i / (shells - 1);
    const mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.92, clearcoat: 0, sheen: 1, sheenRoughness: 0.45, sheenColor: 0xfff4e6 });
    mat.onBeforeCompile = (sh) => {
      sh.uniforms.uOff = { value: length * layer };
      sh.uniforms.uLayer = { value: layer };
      sh.uniforms.uGreen = { value: GREEN };
      sh.uniforms.uPink = { value: PINK };
      sh.uniforms.uShade = { value: new THREE.Vector2(...shade) };
      sh.vertexShader = sh.vertexShader
        .replace("#include <common>", "#include <common>\nvarying vec3 vObj; varying vec3 vObjN; uniform float uOff;")
        .replace("#include <begin_vertex>", "#include <begin_vertex>\nvObj = position; vObjN = normal; transformed += normal * uOff;");
      sh.fragmentShader = sh.fragmentShader
        .replace("#include <common>", `#include <common>\nvarying vec3 vObj; varying vec3 vObjN; uniform float uLayer; uniform vec3 uGreen; uniform vec3 uPink; uniform vec2 uShade;\n${FUR_HELP}\n${patch}
          float hash3(vec3 q) { q = fract(q * 0.3183099 + 0.1); q *= 17.0; return fract(q.x * q.y * q.z * (q.x + q.y + q.z)); }`)
        .replace("#include <color_fragment>", `#include <color_fragment>
          vec3 cell = vObj * ${dens.toFixed(1)};
          float strand = hash3(floor(cell));
          float reach = mix(1.1, 0.35, uLayer) * (0.55 + 0.45 * strand);
          if (uLayer > 0.0 && (length(fract(cell) - 0.5) * 2.0 > reach || strand < uLayer * 0.45)) discard;
          float m = patchAt(vObj, normalize(vObjN));
          diffuseColor.rgb = mix(uGreen, uPink, m) * mix(uShade.x, uShade.y, uLayer) * (0.93 + 0.14 * strand);`);
    };
    mat.customProgramCacheKey = () => "fur-" + key;
    const shell = mesh(geo, mat);
    shell.castShadow = i === 0;
    shell.userData.noMerge = true;
    g.add(shell);
  }
  return g;
}
/* One of the four shapes, about 3 across, centred, fur on, its pink patches
   where the reels have them (no face). `opts` override the fur / colours. */
function furBody(kind, opts = {}) {
  let geo, patch;
    if (kind === "circle") {
      geo = new THREE.SphereGeometry(1.62, 192, 128);
      patch = `float patchAt(vec3 p, vec3 n) { vec3 d = normalize(p);
        return max(max(blob(d, normalize(vec3(0.64, -0.4, 0.65)), 0.56), blob(d, normalize(vec3(-0.69, -0.47, 0.55)), 0.54)), blob(d, normalize(vec3(0.24, 0.87, 0.43)), 0.58)); }`;
    } else if (kind === "square") {
      geo = new RoundedBoxGeometry(2.9, 2.9, 2.9, 24, 0.42);
      patch = `float patchAt(vec3 p, vec3 n) { float f = smoothstep(0.55, 0.85, n.z);
        return f * max(rr(p.xy, vec2(-0.82, -0.18), vec2(0.5, 0.62), 0.5), rr(p.xy, vec2(0.84, -0.1), vec2(0.56, 0.66), 0.55)); }`;
    } else if (kind === "triangle") {
      const s = new THREE.Shape();
      const [a, b, c, r] = [[0, 1.62], [1.8, -1.4], [-1.8, -1.4], 0.34];
      const mid = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
      const corner = (p, from, to, first) => {
        const len = (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1]);
        const t0 = Math.min(0.2, (r * 2.2) / len(p, from)), t1 = Math.min(0.2, (r * 2.2) / len(p, to));
        const [p0, p1] = [mid(p, from, t0), mid(p, to, t1)];
        if (first) s.moveTo(p0[0], p0[1]); else s.lineTo(p0[0], p0[1]);
        s.quadraticCurveTo(p[0], p[1], p1[0], p1[1]);
      };
      corner(a, c, b, true);
      corner(b, a, c, false);
      corner(c, b, a, false);
      s.closePath();
      geo = new THREE.ExtrudeGeometry(s, { depth: 0.7, bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.36, bevelSegments: 14, curveSegments: 48 });
      geo.center();
      patch = `float patchAt(vec3 p, vec3 n) { float f = smoothstep(0.55, 0.85, n.z);
        float m = max(max(smoothstep(0.07, -0.07, tri(p.xy - vec2(0.0, 0.62), 0.36) - 0.07), smoothstep(0.07, -0.07, tri(p.xy - vec2(-0.78, -0.62), 0.36) - 0.07)), smoothstep(0.07, -0.07, tri(p.xy - vec2(0.78, -0.62), 0.36) - 0.07));
        return f * m; }`;
    } else {
      geo = new RoundedBoxGeometry(2.3, 3.0, 1.5, 24, 0.42);
      patch = `float patchAt(vec3 p, vec3 n) { float f = smoothstep(0.55, 0.85, n.z);
        return f * max(rr(p.xy, vec2(0.0, 0.62), vec2(0.4, 0.33), 0.1), max(rr(p.xy, vec2(-0.7, -0.5), vec2(0.42, 0.29), 0.1), rr(p.xy, vec2(0.7, -0.5), vec2(0.42, 0.29), 0.1))); }`;
    }
  return furShells(geo, { patch, key: kind, ...opts });
}

/* The colours' names in 3D (2026-11-09, the user: the reels' own way — the word
   itself, puffed up, in a vivid colour; a picture of an apple would teach the
   apple). Real letters (`TextGeometry`, three's bold font) with a deep rounded
   bevel, normals smoothed so each stroke reads as inflated, then the same fur
   felt as the shapes. About `height` tall, centred. */
const WORD_COLORS = { red: 0xe6192b, blue: 0x1b63e8, yellow: 0xffd400, green: 0x1fb53a, orange: 0xff7a0a, purple: 0x8a2be2, pink: 0xff2d92, brown: 0x8b4a1f, black: 0x26232e, white: 0xeaf1ff };
function furWord(font, text, color, { height = 1, shells = 12, length = 0.016, dens = 110, top = color } = {}) {
  /* One letter at a time, so each gets its own breathing room (the bevel swells
     a letter outward and `TextGeometry` alone would let neighbours touch). */
  const unit = 1 / font.data.resolution;
  const parts = [];
  let x = 0;
  for (const ch of text) {
    const letter = new TextGeometry(ch, { font, size: 1, depth: 0.4, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.1, bevelOffset: 0, bevelSegments: 10 });
    letter.translate(x, 0, 0);
    parts.push(letter);
    x += font.data.glyphs[ch].ha * unit + 0.17;
  }
  let geo = mergeGeometries(parts);
  geo.center();
  geo.deleteAttribute("uv");
  geo.deleteAttribute("normal");
  geo = mergeVertices(geo, 1e-4);
  geo.computeVertexNormals();
  /* `top`: a second colour the letters fade into upward (the seasons' words). */
  const g = furShells(geo, { green: color, pink: top, dens, length, shells, key: "word", shade: [0.97, 1.12], patch: "float patchAt(vec3 p, vec3 n) { return smoothstep(-0.3, 0.42, p.y); }" });
  geo.computeBoundingBox();
  g.userData.size = geo.boundingBox.getSize(new THREE.Vector3());
  g.scale.setScalar(height / g.userData.size.y);
  return g;
}

/* A lathe from a 2D profile (x = radius, y = height). */
const lathe = (points, segments = 160) =>
  new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), segments);

/* A lathe through a smooth curve: the profile's points are only guides. */
const smoothLathe = (points, segments = 160) =>
  new THREE.LatheGeometry(new THREE.SplineCurve(points.map(([x, y]) => new THREE.Vector2(x, y))).getPoints(72), segments);

function roundedShapeExtrude(shape, depth, bevel) {
  return new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 8, curveSegments: 64 });
}

/* A flat 2D shape lying on the ground, `height` thick. */
function flat(shape, height, bevel, material) {
  const geo = roundedShapeExtrude(shape, height, bevel);
  geo.center();
  const m = mesh(geo, material);
  m.rotation.x = -Math.PI / 2;
  m.position.y = height / 2 + bevel;
  return m;
}

const BH = 0.12;
const ON_BLANKET = BH + 0.01;

/* ---------- The blankets ---------- */
const BLANKETS = {
  // pink with cream stripes — the circles' picnic
  pinkStripes() {
    const g = new THREE.Group();
    const BW = 5.7, BD = 4.7;
    g.add(mesh(new RoundedBoxGeometry(BW, BH, BD, 6, 0.06), clay(0xf58fb8, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 })));
    for (let i = -2; i <= 2; i++) {
      const stripe = mesh(new RoundedBoxGeometry(0.5, 0.02, BD - 0.02, 2, 0.01), clay(0xffe3ee, { clearcoat: 0.05, roughness: 0.9, sheen: 0.2 }));
      stripe.position.set(i * 1.1, BH / 2, 0);
      g.add(stripe);
    }
    g.position.set(0, BH / 2, 0.05);
    g.rotation.y = -0.06;
    return g;
  },
  // mint with three wide cream bands across — the squares' picnic
  mintBands() {
    const g = new THREE.Group();
    const BW = 5.7, BD = 4.8;
    g.add(mesh(new RoundedBoxGeometry(BW, BH, BD, 6, 0.06), clay(0x8fdcc0, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 })));
    for (const z of [-1.5, 0, 1.5]) {
      const band = mesh(new RoundedBoxGeometry(BW - 0.02, 0.02, 0.34, 2, 0.01), clay(0xf2fff8, { clearcoat: 0.05, roughness: 0.9, sheen: 0.2 }));
      band.position.set(0, BH / 2, z);
      g.add(band);
    }
    g.position.set(0, BH / 2, 0.05);
    g.rotation.y = 0.05;
    return g;
  },
  // sky blue with thin cream stripes down it — the triangles' picnic
  blueStripes() {
    const g = new THREE.Group();
    const BW = 5.7, BD = 4.8;
    g.add(mesh(new RoundedBoxGeometry(BW, BH, BD, 6, 0.06), clay(0x8cc4f2, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 })));
    for (let i = -3; i <= 3; i++) {
      const stripe = mesh(new RoundedBoxGeometry(0.16, 0.02, BD - 0.02, 2, 0.01), clay(0xeef7ff, { clearcoat: 0.05, roughness: 0.9, sheen: 0.2 }));
      stripe.position.set(i * 0.8, BH / 2, 0);
      g.add(stripe);
    }
    g.position.set(0, BH / 2, 0.05);
    g.rotation.y = -0.04;
    return g;
  },
  // a round sunny-yellow blanket with a cream ring — the rectangles' picnic
  yellowRound() {
    const g = new THREE.Group();
    g.add(mesh(new THREE.CylinderGeometry(2.75, 2.75, BH, 160), clay(0xffd873, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 })));
    const ring = mesh(new THREE.TorusGeometry(2.45, 0.09, 12, 160), clay(0xfff6dc, { clearcoat: 0.05, roughness: 0.9 }));
    ring.rotation.x = Math.PI / 2;
    ring.scale.z = 0.25;
    ring.position.y = BH / 2;
    g.add(ring);
    g.position.set(0, BH / 2, 0.1);
    return g;
  },
  // cream with a soft sky-blue gingham — the reds' picnic
  creamChecks() {
    const g = new THREE.Group();
    const BW = 5.7, BD = 4.8;
    g.add(mesh(new RoundedBoxGeometry(BW, BH, BD, 6, 0.06), clay(0xfff3dc, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 })));
    const check = clay(0xcfe6fb, { clearcoat: 0.05, roughness: 0.9, sheen: 0.2 });
    for (let i = -3; i <= 3; i++) {
      const down = mesh(new RoundedBoxGeometry(0.36, 0.02, BD - 0.02, 2, 0.01), check);
      down.position.set(i * 0.8, BH / 2, 0);
      g.add(down);
    }
    for (let j = -2; j <= 2; j++) {
      const across = mesh(new RoundedBoxGeometry(BW - 0.02, 0.022, 0.36, 2, 0.01), check);
      across.position.set(0, BH / 2, j * 0.9);
      g.add(across);
    }
    g.position.set(0, BH / 2, 0.05);
    g.rotation.y = 0.04;
    return g;
  },
  // plain lilac with a deeper border — the whites' picnic (white shows on it)
  lilacPlain() {
    const g = new THREE.Group();
    const BW = 5.7, BD = 4.8;
    g.add(mesh(new RoundedBoxGeometry(BW, BH, BD, 6, 0.06), clay(0xb9a6ee, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 })));
    const inner = mesh(new RoundedBoxGeometry(BW - 0.6, 0.02, BD - 0.6, 4, 0.01), clay(0xc9baf3, { clearcoat: 0.05, roughness: 0.9 }));
    inner.position.y = BH / 2;
    g.add(inner);
    g.position.set(0, BH / 2, 0.05);
    g.rotation.y = -0.05;
    return g;
  },
};

/* ---------- Nova's soups ---------- */

/* What each soup comes out as: its color and the pieces floating in it. */
const SOUPS = {
  /* Nova's vegetable soup: carrot, potato and broccoli (the corn and the
     one-vegetable soups went 2026-10-12). */
  mix: { color: 0xf3ad5e, pieces: ["coin", "cube", "floret", "coin", "cube", "floret", "coin", "leaf"] },
};
const PIECES = {
  coin: () => mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.035, 32), clay(0xe0661a, { clearcoat: 0.5 })),
  cube: () => mesh(new RoundedBoxGeometry(0.13, 0.08, 0.13, 3, 0.03), clay(0xf3e2b4, { roughness: 0.7 })),
  floret() {
    const f = new THREE.Group();
    for (const [x, z] of [[0, 0], [0.06, 0.03], [-0.04, 0.05]]) {
      const bud = mesh(new THREE.SphereGeometry(0.06, 20, 12), clay(0x3f8f3a, { roughness: 0.75 }));
      bud.position.set(x, 0, z);
      f.add(bud);
    }
    return f;
  },
  leaf() {
    const leaf = mesh(new THREE.SphereGeometry(0.05, 20, 12), clay(0x5aa846));
    leaf.scale.set(1.4, 0.3, 0.8);
    return leaf;
  },
};

/* ---------- The things ---------- */
const ITEMS = {
  plate() {
    const g = new THREE.Group();
    g.add(mesh(lathe([[0, 0.0], [0.62, 0.0], [0.7, 0.04], [0.74, 0.1], [0.98, 0.16], [1.02, 0.2], [0.99, 0.23], [0.72, 0.15], [0.6, 0.07], [0, 0.07]]), clay(0xfffaf0, { clearcoat: 0.8, clearcoatRoughness: 0.15, roughness: 0.35 })));
    const rim = mesh(new THREE.TorusGeometry(0.97, 0.035, 24, 160), clay(0x8cc8f5));
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 0.215;
    g.add(rim);
    return g;
  },
  donut() {
    const g = new THREE.Group();
    const dough = mesh(new THREE.TorusGeometry(0.5, 0.26, 48, 160), clay(0xe9b574));
    dough.rotation.x = Math.PI / 2;
    dough.scale.set(1, 1, 0.8);
    dough.position.y = 0.21;
    g.add(dough);
    const icing = mesh(new THREE.TorusGeometry(0.5, 0.235, 48, 160), clay(0xf9a3c7, { clearcoat: 0.9, clearcoatRoughness: 0.1, roughness: 0.3 }));
    icing.rotation.x = Math.PI / 2;
    icing.scale.set(1, 1, 0.55);
    icing.position.y = 0.3;
    g.add(icing);
    const colors = [0xffffff, 0x8cc8f5, 0xffe07a, 0x9be38f, 0xc9a8f5];
    for (let i = 0; i < 26; i++) {
      const a = rand() * Math.PI * 2, r = 0.5 + (rand() - 0.5) * 0.28;
      const s = mesh(new THREE.CapsuleGeometry(0.022, 0.07, 4, 8), clay(colors[i % colors.length], { clearcoat: 0.9 }));
      s.position.set(Math.cos(a) * r, 0.43, Math.sin(a) * r);
      s.rotation.set(Math.PI / 2, 0, rand() * Math.PI);
      g.add(s);
    }
    return g;
  },
  cookie() {
    const g = new THREE.Group();
    g.add(mesh(lathe([[0, 0], [0.62, 0], [0.7, 0.04], [0.72, 0.1], [0.7, 0.16], [0.62, 0.2], [0, 0.21]]), clay(0xe7b57a, { clearcoat: 0.2, roughness: 0.75 })));
    const spots = [[0.2, 0.15], [-0.25, 0.2], [0.05, -0.3], [-0.35, -0.2], [0.38, -0.12], [-0.05, 0.42], [0.3, 0.38], [-0.45, 0.12]];
    for (const [x, z] of spots) {
      const chip = mesh(new THREE.SphereGeometry(0.075, 24, 16), clay(0x7a4a2c, { clearcoat: 0.6 }));
      chip.scale.y = 0.55;
      chip.position.set(x, 0.21, z);
      g.add(chip);
    }
    return g;

      const c = curve.getPoint(t);
      const k = Math.max(0.2, Math.sin(Math.PI * t) ** 0.55);
      for (let j = 0; j <= R; j++) {
        const idx = i * (R + 1) + j;

  // the series' star (2026-11-12, from the user's two stills of episode 1): a plump gold
  // star with big brown eyes — `sad` as it is when it falls (brows up in the middle, a
  // small frown), `happy` once it is found (a smile, cheeks), `plain` with no face: the
  // star a Learn course's gold chest gives
  fallenStar(mood = "sad") {
    const g = new THREE.Group();
    /* The outline: five points, every corner (tips and hollows) round. */
    const shape = new THREE.Shape();
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + Math.PI / 2;
      const r = i % 2 ? 0.5 : 0.9;
      pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
    }
    pts.forEach((pt, i) => {
      const prev = pts[(i + 9) % 10], next = pts[(i + 1) % 10];
      const cut = i % 2 ? 0.34 : 0.36;
      const a = pt.clone().lerp(prev, cut), b = pt.clone().lerp(next, cut);
      if (i === 0) shape.moveTo(a.x, a.y);
      else shape.lineTo(a.x, a.y);
      shape.quadraticCurveTo(pt.x, pt.y, b.x, b.y);
    });
    shape.closePath();
    /* A pillow: a deep round bevel, its normals smoothed so it reads as inflated. */
    let geo = new THREE.ExtrudeGeometry(shape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.27, bevelSize: 0.13, bevelSegments: 28, curveSegments: 64 });
    geo.center();
    geo.deleteAttribute("uv");
    geo = mergeVertices(geo, 1e-4);
    geo.computeVertexNormals();
    /* Lighter in the middle, a warmer orange out at the points. */
    const mid = new THREE.Color(0xffe066), rim = new THREE.Color(0xff9d14);
    tint(geo, (v) => [mid.clone().lerp(rim, Math.min(1, Math.hypot(v.x, v.y) / 1.0) ** 1.5), 0]);
    const glow = mood === "sad" ? 0.12 : 0.26;
    const body = mesh(geo, new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.52, clearcoat: 0.3, clearcoatRoughness: 0.45, sheen: 0.6, sheenColor: 0xfff0c0, emissive: 0xff9a1e, emissiveIntensity: glow }));
    g.add(body);
    const front = 0.31;
    /* Small lights in its skin. */
    const speck = new THREE.MeshBasicMaterial({ color: 0xfff3b8, toneMapped: false });
    for (const [x, y, r] of [[0.07, 0.66, 0.02], [-0.56, 0.2, 0.017], [0.66, 0.12, 0.018], [0.36, -0.5, 0.017], [-0.32, -0.56, 0.015], [-0.14, 0.5, 0.012], [0.52, 0.34, 0.011], [-0.62, -0.02, 0.011]]) {
      const dot = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), speck);
      dot.position.set(x, y, front + 0.002);
      g.add(dot);
    }
    if (mood === "plain") return g;
    const happy = mood === "happy";
    const brown = soft(0x6b3618, { roughness: 0.5 });
    const white = soft(0xfffaf2, { roughness: 0.35, clearcoat: 0.6 });
    const iris = soft(0x9a5222, { roughness: 0.3, clearcoat: 0.9, clearcoatRoughness: 0.1 });
    const pupil = soft(0x2a1208, { roughness: 0.25, clearcoat: 1 });
    const shine = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
    const stroke = (points, thick, material = brown) => mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map(([x, y]) => new THREE.Vector3(x, y, 0))), 32, thick, 12), material);
    for (const s of [-1, 1]) {
      const eye = new THREE.Group();
      const ball = mesh(new THREE.SphereGeometry(0.155, 48, 32), white);
      ball.scale.set(1, 1.06, 0.3);
      eye.add(ball);
      const ring = mesh(new THREE.SphereGeometry(0.112, 40, 28), iris);
      ring.scale.set(1, 1, 0.3);
      ring.position.set(-s * 0.012, happy ? 0 : 0.008, 0.03);
      eye.add(ring);
      const dark = mesh(new THREE.SphereGeometry(0.064, 32, 24), pupil);
      dark.scale.set(1, 1, 0.3);
      dark.position.set(-s * 0.012, happy ? 0 : 0.008, 0.052);
      eye.add(dark);
      for (const [x, y, r] of [[0.04, 0.05, 0.03], [-0.035, -0.04, 0.014]]) {
        const glint = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), shine);
        glint.position.set(x - s * 0.012, y, 0.075);
        eye.add(glint);
      }
      /* Its upper lid, a dark line over the eye. */
      const lid = stroke([[-0.15, 0.03], [-0.09, 0.135], [0, 0.17], [0.09, 0.135], [0.15, 0.03]], 0.014);
      lid.position.z = 0.02;
      eye.add(lid);
      eye.scale.setScalar(1.28);
      eye.position.set(s * 0.25, 0.04, front);
      g.add(eye);
      /* The brow: up in the middle when sad, a soft arch when happy. */
      const brow = happy
        ? stroke([[-0.12, 0.36], [0, 0.415], [0.12, 0.36]], 0.02)
        : stroke([[-s * 0.15, 0.45], [-s * 0.03, 0.42], [s * 0.14, 0.33]], 0.026);
      brow.position.set(s * 0.26, 0, front - 0.01);
      g.add(brow);
      if (happy) {
        const blush = mesh(new THREE.SphereGeometry(0.075, 24, 16), soft(0xff8e7a, { clearcoat: 0, sheen: 0.2 }));
        blush.scale.set(1.3, 0.75, 0.2);
        blush.position.set(s * 0.45, -0.17, front - 0.03);
        g.add(blush);
      }
    }
    const mouth = happy
      ? stroke([[-0.15, -0.25], [-0.08, -0.33], [0, -0.355], [0.08, -0.33], [0.15, -0.25]], 0.024)
      : stroke([[-0.1, -0.36], [-0.05, -0.31], [0, -0.295], [0.05, -0.31], [0.1, -0.36]], 0.021);
    mouth.position.z = front - 0.01;
    g.add(mouth);
    return g;
  },

/* ---------- Nova's garden (Fruits & Vegetables: pick them) ----------
   `?harvest=<food>` — seen from the front and a little above: a sky, the
   grass, the tree (the bed, the stalks) with five of the food on it and
   Nova's basket on the grass. `GARDENS[food]` says what grows where. */

const SKY = 0xdbecfa; // `--brand` 16% on white, the Pop sky

/* A tube along a curve, `r0` thick at its start and `r1` at its end, its
   ends rounded off. */
function taperTube(points, r0, r1, material, segments = 48) {
  const curve = new THREE.CatmullRomCurve3(points.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
  const R = 24;
  const geo = new THREE.TubeGeometry(curve, segments, 1, R);
  const pos = geo.attributes.position;
  for (let i = 0; i <= segments; i++) {
    const c = curve.getPointAt(i / segments);
    const k = r0 + (r1 - r0) * (i / segments);
    for (let j = 0; j <= R; j++) {
      const idx = i * (R + 1) + j;
      pos.setXYZ(idx, c.x + (pos.getX(idx) - c.x) * k, c.y + (pos.getY(idx) - c.y) * k, c.z + (pos.getZ(idx) - c.z) * k);
    }
  }
  geo.computeVertexNormals();
  const g = new THREE.Group();
  g.add(mesh(geo, material));
  for (const [t, r] of [[0, r0], [1, r1]]) {
    const cap = mesh(new THREE.SphereGeometry(r, 24, 16), material);
    cap.position.copy(curve.getPointAt(t));
    g.add(cap);
  }
  return g;
}

const turf = (color) => clay(color, { clearcoat: 0.05, roughness: 0.9, sheen: 0 });

/* The grass from `near` out to `far`, and two soft hills on its edge. */
function gardenGround(far = 12, near = 6) {

    hill.scale.y = far < 12 ? 0.22 : 0.4;

/* A tomato plant: a vine winding up a wooden stake, leaves all the way up
   — the tomatoes (the videos' own) hang on it as the garden's foods. */
function tomatoPlant() {
  const g = new THREE.Group();
  g.add(taperTube([[0, 0, -0.25], [0, 1.6, -0.25], [0, 3.1, -0.25]], 0.09, 0.07, clay(0xa0703f, { roughness: 0.8, clearcoat: 0.1 })));
  const vine = clay(0x5a9a3a, { roughness: 0.6, clearcoat: 0.2 });

    const t = i / 12;

  });

     0 sends it right, π left), rising up the vine, each with a smaller
     one beside it. */
  for (let i = 0; i < 16; i++) {

    for (const [len, w, lift] of [[1.05, 0.46, 0.45], [0.6, 0.28, -0.15]]) {

      l.rotation.set(0.25, side + (i % 4 < 2 ? 0.25 : -0.25), lift);
      g.add(l);

  return { group: g };
}

/* Several plants in one garden, side by side: `[maker, x, scale]` each.
   What stands in front of the food (a bed's near half) is cut at its own
   z, wherever the plant now stands. */
function plants(list) {
  return () => {
    const group = new THREE.Group();
    const front = [];
    for (const [maker, x, scale] of list) {
      const plant = maker();
      plant.group.scale.setScalar(scale);
      plant.group.position.x = x;
      group.add(plant.group);
      for (const [part, cut] of plant.front ?? []) front.push([part, cut * scale]);
    }
    return { group, front };
  };
}

      slat.position.set(0, h / 6 + i * (h / 3), z);

  for (const x of [-w / 2 + 0.12, w / 2 - 0.12]) {
    const end = mesh(new RoundedBoxGeometry(0.24, h, d + 0.2, 4, 0.06), post);

/* ---------- Nova's seasons: one tree through the year ----------
   `?season=<spring|summer|fall|winter>` — a round clay island, its side in
   the season's color, and a tree with a face on it. The island alone is the picture
   before the season comes;
   each of its four `steps` brings one more of it (the grass, the leaves…),
   so the frames add up — every frame one whole render, so whatever comes
   stands in front of or behind the rest as it should. Softer, matter clay
   than the picnics, and the friends' face (eyes with a shine, pink
   cheeks) on the tree, the sun and the snowman. */

const soft = (color, extra = {}) =>
  clay(color, { roughness: 0.72, clearcoat: 0.12, clearcoatRoughness: 0.5, sheen: 0.6, sheenRoughness: 0.7, ...extra });

/* Where the soil is — the tree and everything on the island stand on it. */
const SOIL_Y = 0.8;

/* The friends' face, looking out along +z, on a round surface of radius
   `round` (each feature sits back on the curve); `k` scales it. Without
   its smile for a face that has its own mouth (a dog's). */
function kawaii(k = 1, round = 0, smile = true) {
  const g = new THREE.Group();
  const back = (x) => (round ? Math.sqrt(Math.max(0, round * round - x * x)) - round : 0);
  const ink = soft(0x33242e, { roughness: 0.3, clearcoat: 0.9, clearcoatRoughness: 0.15 });
  const shine = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
  const cheek = soft(0xff9cb9, { clearcoat: 0, sheen: 0.2 });
  for (const s of [-1, 1]) {
    const x = s * 0.24 * k;
    const eye = mesh(new THREE.SphereGeometry(0.115 * k, 32, 24), ink);
    eye.scale.set(0.92, 1.12, 0.55);
    eye.position.set(x, 0.1 * k, back(x));
    g.add(eye);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.04 * k, 16, 12), shine);
    glint.position.set(x - 0.035 * k, 0.15 * k, back(x) + 0.06 * k);
    g.add(glint);
    const cx = s * 0.42 * k;
    const blush = mesh(new THREE.SphereGeometry(0.1 * k, 24, 16), cheek);
    blush.scale.set(1.25, 0.72, 0.3);
    blush.position.set(cx, -0.06 * k, back(cx) - 0.005);
    g.add(blush);
  }
  if (smile) {
    const mouth = mesh(new THREE.TorusGeometry(0.09 * k, 0.026 * k, 12, 32, Math.PI), ink);
    mouth.rotation.z = Math.PI;
    mouth.position.set(0, -0.02 * k, back(0) + 0.01);
    g.add(mouth);
  }
  return g;
}

/* The tree's branches: [points, thick, thin] — bare in winter, under the
   leaves the rest of the year. */
const BRANCHES = [
  [[[0, 1.65, 0], [-0.62, 2.22, 0.05], [-1.3, 2.78, 0]], 0.26, 0.12],
  [[[0, 1.7, 0], [0.66, 2.28, 0.05], [1.34, 2.82, 0]], 0.26, 0.12],
  [[[0, 1.85, 0], [0.08, 2.55, 0], [-0.04, 3.22, -0.05]], 0.24, 0.11],
  [[[-0.78, 2.4, 0.04], [-0.9, 2.92, 0.05], [-0.8, 3.36, 0]], 0.12, 0.07],

/* The crown: [x, y, z, r] — round puffs over the branches. */
const CROWN = [[0, 3.25, -0.25, 1.15], [-1.02, 2.8, -0.1, 0.86], [1.02, 2.8, -0.1, 0.86], [-0.56, 3.88, -0.35, 0.8], [0.6, 3.83, -0.35, 0.8], [0, 2.52, 0.28, 0.72]];

/* A point on a crown puff's front, `dx`, `dy` from its centre, and which
   way it faces there. */
function onCrown([x, y, z, r], dx, dy) {
  const n = new THREE.Vector3(dx / r, dy / r, Math.sqrt(Math.max(0, 1 - (dx * dx + dy * dy) / (r * r))));
  return { at: new THREE.Vector3(x + n.x * r, y + n.y * r, z + n.z * r), n };
}

/* The tree with a face: a chubby trunk, wide at the root, and its bare
   branches. Its face looks out over the island. */
function seasonTree() {
  const g = new THREE.Group();
  const bark = soft(0xb07b50);
  g.add(mesh(smoothLathe([[0, -0.05], [1.0, -0.05], [0.76, 0.15], [0.63, 0.5], [0.59, 1.05], [0.53, 1.6], [0.43, 1.98], [0, 2.1]]), bark));
  for (const [points, r0, r1] of BRANCHES) g.add(taperTube(points, r0, r1, bark));
  const face = kawaii(1.05, 0.6);
  face.position.set(0, 0.98, 0.6);
  g.add(face);
  return g;
}

/* The island: a thick round slab in the season's color with the soil on
   top — the picture before the season comes. */
/* The island's top: a soft cap a little inside its band. */
const ISLAND_TOP = [[0, 0.55], [2.92, 0.55], [2.98, 0.66], [2.88, 0.77], [2.6, SOIL_Y], [1.8, SOIL_Y], [0.9, SOIL_Y], [0, SOIL_Y]];
/* The band in the season's color, and the soil on it — the soil apart, as
   the first step covers it (`soil` is hidden from then on). */
function seasonIsland(color) {
  const group = new THREE.Group();
  group.add(mesh(smoothLathe([[0, 0], [2.7, 0], [2.98, 0.08], [3.06, 0.3], [3.04, 0.5], [2.96, 0.6], [0, 0.6]]), soft(color)));
  const soil = mesh(smoothLathe(ISLAND_TOP), soft(0xe4cba7));
  group.add(soil);
  return { group, soil };
}

/* What covers the island instead of the soil: grass (the very same cap,
   green) or snow (thicker, its lip bulging over the band). */
function groundCover(color, snow = false) {
  const profile = snow ? [[0, 0.55], [3.0, 0.55], [3.1, 0.66], [3.02, 0.86], [2.76, 0.98], [0, 0.98]] : ISLAND_TOP;
  return mesh(smoothLathe(profile), soft(color, snow ? { sheen: 0.9 } : {}));
}

/* The crown, puff by puff — `colors` go round the puffs. */
function crown(colors) {
  const g = new THREE.Group();
  CROWN.forEach(([x, y, z, r], i) => {
    const puff = mesh(new THREE.SphereGeometry(r, 64, 48), soft(colors[i % colors.length]));
    puff.position.set(x, y, z);
    g.add(puff);
  });
  return g;
}

/* Things dotted over the crown's front, each facing out: [puff, dx, dy]. */
const ON_CROWN = [[0, -0.45, 0.35], [0, 0.4, 0.5], [0, 0.05, -0.2], [1, -0.3, 0.1], [2, 0.3, 0.05], [3, -0.15, 0.25], [4, 0.2, 0.2], [5, -0.3, -0.05], [5, 0.35, 0.1], [1, 0.15, -0.4], [2, -0.2, -0.38]];
function dotCrown(make, { lift = 0.05, spots = ON_CROWN, upright = false } = {}) {
  const g = new THREE.Group();
  spots.forEach(([puff, dx, dy], i) => {
    const { at, n } = onCrown(CROWN[puff], dx, dy);
    const thing = make(i);
    thing.position.copy(at).addScaledVector(n, lift);
    /* A blossom faces out; an apple hangs, its stem up. */
    if (!upright) thing.lookAt(thing.position.clone().add(n));
    g.add(thing);
  });
  return g;
}

/* A blossom facing +z: five round petals and a yellow heart. */
function blossom(color = 0xffa6cf) {
  const g = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + Math.PI / 2;
    const petal = mesh(new THREE.SphereGeometry(0.11, 24, 16), soft(color));
    petal.scale.set(1, 1, 0.4);
    petal.position.set(Math.cos(a) * 0.11, Math.sin(a) * 0.11, 0);
    g.add(petal);
  }
  const heart = mesh(new THREE.SphereGeometry(0.07, 20, 14), soft(0xffd23a));
  heart.scale.z = 0.6;
  heart.position.z = 0.04;
  g.add(heart);
  return g;
}

/* A tulip: a stem, two long leaves and a cup of three petals. */
function tulip(color) {
  const g = new THREE.Group();
  const green = soft(0x5fbf58);
  g.add(taperTube([[0, 0, 0], [0.03, 0.4, 0], [0, 0.8, 0]], 0.045, 0.04, green));
  for (const s of [-1, 1]) {
    const leaf = mesh(new THREE.SphereGeometry(0.1, 24, 16), green);
    leaf.scale.set(0.7, 3.2, 0.45);
    leaf.position.set(s * 0.12, 0.3, 0.02);
    leaf.rotation.z = -s * 0.42;
    g.add(leaf);
  }
  const petal = soft(color);
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + Math.PI / 2;
    const p = mesh(new THREE.SphereGeometry(0.15, 32, 24), petal);
    p.scale.set(0.82, 1.3, 0.72);
    p.position.set(Math.cos(a) * 0.075, 0.95, Math.sin(a) * 0.075);
    g.add(p);
  }
  return g;
}

/* A butterfly facing +z, its wings a little open. */
function butterfly() {
  const g = new THREE.Group();
  const ink = soft(0x5a3d7a);
  const body = mesh(new THREE.CapsuleGeometry(0.06, 0.4, 8, 16), ink);
  g.add(body);
  for (const s of [-1, 1]) {
    for (const [y, r, color] of [[0.12, 0.26, 0xb98cf0], [-0.15, 0.18, 0xff9cc8]]) {
      const wing = mesh(new THREE.SphereGeometry(r, 32, 24), soft(color));
      wing.scale.set(1, 0.85, 0.22);
      wing.position.set(s * r * 0.95, y, -0.04);
      wing.rotation.y = s * 0.35;
      g.add(wing);
    }
    const feeler = taperTube([[0, 0.24, 0], [s * 0.06, 0.38, 0.02], [s * 0.13, 0.48, 0.03]], 0.014, 0.014, ink);
    g.add(feeler);
    const tip = mesh(new THREE.SphereGeometry(0.035, 12, 8), ink);
    tip.position.set(s * 0.13, 0.48, 0.03);
    g.add(tip);

}

/* A maple leaf facing +z: five pointed lobes (soft at the edges) and a
   stem. */
const MAPLE = [[0, 0.95], [0.16, 0.6], [0.36, 0.72], [0.33, 0.4], [0.74, 0.5], [0.6, 0.22], [0.86, 0.06], [0.46, -0.12], [0.5, -0.36], [0.16, -0.26], [0.04, -0.42]];
function mapleLeaf(color) {
  const s = new THREE.Shape();
  const outline = [...MAPLE, ...MAPLE.slice().reverse().map(([x, y]) => [-x, y])];
  outline.forEach(([x, y], i) => (i ? s.lineTo(x * 0.5, y * 0.5) : s.moveTo(x * 0.5, y * 0.5)));
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelSegments: 6, curveSegments: 8 });
  geo.translate(0, 0, -0.02);
  const g = new THREE.Group();
  g.add(mesh(geo, soft(color)));
  const stem = mesh(new THREE.CapsuleGeometry(0.02, 0.22, 6, 10), soft(0x9a5a2c));
  stem.position.set(0, -0.3, 0.02);
  g.add(stem);
  return g;
}

/* A pumpkin: eight round ribs, a stem and a curly leaf. */
function pumpkin() {
  const g = new THREE.Group();
  const orange = soft(0xff8a2e);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;

    rib.position.set(Math.cos(a) * 0.24, 0.32, Math.sin(a) * 0.24);

  const leaf = mesh(new THREE.SphereGeometry(0.12, 24, 16), soft(0x6cbf58));
  leaf.scale.set(1.5, 0.3, 0.9);
  leaf.position.set(-0.16, 0.62, 0.08);
  leaf.rotation.z = 0.4;

/* A snowflake facing +z: three crossed bars, a little V on each arm. */
function snowflake() {
  const g = new THREE.Group();
  const ice = soft(0xeef7ff, { sheen: 0.9 });
  for (let i = 0; i < 3; i++) {
    const bar = mesh(new THREE.CapsuleGeometry(0.035, 0.62, 6, 10), ice);
    bar.rotation.z = (i * Math.PI) / 3;
    g.add(bar);
  }
  for (let i = 0; i < 6; i++) {
    const a = (i * Math.PI) / 3 + Math.PI / 2;
    for (const s of [-1, 1]) {
      const barb = mesh(new THREE.CapsuleGeometry(0.026, 0.12, 6, 8), ice);
      barb.position.set(Math.cos(a) * 0.22 + Math.cos(a + s * 0.9) * 0.07, Math.sin(a) * 0.22 + Math.sin(a + s * 0.9) * 0.07, 0);
      barb.rotation.z = a + s * 0.9 - Math.PI / 2;
      g.add(barb);
    }
  }
  const heart = mesh(new THREE.SphereGeometry(0.07, 16, 12), ice);
  heart.scale.z = 0.6;
  g.add(heart);
  return g;
}

/* Snow lying on the branches, and a cap where they meet. */
function snowOnBranches() {
  const g = new THREE.Group();
  const snow = soft(0xfbfdff, { sheen: 0.9 });
  const up = new THREE.Vector3(0, 1, 0);
  for (const [points, r0, r1] of BRANCHES) {
    const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
    const tip = mesh(new THREE.SphereGeometry(r1 * 1.55, 24, 16), snow);
    tip.scale.y = 0.75;
    tip.position.copy(curve.getPointAt(1)).add(new THREE.Vector3(0, r1 * 0.65, 0));
    g.add(tip);
    /* Along a branch that leans out (not an upright one), a ridge of snow
       on its top side. */
    if (Math.abs(curve.getTangentAt(0.5).y) > 0.85) continue;
    const ridge = [0.3, 0.55, 0.8, 1].map((u) => {
      const along = curve.getTangentAt(u);
      const n = up.clone().addScaledVector(along, -up.dot(along)).normalize();
      return curve.getPointAt(u).addScaledVector(n, (r0 + (r1 - r0) * u) * 0.62).toArray();
    });
    g.add(taperTube(ridge, r0 * 0.58, r1 * 0.95, snow));
  }
  const cap = mesh(new THREE.SphereGeometry(0.44, 32, 24), snow);
  cap.scale.y = 0.5;
  cap.position.set(0, 2.05, 0.05);
  g.add(cap);
  return g;
}

/* The snowman, with the friends' cheeks. */
function snowfriend() {
  const g = ITEMS.snowman();
  const cheek = soft(0xff9cb9, { clearcoat: 0, sheen: 0.2 });

    blush.scale.set(1.2, 0.7, 0.35);
    blush.position.set(s * 0.18, 1.74, 0.24);
    blush.rotation.y = s * 0.6;
    g.add(blush);

  return g;
}

/* The sun, with the friends' face. */
function sunfriend() {
  const g = new THREE.Group();
  const face = mesh(new THREE.SphereGeometry(0.62, 64, 48), soft(0xffc93a));
  face.scale.z = 0.6;
  g.add(face);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const ray = mesh(new THREE.CapsuleGeometry(0.11, 0.16, 8, 16), soft(0xffa53a));
    ray.position.set(Math.cos(a) * 0.86, Math.sin(a) * 0.86, 0);
    ray.rotation.z = a - Math.PI / 2;
    g.add(ray);
  }
  const look = kawaii(1.05, 0.37 / 0.6);
  look.position.z = 0.37;
  g.add(look);
  return g;
}

/* A gable: walls `w` wide, `d` deep, `h` tall in `wall`, a triangle on
   the front and back up to the ridge (`rise` higher) and two roof slabs
   that overhang a little. Front to +z. */
function gableHouse(w, d, h, rise, wall, roof) {
  const g = new THREE.Group();
  const box = mesh(new RoundedBoxGeometry(w, h, d, 4, 0.05), wall);
  box.position.y = h / 2;
  g.add(box);
  const tri = new THREE.Shape();
  tri.moveTo(-w / 2, 0); tri.lineTo(w / 2, 0); tri.lineTo(0, rise); tri.closePath();
  const gable = mesh(new THREE.ExtrudeGeometry(tri, { depth: d - 0.04, bevelEnabled: false }), wall);
  gable.position.set(0, h - 0.01, -(d - 0.04) / 2);
  g.add(gable);
  const slope = Math.atan2(rise, w / 2);
  const len = Math.hypot(rise, w / 2) + 0.16;
  for (const s of [-1, 1]) {
    const slab = mesh(new RoundedBoxGeometry(len, 0.09, d + 0.18, 3, 0.035), roof);
    slab.rotation.z = -s * slope;
    slab.position.set(s * (w / 4 + 0.03), h + rise / 2 + 0.05, 0);
    g.add(slab);
  }
  return g;
}

  rim.position.y = 0.4;

  const cushion = mesh(new THREE.SphereGeometry(0.56, 64, 32), velvet(0xffb3d4));
  cushion.scale.set(1, 0.3, 1);
  cushion.position.y = 0.24;
  g.add(cushion);
  const print = velvet(0x8a6fd0);
  const pad = mesh(new THREE.SphereGeometry(0.075, 24, 16), print);
  pad.scale.set(1.25, 1, 0.35);
  pad.position.set(0, 0.17, 0.76);
  g.add(pad);
  for (const [x, y] of [[-0.1, 0.26], [-0.035, 0.295], [0.035, 0.295], [0.1, 0.26]]) {

  return g;

  const door = mesh(new THREE.ExtrudeGeometry(arch, { depth: 0.03, bevelEnabled: false }), velvet(0x5a3a2c));

/* The fish's bowl: round glass, water, sand, pebbles and a water plant. */
function fishbowl() {
  const g = new THREE.Group();
  const R = 0.62, OPEN = 0.55, LEVEL = 0.95;
  const arc = (r, top, steps = 40) => {
    const from = -Math.PI / 2 + 0.3;
    return Array.from({ length: steps + 1 }, (_, i) => {
      const a = from + ((top - from) * i) / steps;
      return [r * Math.cos(a), R + r * Math.sin(a)];
    });
  };
  const bottom = R + R * Math.sin(-Math.PI / 2 + 0.3);
  const glass = mesh(lathe([[0, bottom], ...arc(R, Math.PI / 2 - OPEN)], 96), new THREE.MeshPhysicalMaterial({ color: 0xe4f4ff, roughness: 0.08, clearcoat: 1, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false }));
  glass.castShadow = false;
  glass.position.y = -bottom;
  g.add(glass);

  const rim = mesh(new THREE.TorusGeometry(rimR, 0.035, 16, 96), velvet(0xeaf6ff));
  rim.rotation.x = Math.PI / 2;
  rim.castShadow = false;
  rim.position.y = R + R * Math.sin(Math.PI / 2 - OPEN) - bottom;

  const sand = mesh(new THREE.SphereGeometry(0.36, 48, 24), velvet(0xf5d58a));
  sand.scale.set(1, 0.3, 1);
  sand.position.y = 0.12;
  g.add(sand);
  for (const [x, z, color] of [[-0.22, 0.2, 0xff8cc6], [0.05, 0.3, 0xffd31a], [0.26, 0.12, 0x9b86e0]]) {
    const pebble = mesh(new THREE.SphereGeometry(0.07, 20, 14), velvet(color));
    pebble.scale.y = 0.7;
    pebble.position.set(x, 0.21, z);

  }
  for (const [x, z, h, sway] of [[-0.12, -0.12, 0.62, 0.08], [0.1, -0.18, 0.5, -0.07], [-0.3, -0.05, 0.42, -0.06]]) {
    g.add(taperTube([[x, 0.12, z], [x + sway, 0.12 + h * 0.35, z], [x - sway, 0.12 + h * 0.7, z], [x + sway * 0.5, 0.12 + h, z]], 0.045, 0.025, velvet(0x34b34a)));
  }

}

/* ---------- Nova's fruits, the friends' way (2026-10-08) ----------
   The Fruits course's eight foods remade in the friends' look (direct
   request: "prettier, clay, a little noise, childlike, not too real — like
   the characters and the buttons"): chubby shapes, matte velvety clay (no
   gloss, a soft sheen at the edges like the friends' felt) and the
   friends' own face — big eyes with a purple iris, a white shine and a
   little gold heart, pink cheeks, an open smile. The grain is added after
   cropping (`crop.py things … --grain`), the overlay the clay buttons
   wear. `?thing=fruit&arg=<food>`; and Nova's cup (`?thing=cup`), the one
   the cups game hides a food under — no face, so the three are alike. */

const velvet = (color, extra = {}) =>
  new THREE.MeshPhysicalMaterial({
    color,
    roughness: 0.88,
    metalness: 0,
    specularIntensity: 0.35,
    sheen: 0.9,
    sheenRoughness: 0.45,
    sheenColor: new THREE.Color(color).lerp(new THREE.Color(0xffffff), 0.6),
    ...extra,
  });

/* A face part, painted on a canvas. */
function painted(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function heart(x, cx, cy, s) {
  x.beginPath();
  x.moveTo(cx, cy + s * 0.9);
  x.bezierCurveTo(cx - s * 1.5, cy - s * 0.1, cx - s * 0.6, cy - s * 1.2, cx, cy - s * 0.35);
  x.bezierCurveTo(cx + s * 0.6, cy - s * 1.2, cx + s * 1.5, cy - s * 0.1, cx, cy + s * 0.9);
  x.fill();
}

/* The friends' eye: a dark rim, a purple iris that lightens downwards, a
   big shine, a small one and a little gold heart. */
const EYE = painted(256, 256, (x) => {
  x.fillStyle = "#24152f";
  x.beginPath();
  x.ellipse(128, 128, 110, 124, 0, 0, Math.PI * 2);
  x.fill();
  const iris = x.createLinearGradient(0, 30, 0, 236);
  iris.addColorStop(0, "#2a0c44");
  iris.addColorStop(0.5, "#5a239a");
  iris.addColorStop(1, "#b27ff0");
  x.fillStyle = iris;
  x.beginPath();
  x.ellipse(128, 136, 94, 104, 0, 0, Math.PI * 2);
  x.fill();
  x.fillStyle = "#fff";
  x.beginPath();
  x.ellipse(88, 82, 36, 38, 0, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.arc(172, 168, 14, 0, Math.PI * 2);
  x.fill();
  x.fillStyle = "#ffd447";
  heart(x, 128, 196, 17);
});

/* An open smile: a dark mouth, a pink tongue and one little tooth. */
const MOUTH = painted(256, 200, (x) => {
  x.fillStyle = "#7b1b36";
  x.beginPath();
  x.moveTo(30, 44);
  x.quadraticCurveTo(128, 70, 226, 44);
  x.bezierCurveTo(232, 150, 182, 192, 128, 192);
  x.bezierCurveTo(74, 192, 24, 150, 30, 44);
  x.fill();
  x.save();
  x.clip();
  x.fillStyle = "#ff7e95";
  x.beginPath();
  x.ellipse(128, 204, 80, 62, 0, 0, Math.PI * 2);
  x.fill();
  x.restore();
  x.fillStyle = "#fff";
  x.beginPath();
  x.moveTo(66, 50);
  x.quadraticCurveTo(84, 58, 100, 59);
  x.quadraticCurveTo(90, 74, 84, 86);
  x.quadraticCurveTo(74, 66, 66, 50);

});

const CHEEK = painted(128, 128, (x) => {
  const blush = x.createRadialGradient(64, 64, 4, 64, 64, 62);

/* A carrot's line: a short curved stroke, a deeper orange. */
const LINE = painted(128, 64, (x) => {

/* A cup's dot: plain cream. */
const SPOT = painted(64, 64, (x) => {
  x.fillStyle = "#fff4dc";
  x.beginPath();
  x.arc(32, 32, 30, 0, Math.PI * 2);
  x.fill();

const decal = (map, extra = {}) =>
  new THREE.MeshPhysicalMaterial({ map, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, roughness: 0.8, ...extra });
const EYE_PAINT = decal(EYE, { roughness: 0.4, clearcoat: 0.35, clearcoatRoughness: 0.35 });
const MOUTH_PAINT = decal(MOUTH, { roughness: 0.55 });
const CHEEK_PAINT = decal(CHEEK, { roughness: 0.9 });
const LINE_PAINT = decal(LINE, { roughness: 0.9 });
const SPOT_PAINT = decal(SPOT, { roughness: 0.88 });

/* Paint `material` onto whichever of `onto` a ray from the front meets at
   (x, y): a decal of w × h, following the surface it lands on. */
const facing = new THREE.Raycaster();
function paint(onto, x, y, w, h, material) {
  facing.set(new THREE.Vector3(x, y, 20), new THREE.Vector3(0, 0, -1));
  const hit = facing.intersectObjects(onto, false)[0];
  if (!hit) throw new Error(`nothing to paint at ${x}, ${y}`);
  const part = new THREE.Mesh(new DecalGeometry(hit.object, hit.point, new THREE.Euler(0, 0, 0), new THREE.Vector3(w, h, Math.max(w, h) * 1.6)), material);
  part.renderOrder = 1;
  return part;
}

/* The friends' face on the front of `onto` (meshes of `g`), its middle at
   (cx, cy), `k` its size. `g` must still stand where it was made — the
   decals are worked out in the world and added to it. Without its smile
   (`mouth: false`) for a face whose mouth goes elsewhere — on a muzzle. */
function friendFace(g, onto, cx, cy, k = 1, { eyes = 0.22, cheeks = 0.37, mouth = true } = {}) {
  g.updateMatrixWorld(true);
  for (const s of [-1, 1]) {
    g.add(paint(onto, cx + s * cheeks * k, cy - 0.11 * k, 0.24 * k, 0.15 * k, CHEEK_PAINT));
    g.add(shiny(paint(onto, cx + s * eyes * k, cy + 0.06 * k, 0.245 * k, 0.275 * k, EYE_PAINT)));
  }
  if (mouth) g.add(shiny(paint(onto, cx, cy - 0.15 * k, 0.23 * k, 0.18 * k, MOUTH_PAINT)));
  return g;
}

/* The eyes and the mouth are glossy, not felt: `crop.py --grain` keeps
   its grain off them (the `face` mask). */
const shiny = (part) => {
  part.userData.shiny = true;
  return part;
};

/* White where the eyes and mouth are, black elsewhere — they are on the
   thing's front, so drawn alone (each as a white cut-out of its own
   painting) they show exactly where they will be. */
const cutouts = new Map();
const WHITE_CUT = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
function cutout(map) {
  /* A shiny part with no painting (the videos' 3D eyes) is white all over. */
  if (!map) return WHITE_CUT;
  if (!cutouts.has(map)) {
    const c = document.createElement("canvas");
    c.width = map.image.width;
    c.height = map.image.height;
    const x = c.getContext("2d");
    x.drawImage(map.image, 0, 0);
    x.globalCompositeOperation = "source-in";
    x.fillStyle = "#fff";
    x.fillRect(0, 0, c.width, c.height);
    cutouts.set(map, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, toneMapped: false }));
  }
  return cutouts.get(map);
}
function shinyMask() {
  const shown = new Map();
  scene.traverse((o) => {
    if (o.isMesh) shown.set(o, [o.visible, o.material]);
  });
  for (const o of shown.keys()) {
    o.visible = Boolean(o.userData.shiny);
    if (o.visible) o.material = cutout(o.material.map);
  }
  renderer.setClearColor(0x000000, 1);
  const url = frame();
  renderer.setClearColor(0x000000, 0);
  for (const [o, [visible, material]] of shown) {
    o.visible = visible;
    o.material = material;
  }
  return url;
}

/* A plump leaf, lying along +x from its stalk end. */
function plumpLeaf(length, width, material) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(length * 0.42, width, length, 0);
  s.quadraticCurveTo(length * 0.42, -width, 0, 0);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.02, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelSegments: 8, curveSegments: 40 });
  geo.translate(0, 0, -0.01);
  return mesh(geo, material);
}

/* Push every vertex of `geo` out along its normal by `f(vertex)`. */
function swell(geo, f) {
  geo.computeVertexNormals();
  const pos = geo.attributes.position;
  const nor = geo.attributes.normal;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const d = f(v);
    pos.setXYZ(i, v.x + nor.getX(i) * d, v.y + nor.getY(i) * d, v.z + nor.getZ(i) * d);
  }
  geo.computeVertexNormals();
  return geo;
}


/* Nova's cup, upside down: gold clay with a cream lip and a knob on top. */
function cup() {
  const g = new THREE.Group();
  g.add(mesh(smoothLathe([[0, 0.12], [0.58, 0.12], [0.6, 0.16], [0.57, 0.36], [0.46, 1.0], [0.41, 1.1], [0.28, 1.15], [0, 1.16]]), velvet(0xf6c445)));
  const cream = velvet(0xfff1d6);
  const lip = mesh(new THREE.TorusGeometry(0.585, 0.085, 32, 128), cream);
  lip.rotation.x = Math.PI / 2;
  lip.position.y = 0.1;
  g.add(lip);
  const knob = mesh(new THREE.SphereGeometry(0.13, 48, 32), cream);
  knob.scale.y = 0.8;
  knob.position.y = 1.2;
  g.add(knob);
  g.updateMatrixWorld(true);
  for (const [x, y] of [[0, 0.62], [-0.3, 0.36], [0.3, 0.36], [-0.27, 0.86], [0.27, 0.86], [-0.48, 0.62], [0.48, 0.62]]) g.add(paint([g.children[0]], x, y, 0.15, 0.15, SPOT_PAINT));
  return g;
}

    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), new THREE.MeshBasicMaterial({ colorWrite: false }));

/* ---------- Bloo's weather (2026-10-08) ----------
   ONE place in all four pictures — Bloo's hill: a round hill on a band of
   Bloo's blue, his little house (a blue roof) and a round tree — under the
   weather, so the difference between the pictures IS the weather (the
   Seasons rule): the sun and flowers; a rain cloud, its drops and puddles;
   a cloud blowing, swirls of wind, the tree bent, leaves flying and a
   kite; snow over everything, a snowman and snowflakes. The friends' look:
   velvet clay, the grain (`crop.py weather`) and the friends' face on the
   sun, the clouds and the snowman. `?thing=weather&arg=<weather>`; an
   unseen box gives all four the same frame. */
const HILL = [[0, 1.1], [1.0, 1.06], [2.0, 0.92], [2.6, 0.72], [2.78, 0.52]];
/* How high the hill's top is at (x, z). */
function hillY(x, z) {
  const r = Math.hypot(x, z);
  for (let i = 1; i < HILL.length; i++) {
    const [r0, y0] = HILL[i - 1], [r1, y1] = HILL[i];
    if (r <= r1) return y0 + ((y1 - y0) * (r - r0)) / (r1 - r0);
  }
  return HILL[HILL.length - 1][1];
}
const onHill = (thing, x, z, turn = 0) => {
  thing.position.set(x, hillY(x, z), z);
  thing.rotation.y = turn;
  return thing;
};

/* The round hill alone: Bloo's blue band and its top in `top`. */
function hillBase(top) {
  const g = new THREE.Group();
  g.add(mesh(smoothLathe([[0, 0], [2.48, 0], [2.74, 0.1], [2.82, 0.3], [2.76, 0.46], [0, 0.46]]), velvet(0x6bb8f0)));
  g.add(mesh(smoothLathe([[0, 0.4], [2.72, 0.4], [2.8, 0.52], [2.6, 0.72], [2.0, 0.92], [1.0, 1.06], [0, 1.1]]), velvet(top)));
  return g;
}

/* The hill: Bloo's blue band, its grassy (or snowy) top, his house and a
   tree. `lean` bends the tree in the wind. */
function bloosHill({ snowy = false, lean = 0 } = {}) {
  const g = hillBase(snowy ? 0xfbfdff : 0x78cf5c);
  /* His house: cream walls, a blue roof, a round door, a yellow window. */
  const house = gableHouse(1.0, 0.84, 0.7, 0.46, velvet(0xfdf3e3), velvet(0x4f9fe6));
  const door = mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.04, 40), velvet(0x3b6fb8));
  door.rotation.x = Math.PI / 2;
  door.scale.z = 1.35;
  door.position.set(-0.18, 0.24, 0.43);
  house.add(door);
  const window_ = mesh(new RoundedBoxGeometry(0.24, 0.22, 0.04, 3, 0.04), velvet(0xffd86b));
  window_.position.set(0.22, 0.42, 0.43);
  house.add(window_);
  if (snowy) {
    for (const s of [-1, 1]) {
      const cap = mesh(new RoundedBoxGeometry(0.72, 0.1, 1.06, 3, 0.05), velvet(0xfbfdff));
      cap.rotation.z = -s * Math.atan2(0.46, 0.5);
      cap.position.set(s * 0.27, 0.7 + 0.29, 0);
      house.add(cap);
    }
  }
  g.add(onHill(house, -1.1, -0.35, 0.4));
  /* The tree: a trunk and three round puffs. */
  const tree = new THREE.Group();
  tree.add(taperTube([[0, 0, 0], [0.02, 0.5, 0], [0, 1.0, 0]], 0.13, 0.09, velvet(0x9a5a2c)));
  for (const [x, y, r, color] of [[0, 1.42, 0.52, 0x5cbd57], [-0.36, 1.12, 0.36, 0x6cc85a], [0.36, 1.14, 0.38, 0x52b450]]) {
    const puff = mesh(new THREE.SphereGeometry(r, 48, 32), velvet(color));
    puff.position.set(x, y, 0);
    tree.add(puff);
    if (snowy) {
      const snow = mesh(new THREE.SphereGeometry(r * 0.94, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2.6), velvet(0xfbfdff));
      snow.position.set(x, y + r * 0.12, 0);
      tree.add(snow);
    }
  }
  tree.rotation.z = lean;
  g.add(onHill(tree, 1.3, -0.5));
  return g;
}

/* A daisy facing +z, on a short stem. */
function hillFlower(petals) {
  const g = new THREE.Group();
  g.add(taperTube([[0, 0, 0], [0.02, 0.18, 0], [0, 0.34, 0]], 0.025, 0.022, velvet(0x4fb444)));
  for (let i = 0; i < 6; i++) {

    const p = mesh(new THREE.SphereGeometry(0.06, 20, 14), velvet(petals));
    p.scale.set(1.6, 0.8, 0.5);
    p.position.set(Math.cos(a) * 0.09, 0.38 + Math.sin(a) * 0.09, 0);
    p.rotation.z = a;

  }
  const middle = mesh(new THREE.SphereGeometry(0.06, 20, 14), velvet(0xffcf3d));
  middle.position.set(0, 0.38, 0.03);

function weatherSun() {

/* A cloud of round puffs in `color`, with the friends' face on the big

function weatherCloud(color) {

/* A raindrop, its point up. */
function raindrop() {

/* A snowflake facing +z, in velvet. */
function velvetFlake() {
  const g = new THREE.Group();
  const ice = velvet(0xf3f9ff);
  for (let i = 0; i < 3; i++) {
    const bar = mesh(new THREE.CapsuleGeometry(0.04, 0.6, 6, 10), ice);
    bar.rotation.z = (i * Math.PI) / 3;
    g.add(bar);
  }
  for (let i = 0; i < 6; i++) {
    const a = (i * Math.PI) / 3 + Math.PI / 2;
    for (const s of [-1, 1]) {
      const barb = mesh(new THREE.CapsuleGeometry(0.03, 0.12, 6, 8), ice);
      barb.position.set(Math.cos(a) * 0.22 + Math.cos(a + s * 0.9) * 0.07, Math.sin(a) * 0.22 + Math.sin(a + s * 0.9) * 0.07, 0);
      barb.rotation.z = a + s * 0.9 - Math.PI / 2;
      g.add(barb);
    }
  }
  return g;
}

/* ---------- The videos' look (2026-10-12) ----------
   The things as the course videos draw them (direct request: "the same
   style as the videos" — their stills in `public/things-in-videos/`):
   the vegetables smooth satin clay, true to life, no face, coloured per
   vertex (`tint`). The grain stays (`crop.py things … --grain`). The
   animals are the videos' own, cut out of the stills (`cut.py`) — the
   shell-fur 3D puppy that came first went 2026-10-13. */

/* `geo` with a part's own scale, turn and place baked in. */
function bake(geo, { scale = [1, 1, 1], at = [0, 0, 0], rot = [0, 0, 0] } = {}) {
  const m = new THREE.Matrix4().compose(new THREE.Vector3(...at), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), new THREE.Vector3(...scale));
  geo.applyMatrix4(m);
  geo.computeVertexNormals();
  return geo;
}

/* Colour per vertex: `paint(p, n)` → [THREE.Color, …] at the point `p`
   (the thing's own space) with normal `n`. */
function tint(geo, paint) {
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const colors = new Float32Array(pos.count * 3);
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    n.fromBufferAttribute(nor, i);
    const [c] = paint(p, n);
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  return geo;
}

/* Smooth satin clay for the videos' vegetables, coloured per vertex. */
const satin = (extra = {}) => new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.48, clearcoat: 0.18, clearcoatRoughness: 0.45, sheen: 0.35, sheenRoughness: 0.5, sheenColor: 0xffffff, ...extra });

const smooth = (t) => t * t * (3 - 2 * t);

/* The videos' carrot: fat at its rounded shoulder, tapering to a blunt
   round tip, curved grooves across its front (deeper orange in them),
   smooth satin clay; a fan of short, chubby olive leaves on top. No face.
   Leaning `tilt` alone; upright in Nova's carrot bed; without its `leaves`
   under the soil while it grows (they are a layer of their own there). */
function videoCarrot(tilt = -0.32, leaves = true) {
  const g = new THREE.Group();
  const geo = new THREE.LatheGeometry(new THREE.SplineCurve([[0, 0], [0.08, 0.02], [0.18, 0.13], [0.3, 0.42], [0.4, 0.82], [0.47, 1.17], [0.49, 1.38], [0.44, 1.53], [0.28, 1.62], [0, 1.65]].map(([x, y]) => new THREE.Vector2(x, y))).getPoints(220), 180);
  /* Each groove: its height, the way it faces and how far round it goes. */
  const GROOVES = [[0.3, 0.2, 1.2], [0.47, -0.5, 1.4], [0.64, 0.4, 1.5], [0.81, -0.2, 1.6], [0.98, 0.6, 1.5], [1.15, -0.4, 1.6], [1.31, 0.1, 1.4]];
  const deep = (v) => {
    const a = Math.atan2(v.x, v.z);
    let d = 0;
    for (const [y, face, reach] of GROOVES) {
      const off = Math.atan2(Math.sin(a - face), Math.cos(a - face));
      const arc = Math.max(0, 1 - Math.abs(off) / reach);
      /* Curved: lower at its middle, rising round the sides. */
      const at = y - 0.045 * Math.cos(off);
      d = Math.max(d, smooth(arc) * Math.exp(-(((v.y - at) / 0.026) ** 2)));
    }
    return d;
  };
  swell(geo, (v) => -0.03 * deep(v));
  const orange = new THREE.Color(0xef6e22), groove = new THREE.Color(0xbd4c16), shoulder = new THREE.Color(0xf47e2c);
  tint(geo, (v) => {
    const c = orange.clone().lerp(shoulder, Math.max(0, (v.y - 1.2) * 2));
    return [c.lerp(groove, deep(v) * 0.85), 0];
  });
  g.add(mesh(geo, satin({ roughness: 0.36, clearcoat: 0.32 })));
  g.rotation.z = tilt;
  if (!leaves) return g;
  /* The leaves: short chubby stalks, fanned out flat. */
  const olive = [new THREE.Color(0xa7b14c), new THREE.Color(0x95a543)];
  [[-1.05, 0.1, 0.38], [-0.62, 0.12, 0.46], [-0.2, 0.1, 0.5], [0.22, 0.1, 0.5], [0.64, 0.12, 0.46], [1.05, 0.1, 0.38]].forEach(([fan, lean, h], i) => {
    const leaf = new THREE.CapsuleGeometry(0.085, h, 12, 24);
    leaf.translate(0, h / 2 + 0.06, 0);
    bake(leaf, { scale: [1, 1, 0.8], at: [Math.sin(fan) * 0.12, 1.55, 0], rot: [lean, 0, fan] });
    tint(leaf, (v) => [olive[i % 2].clone().lerp(new THREE.Color(0xc3c76a), Math.max(0, (v.y - 1.75) * 1.4)), 0]);
    g.add(mesh(leaf, satin({ roughness: 0.55 })));
  });
  return g;
}

/* `tint` every mesh of a group (a `taperTube` is a tube and its two round
   caps), each at its own place in the group. */
function tintAll(g, paint) {
  g.traverse((o) => {
    if (o.isMesh) tint(o.geometry, (p, n) => paint(p.clone().add(o.position), n));
  });
  return g;
}

/* A soft value noise in 3D (seeded hash), 0–1 — for mottled skins. */
function noise3(x, y, z) {
  const h = (a, b, c) => {
    const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
    return v - Math.floor(v);
  };
  const [ix, iy, iz] = [Math.floor(x), Math.floor(y), Math.floor(z)];
  const [fx, fy, fz] = [x - ix, y - iy, z - iz].map((t) => t * t * (3 - 2 * t));
  let v = 0;
  for (const [dx, wx] of [[0, 1 - fx], [1, fx]]) for (const [dy, wy] of [[0, 1 - fy], [1, fy]]) for (const [dz, wz] of [[0, 1 - fz], [1, fz]]) v += h(ix + dx, iy + dy, iz + dz) * wx * wy * wz;
  return v;
}

/* The videos' potato: a plump oval, tan with soft darker patches, a few
   small dark eyes sunk in it, a little lumpy. */
function videoPotato() {
  const geo = bake(new THREE.SphereGeometry(1, 128, 96), { scale: [0.62, 0.44, 0.46] });
  const EYES = [[0.2, 0.18, 0.4], [-0.32, 0.1, 0.35], [0.42, -0.05, 0.22], [-0.05, 0.3, 0.28], [-0.45, -0.12, 0.2], [0.1, -0.22, 0.38], [0.5, 0.2, 0], [-0.2, -0.3, 0.3], [0.32, 0.32, 0.1], [-0.12, 0.05, 0.45], [0.05, 0.42, -0.1], [-0.4, 0.28, 0.05], [0.28, -0.28, 0.2], [-0.3, -0.05, -0.3], [0.45, 0.05, -0.25], [0.0, -0.4, 0.05], [-0.15, 0.25, -0.35], [0.18, -0.08, -0.42]];
  const eyeAt = (v) => EYES.reduce((d, e) => Math.max(d, Math.exp(-((v.distanceTo(new THREE.Vector3(...e).normalize().multiply(new THREE.Vector3(0.62, 0.44, 0.46))) / 0.026) ** 2))), 0);
  swell(geo, (v) => 0.035 * (noise3(v.x * 3, v.y * 3, v.z * 3) - 0.5) - 0.024 * eyeAt(v));
  const tan = new THREE.Color(0xa8653a), dark = new THREE.Color(0x834826), eye = new THREE.Color(0x4a2a12);
  tint(geo, (v) => {
    const m = noise3(v.x * 5 + 3, v.y * 5, v.z * 5);
    return [tan.clone().lerp(dark, smooth(Math.min(1, Math.max(0, (m - 0.35) / 0.45))) * 0.75).lerp(eye, eyeAt(v)), 0];
  });
  const g = group(mesh(geo, satin({ roughness: 0.6, clearcoat: 0.14, sheen: 0.12 })));
  g.rotation.set(0.25, -0.35, 0.12);
  return g;
}

/* The same potato growing in Nova's potato bed: lying on the soil, a
   little sprout of leaves on top. */
function videoPotatoPlant() {
  const g = new THREE.Group();
  const potato = videoPotato();
  potato.rotation.set(0, -0.2, 0);
  potato.position.y = 0.44;
  g.add(potato);
  const green = satin({ roughness: 0.55 });
  const leafG = new THREE.Color(0x5f9e36);
  g.add(tintAll(taperTube([[0, 0.8, -0.05], [0.01, 0.96, -0.05], [0, 1.08, -0.05]], 0.035, 0.03, green), () => [leafG.clone(), 0]));
  for (const [a, y] of [[-0.9, 0.98], [0.9, 1.02], [-0.35, 1.12], [0.4, 1.15]]) {
    const leaf = bake(new THREE.SphereGeometry(0.12, 24, 12), { scale: [1.5, 0.4, 0.8], at: [Math.sin(a) * 0.16, y, -0.05], rot: [0, 0, a * 0.6] });
    tint(leaf, () => [leafG.clone().lerp(new THREE.Color(0x86bd4c), 0.3), 0]);
    g.add(mesh(leaf, green));
  }
  return g;
}

/* The videos' broccoli: pale green stalks branching up into dense florets,
   each a mound of small round buds, dark green with lighter tips. */
function videoBroccoli() {
  const g = new THREE.Group();
  const stalk = satin({ roughness: 0.5 });
  const pale = new THREE.Color(0x9cc456), paler = new THREE.Color(0xc4dc84);
  const tube = (pts, r0, r1) => tintAll(taperTube(pts, r0, r1, stalk), (v) => [pale.clone().lerp(paler, Math.max(0, 0.7 - v.y) * 0.9), 0]);
  /* A short thick stalk, branching into a stem per floret. */
  g.add(tube([[0, 0, 0], [0, 0.25, 0], [0, 0.45, 0]], 0.2, 0.17));
  const HEADS = [[0, 1.08, 0.06, 0.34], [-0.44, 0.92, 0.02, 0.29], [0.44, 0.92, 0.04, 0.29], [-0.24, 0.94, 0.34, 0.27], [0.26, 0.92, 0.34, 0.27], [-0.2, 1.16, -0.28, 0.26], [0.22, 1.14, -0.26, 0.26]];
  const bud = new THREE.SphereGeometry(1, 12, 8);
  const dark = new THREE.Color(0x3e7d2c), mid = new THREE.Color(0x5a9a38), light = new THREE.Color(0x86b955);
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (const [x, y, z, r] of HEADS) {
    g.add(tube([[x * 0.15, 0.4, z * 0.15], [x * 0.55, 0.62, z * 0.55], [x, y - r * 0.55, z]], 0.075, 0.06));
    const mound = bake(new THREE.SphereGeometry(r * 0.86, 48, 32), { scale: [1, 0.8, 1], at: [x, y, z] });
    tint(mound, () => [dark.clone(), 0]);
    g.add(mesh(mound, satin({ roughness: 0.8 })));
    /* Buds all over the mound's top, small and close, in a few clusters
       (a floret is florets): each cluster a bump of buds. */
    const n = Math.round(r * r * 5200);
    const buds = new THREE.InstancedMesh(bud, new THREE.MeshPhysicalMaterial({ roughness: 0.7, sheen: 0.3, sheenColor: 0xd8ffb0 }), n);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
    for (let i = 0; i < n; i++) {

      const bump = 0.08 * noise3(d.x * 6 + x * 9, d.y * 6, d.z * 6 + z * 9);
      const k = r * (0.04 + rnd() * 0.025);
      m.compose(new THREE.Vector3(x, y, z).addScaledVector(d, r * (0.84 + bump)), q, new THREE.Vector3(k, k, k));
      buds.setMatrixAt(i, m);
      buds.setColorAt(i, c.copy(dark).lerp(mid, 0.4 + rnd() * 0.6).lerp(light, Math.max(0, bump * 6 - 0.2) * 0.5 + rnd() * 0.15));
    }
    buds.castShadow = true;
    buds.receiveShadow = true;

  }

}

/* The videos' pumpkin: round and a little squat, deep ribs, glossy orange,
   a thick dark curly stem. (The video's is a carved lantern — no face
   here: the vegetables carry none.) */
function videoPumpkin() {
  const g = new THREE.Group();
  const geo = bake(new THREE.SphereGeometry(1, 192, 96), { scale: [0.78, 0.6, 0.78] });
  const RIBS = 9;
  swell(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    const rib = Math.abs(Math.cos((a * RIBS) / 2));
    const side = Math.sqrt(Math.max(0, 1 - (v.y / 0.6) ** 2));
    return -0.075 * (1 - rib) ** 2.2 * side;
  });
  /* The top and bottom pressed in round the stem. */
  swell(geo, (v) => -0.12 * Math.exp(-((v.x * v.x + v.z * v.z) / 0.02)));
  const orange = new THREE.Color(0xe45a18), deep = new THREE.Color(0xa83a0c);
  tint(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    const rib = Math.abs(Math.cos((a * RIBS) / 2));
    return [orange.clone().lerp(deep, (1 - rib) ** 2 * 0.8), 0];
  });
  g.add(mesh(geo, satin({ roughness: 0.4, clearcoat: 0.3 })));
  const stem = taperTube([[0, 0.44, 0], [0.02, 0.62, 0.01], [0.08, 0.76, 0.02], [0.18, 0.8, 0.03]], 0.1, 0.06, satin({ roughness: 0.7 }));
  tintAll(stem, (v) => [new THREE.Color(0x4f3a22).lerp(new THREE.Color(0x6e5a32), Math.max(0, (v.y - 0.5) * 2)), 0]);
  g.add(stem);
  return g;
}

/* The videos' tomato: glossy red, a little squat with soft lobes, a green
   star of pointed leaves on top and a short stalk. `unripe`: green yet
   (while it grows on the vine). */
function videoTomato(unripe = false) {
  const g = new THREE.Group();
  const geo = bake(new THREE.SphereGeometry(1, 160, 96), { scale: [0.62, 0.52, 0.6] });
  swell(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    return 0.018 * Math.cos(a * 5) * Math.max(0, 1 - Math.abs(v.y) / 0.52) - 0.06 * Math.exp(-((v.x * v.x + v.z * v.z) / 0.015)) * (v.y > 0 ? 1 : 0.4);
  });
  const [red, deep, warm] = (unripe ? [0x7fb43c, 0x5a8f2a, 0xa6cc58] : [0xd4261a, 0xa0150e, 0xe84a24]).map((c) => new THREE.Color(c));
  tint(geo, (v) => [red.clone().lerp(deep, Math.max(0, -v.y) * 0.7).lerp(warm, Math.max(0, v.y - 0.3) * 0.8), 0]);
  g.add(mesh(geo, satin({ roughness: 0.22, clearcoat: 0.7, clearcoatRoughness: 0.15 })));
  const green = satin({ roughness: 0.5 });
  const leafG = new THREE.Color(0x3f7a26), leafL = new THREE.Color(0x6a9e3a);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.2;
    const tip = [Math.cos(a) * 0.36, 0.42 + (i % 2) * 0.05, Math.sin(a) * 0.36];
    const leaf = taperTube([[0, 0.5, 0], [tip[0] * 0.55, 0.52, tip[2] * 0.55], tip], 0.045, 0.008, green);
    tintAll(leaf, (v) => [leafG.clone().lerp(leafL, Math.min(1, Math.hypot(v.x, v.z) * 2.5)), 0]);
    g.add(leaf);
  }
  const stalk = taperTube([[0, 0.46, 0], [0.01, 0.6, 0], [0.05, 0.68, 0.01]], 0.035, 0.028, green);
  tintAll(stalk, () => [leafG.clone(), 0]);
  g.add(stalk);
  return g;
}

/* The videos' bell pepper: blocky and glossy, four lobes at its bottom, a
   thick curved green stalk. `color`: red or green. */
function videoPepper(color = "red") {
  const g = new THREE.Group();
  const geo = new THREE.LatheGeometry(new THREE.SplineCurve([[0, 0.04], [0.22, 0.0], [0.44, 0.1], [0.54, 0.34], [0.55, 0.62], [0.5, 0.8], [0.36, 0.88], [0.14, 0.87], [0, 0.82]].map(([x, y]) => new THREE.Vector2(x, y))).getPoints(160), 160);
  /* The lathe's seam (its normals split there) turned to the back. */
  geo.rotateY(Math.PI);
  swell(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    const lobes = Math.abs(Math.cos(a * 2));
    return 0.07 * (lobes - 0.6) * Math.min(1, Math.hypot(v.x, v.z) * 2) - 0.12 * Math.max(0, 1 - lobes) ** 3 * Math.max(0, 0.5 - v.y);
  });
  const body = color === "red" ? [new THREE.Color(0xd02016), new THREE.Color(0x96110a)] : [new THREE.Color(0x4a9e2c), new THREE.Color(0x2a6e18)];
  tint(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    return [body[0].clone().lerp(body[1], (1 - Math.abs(Math.cos(a * 2))) * 0.6), 0];
  });
  g.add(mesh(geo, satin({ roughness: 0.2, clearcoat: 0.75, clearcoatRoughness: 0.12 })));
  const stalk = taperTube([[0, 0.8, 0], [0.01, 0.94, 0], [0.06, 1.06, 0.02], [0.16, 1.12, 0.03]], 0.07, 0.05, satin({ roughness: 0.45 }));
  tintAll(stalk, () => [new THREE.Color(0x5e9a34), 0]);
  g.add(stalk);
  const cap = bake(new THREE.SphereGeometry(0.16, 32, 16), { scale: [1, 0.35, 1], at: [0, 0.84, 0] });
  tint(cap, () => [new THREE.Color(0x5e9a34), 0]);
  g.add(mesh(cap, satin({ roughness: 0.5 })));
  g.rotation.z = -0.12;
  return g;
}
