    g.add(taperTube([[0, 0, 0.03], [0.02, 0.12, 0.03], [0.05, 0.25, 0.03]], 0.035, 0.03, velvet(darker(c, 0.15))));
    const vein = mesh(new THREE.CylinderGeometry(0.014, 0.022, 0.86, 8), velvet(lighter(c, 0.45)));
    vein.position.set(0.11, 0.67, 0.06);
    vein.rotation.z = -0.18;
    g.add(vein);
  } else if (kind === "grass") {
    /* A tuft of long blades fanning out of one clump. */
    for (let i = 0; i < 11; i++) {
      const a = (i / 11) * Math.PI * 2;
      const lean = 0.22 + (i % 3) * 0.1;
      const ht = 0.75 + ((i * 7) % 5) * 0.08;
      const [dx, dz] = [Math.cos(a) * lean, Math.sin(a) * lean * 0.6];
      g.add(taperTube([[dx * 0.1, 0, dz * 0.1], [dx * 0.5, ht * 0.55, dz * 0.5], [dx * 1.2, ht, dz * 1.2]], 0.06, 0.012, velvet(i % 2 ? c : lighter(c, 0.2)), 24));
    }
  } else if (kind === "nest") {
    /* A bowl of twigs, three pale blue eggs in it. */
    const twig = velvet(c);
    g.add(mesh(lathe([[0, 0.04], [0.42, 0.02], [0.58, 0.16], [0.62, 0.36], [0.52, 0.42], [0.45, 0.3], [0, 0.2]], 64), twig));
    for (const [y, r, tilt] of [[0.18, 0.56, 0.08], [0.28, 0.6, -0.06], [0.37, 0.56, 0.05]]) {
      const ring = mesh(new THREE.TorusGeometry(r, 0.055, 12, 64), velvet(darker(c, 0.12)));
      ring.rotation.set(Math.PI / 2 + tilt, 0, 0);
      ring.position.y = y;
      g.add(ring);
    }
    for (const [x, z, ry] of [[-0.16, 0.05, 0.3], [0.16, 0.06, -0.3], [0, -0.14, 0]]) {
      const egg = sph(0.16, velvet(0xbfe0fb));
      egg.scale.set(0.85, 1.15, 0.85);
      egg.position.set(x, 0.38, z);
      egg.rotation.z = ry;
      g.add(egg);
    }
  } else {
    /* A garden bench: slats in three pastels, white legs and arms. */
    const legs = velvet(0xfbf6ee);
    const pal = [c, 0xffd45e, 0x9cc4f2, 0xffa3c8].filter((v, i, all) => all.indexOf(v) === i);
    const slat = (i) => velvet(pal[i % 3]);
    const box = (w, h, d, m) => mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(0.05, h / 2.1, d / 2.1)), m);
    for (let i = 0; i < 3; i++) g.add(at_(box(1.8, 0.09, 0.17, slat(i)), 0, 0.5, -0.2 + i * 0.2));
    for (let i = 0; i < 3; i++) {
      const back = at_(box(1.8, 0.15, 0.08, slat(i)), 0, 0.72 + i * 0.19, -0.36 - i * 0.02);
      back.rotation.x = -0.12;
      g.add(back);
    }
    for (const sx of [-1, 1]) {
      g.add(at_(box(0.1, 0.5, 0.5, legs), sx * 0.78, 0.25, -0.05));
      g.add(at_(box(0.1, 0.65, 0.08, legs), sx * 0.78, 0.82, -0.38));
      g.add(at_(box(0.1, 0.08, 0.55, legs), sx * 0.86, 0.68, -0.08));
    }
    /* Turned a little, so its seat reads from the front. */
    g.rotation.y = 0.5;
    const turned = new THREE.Group();
    turned.add(g);
    return turned;
  }
  return g;
}
const at_ = (thing, x, y, z) => {
  thing.position.set(x, y, z);
  return thing;
};
ITEMS.garden = (arg = "flower") => {
  const [kind, tone] = arg.split("-");
  return gardenThing(kind, Number(tone ?? 0));
};

/* ---------- What Bloo's animals eat — Feed the animal (2026-11-01) ----------
   The animals' own food, in the videos' look like the vegetables (smooth
   satin, coloured per vertex, the videos' warm light — `?thing=food&arg=`,
   `@hd@float`, then `crop.py things … --grain`). No faces: they get eaten.
   Each reads at a thumb's size — one clear shape, its own colour. */

/* One colour, or a gradient by height between two. */
const coat = (geo, low, high = low, from = 0, to = 1) =>
  tint(geo, (v) => [new THREE.Color(low).lerp(new THREE.Color(high), Math.min(1, Math.max(0, (v.y - from) / (to - from)))), 0]);

const ANIMAL_FOODS = {
  /* A round pink bowl of milk — a white band round its belly, the milk
     standing a little under the rim with one slow ring on it. */
  milk() {
    const g = new THREE.Group();
    const bowl = new THREE.LatheGeometry(new THREE.SplineCurve([[0, 0], [0.42, 0], [0.5, 0.03], [0.62, 0.16], [0.74, 0.38], [0.8, 0.5], [0.78, 0.55], [0.72, 0.53], [0.66, 0.4], [0.56, 0.2], [0.4, 0.12], [0, 0.12]].map(([x, y]) => new THREE.Vector2(x, y))).getPoints(160), 160);
    bowl.rotateY(Math.PI);
    tint(bowl, (v) => {
      const r = Math.hypot(v.x, v.z);
      const band = Math.exp(-(((v.y - 0.3) / 0.045) ** 2)) * (r > 0.6 ? 1 : 0);
      return [new THREE.Color(0xf59bc0).lerp(new THREE.Color(0xfff6fa), band).lerp(new THREE.Color(0xe77aa8), Math.max(0, 0.12 - v.y) * 6), 0];
    });
    g.add(mesh(bowl, satin({ roughness: 0.25, clearcoat: 0.7, clearcoatRoughness: 0.15 })));
    const milk = new THREE.CircleGeometry(0.715, 128);
    milk.rotateX(-Math.PI / 2);
    milk.translate(0, 0.47, 0);
    swell(milk, (v) => 0.012 * Math.cos(Math.hypot(v.x, v.z) * 16) * Math.max(0, 1 - Math.hypot(v.x, v.z) / 0.7));
    tint(milk, (v) => [new THREE.Color(0xfffdf8).lerp(new THREE.Color(0xf3ece4), Math.hypot(v.x, v.z) / 0.72), 0]);
    g.add(mesh(milk, satin({ roughness: 0.12, clearcoat: 0.9, clearcoatRoughness: 0.05 })));
    return g;
  },

  /* A cartoon bone: a fat shaft, two round knuckles at each end. */
  bone() {
    const g = new THREE.Group();
    const m = satin({ roughness: 0.42 });
    const shaft = new THREE.CapsuleGeometry(0.17, 1.0, 16, 48);
    shaft.rotateZ(Math.PI / 2);
    swell(shaft, (v) => -0.03 * Math.cos((v.x / 0.6) * Math.PI * 0.5));
    coat(shaft, 0xeadcc0, 0xfff7e6, -0.2, 0.2);
    g.add(mesh(shaft, m));
    for (const x of [-0.62, 0.62]) for (const z of [-0.17, 0.17]) {
      const knob = new THREE.SphereGeometry(0.25, 64, 48);
      knob.translate(x, 0, z);
      coat(knob, 0xe6d6b8, 0xfffaf0, -0.25, 0.25);
      g.add(mesh(knob, m));
    }
    g.rotation.set(-0.5, 0.25, 0.18);
    return g;
  },

  /* Fish food: its blue tub with an orange fish on the front, the lid
     tipped open, and flakes and pellets spilled in a heap before it —
     orange, red, yellow and green. */
  fishFood() {
    const g = new THREE.Group();
    const tub = new THREE.LatheGeometry(new THREE.SplineCurve([[0, 0], [0.36, 0], [0.4, 0.04], [0.41, 0.9], [0.38, 0.95], [0, 0.95]].map(([x, y]) => new THREE.Vector2(x, y))).getPoints(80), 96);
    tint(tub, (v) => [new THREE.Color(0x4f9ff0).lerp(new THREE.Color(0xffffff), Math.exp(-(((v.y - 0.78) / 0.05) ** 2)) * 0.9), 0]);
    const body = mesh(tub, satin({ roughness: 0.3, clearcoat: 0.5 }));
    g.add(body);
    const lid = new THREE.CylinderGeometry(0.43, 0.43, 0.1, 96);
    coat(lid, 0xff6b5e, 0xff8a7a, -0.05, 0.05);
    const lidM = mesh(lid, satin({ roughness: 0.3, clearcoat: 0.5 }));
    lidM.position.set(-0.05, 1.08, -0.32);
    lidM.rotation.x = -1.1;
    g.add(lidM);
    /* The fish on its front: an oval body and a fan tail, raised. */
    const fish = new THREE.Shape();
    fish.absellipse(0, 0, 0.17, 0.11, 0, Math.PI * 2);
    const tail = new THREE.Shape();
    tail.moveTo(0.13, 0);
    tail.lineTo(0.3, 0.11);
    tail.lineTo(0.27, -0.11);
    tail.closePath();
    for (const shape of [fish, tail]) {
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 4, curveSegments: 32 });
      coat(geo, 0xff8a2a);
      const part = mesh(geo, satin({ roughness: 0.35 }));
      part.position.set(-0.06, 0.45, 0.405);
      g.add(part);
    }
    const eye = new THREE.SphereGeometry(0.022, 16, 12);
    eye.translate(-0.15, 0.475, 0.455);
    g.add(mesh(coat(eye, 0x1f1d24), satin({ roughness: 0.1 })));
    const colors = [0xff8a3d, 0xe8524a, 0xffc23d, 0x7cc95a, 0xff6f61];
    let k = 0;
    const bit = (x, y, z, flake) => {
      const geo = flake ? new THREE.CylinderGeometry(0.075, 0.075, 0.02, 7) : new THREE.SphereGeometry(0.05, 20, 14);
      if (!flake) geo.scale(1.2, 0.8, 1);
      geo.rotateX(rand() * 2);
      geo.rotateZ(rand() * 2);
      geo.translate(x, y, z);
      coat(geo, colors[k++ % colors.length]);
      g.add(mesh(geo, satin({ roughness: 0.5 })));
    };
    for (const [y, r, n] of [[0.05, 0.42, 12], [0.06, 0.24, 8], [0.14, 0.3, 8], [0.16, 0.12, 5], [0.25, 0.14, 4], [0.32, 0, 1]]) {
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + y * 9;
        bit(0.35 + Math.cos(a) * r, y, 0.62 + Math.sin(a) * r * 0.55, (i + n) % 3 === 0);
      }
    }
    g.rotation.y = -0.3;
    return g;
  },

  /* A bunch of three bananas: each a fat crescent, a green neck where
     they meet at the stem, a small dark tip at the other end — fanned out
     a little from the stem. */
  banana() {
    const g = new THREE.Group();
    const m = satin({ roughness: 0.36, clearcoat: 0.4 });
    const ARC = 1.7, R = 0.8, SEGS = 96, RING = 32;
    const curve = new THREE.CatmullRomCurve3(
      Array.from({ length: 13 }, (_, i) => {
        const a = -ARC / 2 + (ARC * i) / 12;
        return new THREE.Vector3(R * Math.sin(a), R * (1 - Math.cos(a)), 0);
      }),
    );
    const fat = (u) => 0.035 + 0.165 * Math.sin(Math.min(1, Math.max(0, (u - 0.04) / 0.94)) * Math.PI) ** 0.55;
    const one = () => {
      const geo = new THREE.TubeGeometry(curve, SEGS, 1, RING);
      const pos = geo.attributes.position;
      for (let i = 0; i <= SEGS; i++) {
        const c = curve.getPointAt(i / SEGS);
        const r = fat(i / SEGS);
        for (let j = 0; j <= RING; j++) {
          const idx = i * (RING + 1) + j;
          /* A banana has edges: five soft flats round it. */
          const dx = pos.getX(idx) - c.x, dy = pos.getY(idx) - c.y, dz = pos.getZ(idx) - c.z;
          const k = r * (1 - 0.045 * Math.cos((j / RING) * Math.PI * 10));
          pos.setXYZ(idx, c.x + dx * k, c.y + dy * k, c.z + dz * k);
        }
      }
      geo.computeVertexNormals();
      const left = curve.getPointAt(0).x, right = curve.getPointAt(1).x;
      tint(geo, (v) => {
        const u = (v.x - left) / (right - left);
        const c = new THREE.Color(0xffd83f).lerp(new THREE.Color(0xf5bf1e), Math.max(0, v.y < 0.1 ? 0.4 : 0));
        if (u < 0.14) c.lerp(new THREE.Color(0x9cb844), (1 - u / 0.14) ** 1.5);
        if (u > 0.975) c.lerp(new THREE.Color(0x5a3a22), (u - 0.975) / 0.025);
        return [c, 0];
      });
      const b = new THREE.Group();
      b.add(mesh(geo, m));
      return b;
    };
    const stemAt = curve.getPointAt(0);
    [[0.32, -0.2], [0, 0], [-0.32, 0.2]].forEach(([fan, depth]) => {
      const pivot = new THREE.Group();
      pivot.position.copy(stemAt);
      pivot.position.z = depth;
      const b = one();
      b.position.sub(stemAt);
      pivot.add(b);
      pivot.rotation.set(0, 0, fan);
      g.add(pivot);
    });
    const stem = taperTube([[stemAt.x, stemAt.y, 0], [stemAt.x - 0.08, stemAt.y + 0.12, 0], [stemAt.x - 0.12, stemAt.y + 0.28, 0]], 0.08, 0.06, satin({ roughness: 0.5 }));
    tintAll(stem, () => [new THREE.Color(0x7f8d36), 0]);
    g.add(stem);
    g.rotation.set(0.15, -0.2, -0.1);
    return g;
  },

  /* A wedge of cheese, its cut faces full of round holes. */
  cheese() {
    const L = 1.5, W = 1.0, H = 0.62;
    const geo = new THREE.BoxGeometry(1, 1, 1, 90, 40, 70);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const u = pos.getX(i) + 0.5;
      pos.setXYZ(i, u * L - L / 2, (pos.getY(i) + 0.5) * H, pos.getZ(i) * W * (1 - u * 0.96));
    }
    geo.computeVertexNormals();
    /* Holes: [x, y, z, radius] on the faces. */
    const HOLES = [[-0.45, 0.38, 0.5, 0.13], [-0.12, 0.2, 0.33, 0.09], [0.25, 0.4, 0.2, 0.07], [-0.55, 0.62, 0.0, 0.14], [-0.05, 0.62, 0.1, 0.1], [0.4, 0.62, -0.05, 0.06], [-0.75, 0.3, 0.1, 0.12], [-0.75, 0.15, -0.3, 0.08], [-0.2, 0.62, -0.3, 0.08], [0.0, 0.3, -0.34, 0.1]];
    const hole = (v) => HOLES.reduce((d, [x, y, z, r]) => Math.max(d, Math.max(0, 1 - Math.hypot(v.x - x, v.y - y, v.z - z) / r)), 0);
    swell(geo, (v) => -0.09 * Math.sqrt(hole(v)));
    tint(geo, (v) => [new THREE.Color(0xffd257).lerp(new THREE.Color(0xe9a528), Math.min(1, hole(v) * 2.2)).lerp(new THREE.Color(0xf3b73a), v.x < -L / 2 + 0.03 ? 0.7 : 0), 0]);
    const g = new THREE.Group();
    g.add(mesh(geo, satin({ roughness: 0.55, clearcoat: 0.1 })));
    g.rotation.y = 0.55;
    return g;
  },

  /* A pink earthworm, wriggling: a soft tube in an S, rings round it, a
     paler band near its head. */
  worm() {
    const pts = [];
    for (let i = 0; i <= 14; i++) {
      const t = i / 14;
      pts.push([(t - 0.5) * 1.7, 0.16 + 0.22 * Math.sin(t * Math.PI * 2.2) * (0.4 + t * 0.6), 0.12 * Math.cos(t * 5)]);
    }
    const w = taperTube(pts, 0.12, 0.16, satin({ roughness: 0.3, clearcoat: 0.45 }), 120);
    const curve = new THREE.CatmullRomCurve3(pts.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
    const along = curve.getSpacedPoints(400);
    const tAt = (v) => {
      let best = 0, bd = Infinity;
      along.forEach((p, i) => {
        const d = p.distanceToSquared(v);
        if (d < bd) [bd, best] = [d, i];
      });
      return best / 400;
    };
    tintAll(w, (v) => {
      const t = tAt(v);
      const ring = 0.5 + 0.5 * Math.cos(t * Math.PI * 44);
      const c = new THREE.Color(0xf28a9a).lerp(new THREE.Color(0xd96479), ring * 0.45);
      return [c.lerp(new THREE.Color(0xf7b2b6), Math.exp(-(((t - 0.78) / 0.05) ** 2)) * 0.8), 0];
    });
    return w;
  },

  /* A little heap of sunflower seeds: teardrops, grey-black with pale
     stripes. */
  seeds() {
    const g = new THREE.Group();
    const seed = (x, y, z, ry, rz) => {
      const geo = new THREE.SphereGeometry(0.1, 32, 24);
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const yy = p.getY(i) / 0.1;
        p.setXYZ(i, p.getX(i) * 1.9 * (1 - 0.35 * yy), p.getY(i) * 2.6, p.getZ(i) * 0.9);
      }
      geo.computeVertexNormals();
      tint(geo, (v) => {
        const a = Math.atan2(v.z, v.x);
        const stripe = Math.max(0, Math.cos(a * 4)) ** 6;
        return [new THREE.Color(0x3b3532).lerp(new THREE.Color(0xe9e2d4), stripe * 0.85), 0];
      });
      geo.rotateZ(rz);
      geo.rotateY(ry);
      geo.translate(x, y, z);
      g.add(mesh(geo, satin({ roughness: 0.35, clearcoat: 0.4 })));
    };
    let i = 0;
    for (const [y, r, n] of [[0.1, 0.55, 9], [0.1, 0.25, 5], [0.28, 0.36, 7], [0.44, 0.15, 4], [0.58, 0, 1]]) {
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 + i++ * 0.7;
        seed(Math.cos(a) * r, y, Math.sin(a) * r * 0.8, a, 1.2 + rand() * 0.6);
      }
    }
    return g;
  },

  /* A small head of lettuce: ruffled, cupped leaves round a pale heart. */
  lettuce() {
    const g = new THREE.Group();
    const leaf = (turn, tip, size, color) => {
      const geo = new THREE.SphereGeometry(size, 96, 48, 0, Math.PI * 1.1, 0, Math.PI * 0.55);
      swell(geo, (v) => 0.05 * size * Math.sin(Math.atan2(v.z, v.x) * 13) * Math.max(0, 1 - v.y / size));
      tint(geo, (v) => {
        const rim = Math.max(0, 1 - v.y / size);
        const vein = Math.exp(-((Math.atan2(v.z, v.x) - Math.PI * 0.55) ** 2) / 0.004);
        return [new THREE.Color(color[0]).lerp(new THREE.Color(color[1]), rim).lerp(new THREE.Color(0xe9f6c8), vein * 0.6), 0];
      });
      const m = mesh(geo, satin({ roughness: 0.45, clearcoat: 0.25, side: THREE.DoubleSide }));
      m.rotation.set(tip, turn, 0);
      return m;
    };
    g.add(mesh(coat(new THREE.SphereGeometry(0.42, 64, 48), 0xd7eda0, 0xeaf7c4, 0, 0.4), satin({ roughness: 0.45 })));
    [[0, 0.45], [2.1, 0.5], [4.2, 0.45], [1.05, 0.9], [3.15, 0.95], [5.25, 0.9]].forEach(([turn, tip], i) =>
      g.add(leaf(turn, tip, i < 3 ? 0.62 : 0.72, i < 3 ? [0x9fd45a, 0x6fb53a] : [0x84c64a, 0x4f9a2c])),
    );
    g.position.y = 0.3;
    const out = new THREE.Group();
    out.add(g);
    out.scale.y = 0.85;
    return out;
  },

  /* A green cricket, side on: a long body, a round head with bead eyes,
     long feelers and big folded jumping legs. */
  cricket() {
    const g = new THREE.Group();
    const m = satin({ roughness: 0.32, clearcoat: 0.45 });
    const green = (geo, a = 0x7cc24a, b = 0xa6dc6a) => coat(geo, a, b, 0.1, 0.55);
    const body = new THREE.CapsuleGeometry(0.2, 0.7, 16, 48);
    body.rotateZ(Math.PI / 2 - 0.12);
    body.translate(0.05, 0.42, 0);
    g.add(mesh(green(body), m));
    const wing = new THREE.CapsuleGeometry(0.15, 0.62, 12, 32);
    wing.scale(1, 1, 0.5);
    wing.rotateZ(Math.PI / 2 - 0.2);
    wing.translate(0.12, 0.55, 0.06);
    g.add(mesh(green(wing, 0x5ea83a, 0x8acb57), m));
    const head = new THREE.SphereGeometry(0.21, 48, 32);
    head.translate(-0.5, 0.52, 0);
    g.add(mesh(green(head), m));
    for (const z of [-0.12, 0.12]) {
      const eye = new THREE.SphereGeometry(0.06, 24, 16);
      eye.translate(-0.62, 0.6, z);
      g.add(mesh(coat(eye, 0x1f1d24), satin({ roughness: 0.1, clearcoat: 1 })));
      const feeler = taperTube([[-0.6, 0.68, z * 0.6], [-0.85, 1.0, z * 1.5], [-0.75, 1.35, z * 2.5], [-0.45, 1.5, z * 3]], 0.022, 0.012, m, 40);
      tintAll(feeler, () => [new THREE.Color(0x5d9a36), 0]);
      g.add(feeler);
    }
    for (const z of [-0.16, 0.16]) {
      const thigh = taperTube([[0.2, 0.42, z], [0.45, 0.78, z * 1.2], [0.62, 0.62, z * 1.25]], 0.09, 0.05, m, 40);
      const shin = taperTube([[0.62, 0.62, z * 1.25], [0.55, 0.3, z * 1.3], [0.62, 0.05, z * 1.35]], 0.04, 0.03, m, 40);
      for (const leg of [thigh, shin]) {
        tintAll(leg, () => [new THREE.Color(0x6db540), 0]);
        g.add(leg);
      }
      for (const x of [-0.3, -0.05]) {
        const small = taperTube([[x, 0.32, z * 0.8], [x - 0.05, 0.15, z * 1.4], [x - 0.12, 0.03, z * 1.6]], 0.03, 0.022, m, 30);
        tintAll(small, () => [new THREE.Color(0x6db540), 0]);
        g.add(small);
      }
    }
    g.rotation.y = 0.35;
    return g;
  },
};
ITEMS.food = (what) => ANIMAL_FOODS[what]();

/* ---------- Nova's kitchen — Find It! (2026-11-01) ----------
   What else is on her counter besides the vegetables, in the videos'
   satin look: a blender, a bottle of milk, a bulb of garlic (the cheese
   is Feed the animal's). `?thing=kitchen&arg=` alone; the room is
   `kitchenRoom`, in Nova's cottage (`?world=veg`). */
const KITCHEN = {
  /* A blender: a round mint base with a dial, a frosted jar with a white
     lid, a little milk swirled in its bottom. */
  blender() {

/* Lay a thing down or turn it as its scene says, then stand it on `y`. */
function place(group, it) {
  if (it.rot) group.rotation.set(...it.rot);
  if (it.rotY) group.rotation.y = it.rotY;
  if (it.scale) group.scale.setScalar(it.scale);
  group.position.set(it.at[0], 0, it.at[2]);
  if (def && def.autoGround) {
    group.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(group);
    group.position.y = it.at[1] - box.min.y;
  } else {
    group.position.y = it.at[1];
  }
}

/* White where one of `parts` is the nearest thing, black everywhere
   else: the whole world drawn black (for its depth), then each part again
   in white, cut at its z, wherever it is the nearest. */
const black = new THREE.MeshBasicMaterial({ color: 0x000000, toneMapped: false, side: THREE.DoubleSide });
function maskOf(parts, cam = camera) {
  renderer.setClearColor(0x000000, 1);
  scene.overrideMaterial = black;
  renderer.render(scene, cam);
  scene.overrideMaterial = null;
  const layer = new THREE.Scene();
  for (const [thing, cut] of parts) {
    thing.updateMatrixWorld(true);
    const white = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      toneMapped: false,
      side: THREE.DoubleSide,
      depthFunc: THREE.LessEqualDepth,
      clippingPlanes: cut === -Infinity ? [] : [new THREE.Plane(new THREE.Vector3(0, 0, 1), -cut)],
    });
    thing.traverse((o) => {
      if (!o.isMesh) return;
      const copy = new THREE.Mesh(o.geometry, white);
      copy.matrixAutoUpdate = false;
      copy.matrix.copy(o.matrixWorld);
      layer.add(copy);
    });
  }
  renderer.autoClear = false;
  renderer.render(layer, cam);
  renderer.autoClear = true;
  return renderer.domElement.toDataURL("image/png");
}

/* A basket's mouth on the picture, % — where what is picked piles up. */
function mouthOf(basket, cam = camera) {
  basket.updateMatrixWorld(true);
  const p = new THREE.Vector3();
  let [l, t, r, b] = [Infinity, Infinity, -Infinity, -Infinity];
  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * Math.PI * 2;
    basket.localToWorld(p.set(Math.cos(a) * 0.84, 0.66, Math.sin(a) * 0.84)).project(cam);
    const x = ((p.x + 1) / 2) * 100;
    const y = ((1 - p.y) / 2) * 100;
    [l, t, r, b] = [Math.min(l, x), Math.min(t, y), Math.max(r, x), Math.max(b, y)];
  }
  return [l, t, r - l, b - t].map((v) => Math.round(v * 100) / 100);
}

  /* Bunting of Pinki's shapes along the top of the wall. */
  const bunting = (x0, x1, y0) => {
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(x0, y0, 0.3), new THREE.Vector3((x0 + x1) / 2, y0 - 0.45, 0.3), new THREE.Vector3(x1, y0, 0.3)]);

    const { colors, kinds } = THEME.bunting;
    const n = Math.round((x1 - x0) / 0.75);
    for (let k = 1; k < n; k++) {
      const p = curve.getPoint(k / n);
      const s = new THREE.Shape();
      const kind = kinds[k % 4];
      if (kind === 0) s.absarc(0, -0.28, 0.24, 0, Math.PI * 2, false);
      else if (kind === 1) { s.moveTo(-0.23, -0.04); s.lineTo(0.23, -0.04); s.lineTo(0.23, -0.5); s.lineTo(-0.23, -0.5); s.closePath(); }

  /* A poster in the class's words (2026-10-14, from the user's picture):

      g.font = `700 ${size}px Fredoka`;

      g.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + (k * Math.PI) / 5, rr = k % 2 ? r * 0.45 : r; g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }

    };
    const rainbow = (cx, cy, r, band) => {
      g.lineCap = "round";
      ["#ee4645", "#ff8c2e", "#ffd31a", "#4fbf5a", "#3f86e8", "#9257de"].forEach((col, i) => {
        g.beginPath(); g.arc(cx, cy, r - i * band, Math.PI, Math.PI * 2); g.lineWidth = band * 0.92; g.strokeStyle = col; g.stroke();
      });

    /* Nova's sprout in its pot; Bloo's sun peeping over a cloud. */
    const sprout = (cx, cy, k) => {
      g.fillStyle = "#e8924a";
      g.beginPath(); g.moveTo(cx - k * 0.7, cy - k * 0.2); g.lineTo(cx + k * 0.7, cy - k * 0.2); g.lineTo(cx + k * 0.5, cy + k * 0.8); g.lineTo(cx - k * 0.5, cy + k * 0.8); g.closePath(); g.fill();
      g.fillStyle = "#c97534"; g.fillRect(cx - k * 0.78, cy - k * 0.36, k * 1.56, k * 0.26);

    };

  /* A window onto a sunny morning: a sky with clouds and a green hill in

  const windowAt = (x, y, wd, ht) => {

    const plant = new THREE.Group();

    for (const [px, py, r] of [[0, 0.5, 0.28], [-0.22, 0.38, 0.2], [0.22, 0.4, 0.21], [0.05, 0.72, 0.17]]) { const leaf = mesh(new THREE.SphereGeometry(r, 24, 16), matte(0x7cc66a)); leaf.position.set(px, py, 0); plant.add(leaf); }

      for (let k = 0; k < 6; k++) {

    stem.position.y = 0.12;

  if (portrait) {

  }

  /* The class in front of the camera (2026-10-14, from the user's
     picture): chair backs in clay with a star cut in, the corner of a desk
     with a pencil cup and books — `crop.py classroom` blurs them, the
     camera's focus on the board. Kept low, where the page has no board. */
  const desk = new THREE.Group();
  const starShape = (r, inner = 0.45) => {
    const st = new THREE.Shape();
    for (let k = 0; k < 10; k++) {
      const a = Math.PI / 2 + (k * Math.PI) / 5, rr = k % 2 ? r * inner : r;
      k ? st.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : st.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    st.closePath();
    return st;
  };
  /* A chair's back: a soft rounded slab on two posts, a star pressed in. */
  const chairAt = (color, starColor, x, y, z, wd = 1.5, ht = 0.95, turn = 0) => {
    const g = new THREE.Group();
    const r = 0.32;
    const sh = new THREE.Shape();
    sh.moveTo(-wd / 2, -ht / 2);
    sh.lineTo(wd / 2, -ht / 2);

  /* ---------- Pinki's shape garden (2026-11-02) — the Shapes course's

  const SEAS_LOOK = {

  const LOOK = SEAS ? SEAS_LOOK[SEAS_SEASON] : null;
  const SKY = SEAS ? SEAS_WEATHER_SKY[SEAS_WEATHER] ?? LOOK.sky : ["#9fcdf2", "#cfe6f7", "#e6f1e2", "#f6f1dc"];

  const YEAR = ["spring", "summer", "fall", "winter"];
  const HILL_SEASON = YEAR_HILL ? YEAR[LESSON - 1] ?? null : null;
  const HILL_SKY = { spring: ["#9fd0f4", "#cfe6f5", "#f4efdf", "#fbf3df"], summer: ["#6fb9f0", "#a9d8f5", "#e6f3e6", "#f4f4d8"], fall: ["#a9c4e6", "#e6d4cf", "#f8dcc0", "#fbe6c6"], winter: ["#b6cbe6", "#d6e0ee", "#eaeef5", "#f4f6fa"] }[HILL_SEASON ?? "spring"];

  /* A lollipop topiary: a clipped ball on a stem, in a pot. */

  function hedgeBall(r) {

  /* A clipped cube of box hedge, in a square planter. */
  function boxTopiary(s, color) {

  /* A border of little flowers along a line — never in front of the
     things to find (`clear`: the x the Find looks at). */
  function border(x0, x1, z, colors, { k = 1, clear = true, tulips = true, gap = 0.45 } = {}) {
    for (let x = x0; x < x1; x += gap + rand() * 0.35) {
      if (clear && inFind(x)) continue;
      const f = !tulips || rand() > 0.3 ? hillFlower(colors[Math.floor(rand() * colors.length)]) : tulip(colors[Math.floor(rand() * colors.length)]);
      add(f, x, 0, z + (rand() - 0.5) * 0.5, { k: k * (0.95 + rand() * 0.35), ry: (rand() - 0.5) * 0.6 });

  /* A tall clipped hedge between two corners, its ends rounded. */

  /* ---- The four corners ---- */
  const CORNER = { 1: 0, 2: 40, 3: 80, 4: 120 };
  /* Where this lesson's Find looks (its corner + 5): nothing planted
     there stands in front of the things to find. */
  /* The forest: the places along the path, 5.6 apart — the word, the
     spelling, (a mix), then the Find; the review has five
     places and no Find. */
  const FOREST_STEPS = FARM ? (SEAS ? SEAS_STEPS : 3) : MY_GARDEN ? (MY_KIND ? 2 : 4) : !FOREST ? 0 : !COLOR_ID ? 5 : MIXES[COLOR_ID] ? 3 : 2;
  const STEP_DX = 6.8;
  /* Bloo's island of the year (2026-11-10): round, floating, its quarters the four
     seasons — the lesson's season in front (its places), the next on the right, the
     one before on the left, the opposite far behind. */
  const ISLE = SEAS ? { cx: ((FOREST_STEPS - 1) * STEP_DX) / 2, cz: -30, r: 46 } : null;
  const isleQuarter = (x, z) => {
    const a = Math.atan2(x - ISLE.cx, z - ISLE.cz);
    /* The front is widest (150°), so the lesson's season fills the view from its places. */
    const F = THREE.MathUtils.degToRad(75), B = THREE.MathUtils.degToRad(150);
    return a > B || a < -B ? 2 : a > F ? 1 : a < -F ? 3 : 0;
  };
  /* A season's lessons (1-8): the whole island is that season, a world of its own (the user,
     2026-11-10). The review (9): the four quarters, the whole year. */
  const isleSeason = (x, z) => (LESSON <= 8 ? SEAS_SEASON : SEAS_SEASONS[(SEAS_SEASONS.indexOf(SEAS_SEASON) + isleQuarter(x, z)) % 4]);
  const onIsle = (x, z, margin = 1) => Math.hypot(x - ISLE.cx, z - ISLE.cz) < ISLE.r - margin;
  const fx = VEG || YEAR_HILL || STOPS ? null : ON_PATH ? (COLOR_ID ? FOREST_STEPS * STEP_DX + 3.6 : null) : LESSON <= 4 ? CORNER[LESSON] + 5 : null;
  const inFind = (x, reach = 6.5) => fx !== null && Math.abs(x - fx) < reach;

  /* Round: a moon gate in the wall, a fountain of round bowls, lollipop
     topiaries in blue pots, hedge balls, round stepping stones. */
  function roundCorner(c) {

    /* The fountain: a wide basin, a column, a bowl, a round top. */
    const f = new THREE.Group();
    f.add(mesh(lathe([[0, 0], [2.3, 0], [2.4, 0.1], [2.4, 0.7], [2.25, 0.78], [2.05, 0.7], [2.0, 0.24], [0, 0.24]], 128), stone(0xf3e6d6)));
    const water = mesh(new THREE.CylinderGeometry(2.02, 2.02, 0.05, 96), clay(0x9fd3f2, { roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 }));

    f.add(at(mesh(lathe([[0, 0], [0.4, 0], [1.05, 0.38], [1.1, 0.5], [0.98, 0.52], [0, 0.4]], 96), stone(0xf3e6d6)), 0, 1.9, 0));
    const water2 = mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.04, 64), clay(0x9fd3f2, { roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 }));

    f.add(water2);

  /* Triangle: cone topiaries, a greenhouse with a gable, bunting. */

  /* ---- My Garden's houses and roses (2026-11-08), shared by its lessons' world

  const pickOne = (list) => list[Math.floor(rand() * list.length)];
  /* Pink cottages with a puffy round roof, an arched door, a round window. */
  function pinkCottage() {
    const g = new THREE.Group();

    g.add(at(mesh(roundedShapeExtrude(arch, 0.12, 0.05), soft(0xf28fb0, { roughness: 0.7 })), 0.6, 0, 1.68));
    g.add(at(ball(0.08, glaze(0xffc93a), 16), 1.0, 0.95, 1.86));
    const frame = at(mesh(new THREE.TorusGeometry(0.42, 0.07, 12, 48), soft(0xffffff)), -1.25, 1.85, 1.74);

    glass.rotation.x = Math.PI / 2;

    return g;
  }
  /* Rose bushes: a round green bush dotted with roses. */
  const ROSES = [0xff8fb8, 0xffb38a, 0xc7a3f0, 0x9cc4f2, 0xffffff, 0xffd0e2];
  function roseBush(k) {
    const g = new THREE.Group();
    for (const [x, y, z, r] of [[0, 0.55, 0, 0.65], [-0.6, 0.4, 0.1, 0.48], [0.62, 0.42, 0, 0.5], [0, 0.95, -0.15, 0.45]]) g.add(at(ball(r, leafy(pickOne([0x6cc46a, 0x78c777, 0x63bd66])), 28), x, y, z));

    }

    return g;
  }
  /* ---- Bloo's farm (2026-11-08): a cream barn with a blue roof, a silo,

    const g = new THREE.Group();
    const body = mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.95, 40), soft(0xf3d77f, { roughness: 0.95 }));

    const out = new THREE.Group();
    out.add(g);
    return out;

  function silo(roof = 0x6fa3e4) {

    const SPOT = portrait

      : { bug: [-2.8, 0.9], ball: [2.6, 1.1], mushroom: [-1.3, -0.9], basket: [1.2, -0.7], bird: [-2.9, -2.6], butterfly: [-0.1, -3.6], flower: [2.4, -3.0] };
    const entries = [...mine.map((k) => [k, COLOR_ID]), ...rest.map((k, i) => [k, DECOYS[COLOR_ID][i]])];
    entries.forEach(([kind, c], i) => {
      const [sx, sz] = SPOT[kind];
      const thing = KINDS[kind](c);
      thing.scale.multiplyScalar(K);
      thing.rotation.y += (rand() - 0.5) * 0.5;
      thing.position.set(fx + sx + (rand() - 0.5) * 0.3, 0, sz + (rand() - 0.5) * 0.3);
      scene.add(thing);
      things[kind] = { group: thing, shape: null, color: c, y: 0 };
    });
    keepClear.push(new THREE.Box3(new THREE.Vector3(fx - 6, -1, -4), new THREE.Vector3(fx + 6, 4, 5)));
  }
  if (HAS_FIND && !ON_PATH) {
    const pic = SCENES[PICNIC[LESSON]];
    const blanket = BLANKETS[pic.blanket]();
    if (pic.deep) blanket.scale.set(pic.deep[0], 1, pic.deep[1]);
    blanket.position.x += fx;
    blanket.position.z += FIND_Z;
    scene.add(blanket);
    keepClear.push(new THREE.Box3().setFromObject(blanket).expandByScalar(0.25));
    for (const [name, it] of Object.entries(pic.items)) {
      const thing = ITEMS[it.model ?? name](it.arg);
      place(thing, it);
      thing.position.x += fx;
      thing.position.z += FIND_Z;
      scene.add(thing);
      things[name] = { group: thing, shape: SHAPE_OF[it.model ?? name] ?? null, color: it.color ?? COLOR_OF[it.model ?? name] ?? null, y: it.at[1] };
    }
  }

  /* ---- Each activity's PLACE (2026-11-04, on request: "the camera's
     move needs a purpose"): the camera walks to where the next activity
     happens, sharp, and goes out of focus as it arrives and the activity
     comes up over it — the word on an easel, the drawing at a little
     table, the spelling among letter blocks, the Find on the picnic; the
     review's sorting at four shape boxes. ---- */
  const WOOD = soft(0xf3d3a6, { roughness: 0.8 });
  const PLACE_Z = 0.6;
  /* What the lawn's tufts keep off in Nova's garden. */
  const SHAPE_OF_LESSON = ["circle", "square", "triangle", "rectangle"];
  const SHAPE_COLOR = { circle: 0x5aa9ee, square: 0x58c27d, triangle: 0xffc93a, rectangle: 0xff8fbf };
  /* A shape's outline, about `k` across, centred. */
  function outline(shape, k = 1) {
    const s = new THREE.Shape();
    if (shape === "circle") s.absarc(0, 0, 0.5 * k, 0, Math.PI * 2, false);
    else if (shape === "triangle") {
      s.moveTo(0, 0.5 * k);
      s.lineTo(0.55 * k, -0.42 * k);
      s.lineTo(-0.55 * k, -0.42 * k);
      s.closePath();
    } else {
      const [hw, hh] = shape === "square" ? [0.45 * k, 0.45 * k] : [0.6 * k, 0.36 * k];
      s.moveTo(-hw, -hh);
      s.lineTo(hw, -hh);
      s.lineTo(hw, hh);
      s.lineTo(-hw, hh);
      s.closePath();
    }
    return s;
  }
  /* The shape standing up, facing the camera (+z). */
  const upright = (shape, k, depth, material) => {
    const m = mesh(roundedShapeExtrude(outline(shape, k), depth, Math.min(0.05, depth / 2)), material);
    m.geometry.center();
    return m;
  };

  /* The word's easel: a white board in a pink frame on three legs. */
  /* A splash of paint, about 2 across, facing +z: no shape of its own, like a
     spilled drop of water, with a few droplets round it. */
  function paintBlob(color) {
    const g = new THREE.Group();
    const [p, q, r] = [rand() * 6, rand() * 6, rand() * 6];
    const radius = (a) => 1 + 0.17 * Math.sin(3 * a + p) + 0.1 * Math.sin(5 * a + q) + 0.05 * Math.sin(8 * a + r);
    const pts = [];
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      pts.push(new THREE.Vector2(Math.cos(a) * radius(a), Math.sin(a) * radius(a) * 0.86));
    }
    const shape = new THREE.Shape();
    shape.moveTo(pts[0].x, pts[0].y);
    shape.splineThru([...pts.slice(1), pts[0]]);
    const paint = clay(color, { clearcoat: 0.8, clearcoatRoughness: 0.2, roughness: 0.35, sheen: 0 });
    g.add(mesh(roundedShapeExtrude(shape, 0.07, 0.05), paint));
    for (const [a, d, k] of [[0.5, 1.42, 0.13], [2.5, 1.4, 0.1], [4.1, 1.38, 0.15], [5.5, 1.36, 0.08]]) {
      const drop = at(ball(k, paint, 24), Math.cos(a + p) * d, Math.sin(a + p) * d * 0.8, 0.04);
      drop.scale.z = 0.5;
      g.add(drop);
    }
    return g;
  }
  function easel(splash, shape) {
    const g = new THREE.Group();
    for (const sx of [-1, 1]) {
      const leg = at(rbox(0.13, 3.0, 0.13, WOOD, 0.05), sx * 0.85, 1.45, 0.05);
      leg.rotation.set(-0.1, 0, sx * -0.1);
      g.add(leg);
    }
    const back = at(rbox(0.13, 2.9, 0.13, WOOD, 0.05), 0, 1.38, -0.55);
    back.rotation.x = 0.36;
    g.add(back);
    const board = new THREE.Group();
    board.add(rbox(2.5, 1.85, 0.1, SHAPE_LAND && shape ? soft(0xf7a1c3, { roughness: 0.95, sheen: 1 }) : glaze(0xff8fbf), 0.07));
    /* White paint needs a paper that is not white. */
    board.add(at(rbox(2.25, 1.6, 0.06, glaze(splash === PAINT.white ? 0xbfcfe6 : 0xffffff), 0.05), 0, 0, 0.05));
    if (splash !== undefined) {
      const blob = paintBlob(splash);
      blob.scale.setScalar(0.56);
      blob.position.z = 0.09;
      board.add(blob);
    }
    /* A shape lesson's word: the shape itself drawn on the board, in its colour. */
    if (shape && SHAPE_LAND) {
      /* The reels' felt shape, flattened onto the board. */
      const felt = furBody(shape, { shells: 12, dens: 120, length: 0.035 });
      const k = { circle: 0.36, square: 0.34, triangle: 0.3, rectangle: 0.3 }[shape];
      felt.scale.set(k, k, 0.12);
      felt.position.set(0, 0, 0.2);
      board.add(felt);
    } else if (shape) board.add(at(upright(shape, 1.05, 0.06, glaze(SHAPE_COLOR[shape])), 0, 0, 0.12));
    board.position.set(0, 2.05, 0.2);
    board.rotation.x = -0.1;
    g.add(board);
    g.add(at(rbox(2.6, 0.1, 0.32, WOOD, 0.04), 0, 1.07, 0.3));
    return g;
  }
  /* The drawing table: a low table, a sheet of paper, three crayons. */
  function drawingTable() {
    const g = new THREE.Group();
    g.add(at(rbox(2.6, 0.16, 1.6, WOOD, 0.07), 0, 0.86, 0));
    for (const x of [-1.1, 1.1]) for (const z of [-0.6, 0.6]) g.add(at(rbox(0.15, 0.86, 0.15, WOOD, 0.05), x, 0.43, z));
    const paper = at(rbox(1.5, 0.03, 1.05, glaze(0xffffff), 0.01), -0.15, 0.955, 0.02);
    paper.rotation.y = 0.12;
    g.add(paper);
    [0xff8fbf, 0x5aa9ee, 0xffc93a].forEach((color, i) => {
      const crayon = new THREE.Group();
      crayon.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.42, 20), glaze(color)));
      crayon.add(at(mesh(new THREE.ConeGeometry(0.05, 0.12, 20), glaze(color)), 0, 0.27, 0));
      crayon.rotation.set(0, 0.3 + i * 0.35, Math.PI / 2);
      crayon.position.set(0.85 + i * 0.12, 0.99, -0.35 + i * 0.3);
      g.add(crayon);
    });
    return g;
  }
  /* The spelling's letter blocks: the lesson's word, jumbled, on the grass. */
  function letterBlocks(word) {
    const g = new THREE.Group();
    const letters = [...word.toUpperCase()];
    for (let i = letters.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [letters[i], letters[j]] = [letters[j], letters[i]];
    }
    const tints = [0xff8fbf, 0x5aa9ee, 0xffc93a, 0x58c27d, 0xb89cf0];
    const perRow = Math.ceil(letters.length / 2);
    letters.forEach((letter, i) => {
      const row = Math.floor(i / perRow), col = i % perRow;
      const block = new THREE.Group();
      block.add(rbox(0.56, 0.56, 0.56, soft(tints[i % tints.length]), 0.09));
      const cv = document.createElement("canvas");
      cv.width = cv.height = 128;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#ffffff";
      cx.font = "bold 92px 'Arial Rounded MT Bold', Arial, sans-serif";
      cx.textAlign = "center";
      cx.textBaseline = "middle";
      cx.fillText(letter, 64, 70);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      const face = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.44), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.6 }));
      face.position.z = 0.285;
      block.add(face);
      const top = face.clone();
      top.rotation.x = -Math.PI / 2;
      top.position.set(0, 0.285, 0);
      block.add(top);
      block.position.set((col - (perRow - 1) / 2) * 0.72 + (row ? 0.3 : 0) + (rand() - 0.5) * 0.12, 0.28, row * 0.85 - 0.3 + (rand() - 0.5) * 0.15);
      block.rotation.y = (rand() - 0.5) * 0.5;
      g.add(block);
    });
    return g;
  }
  /* The review's sorting: four open boxes, each with its shape on the front. */
  function shapeBoxes() {
    const g = new THREE.Group();
    SHAPE_OF_LESSON.forEach((shape, i) => {
      const box = new THREE.Group();
      const m = soft(SHAPE_COLOR[shape]);
      box.add(at(rbox(0.95, 0.08, 0.95, m, 0.03), 0, 0.04, 0));
      for (const [x, z, wd, dp] of [[0, 0.44, 0.95, 0.08], [0, -0.44, 0.95, 0.08], [0.44, 0, 0.08, 0.95], [-0.44, 0, 0.08, 0.95]]) box.add(at(rbox(wd, 0.7, dp, m, 0.03), x, 0.35, z));
      box.add(at(upright(shape, 0.42, 0.04, glaze(0xffffff)), 0, 0.38, 0.5));
      box.position.set((i - 1.5) * 1.15, 0, 0);
      box.rotation.y = (i - 1.5) * -0.08;
      g.add(box);
    });
    return g;
  }

  /* The shape-flower that blooms where an activity was done — its stem
     grows, then its head (the shape, in its colour, in a ring of petals)
     springs open. `bloom(b)`, b 0..1; 0 is not there at all. */
  function shapeFlower(shape, tint = SHAPE_COLOR[shape]) {
    const g = new THREE.Group();
    const stem = at(mesh(new THREE.CylinderGeometry(0.05, 0.07, 1, 16), leafy(0x5fb565)), 0, 0.5, 0);
    const grow = new THREE.Group();
    grow.add(stem);
    for (const sx of [-1, 1]) {
      const leaf = at(ball(0.2, leafy(0x6cc46a), 24), sx * 0.2, 0.42, 0);
      leaf.scale.set(1.3, 0.45, 0.8);
      leaf.rotation.z = sx * -0.5;
      grow.add(leaf);
    }
    g.add(grow);
    const head = new THREE.Group();
    const petal = soft(new THREE.Color(tint).lerp(new THREE.Color(0xffffff), 0.6).getHex());
    const petals = [];
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const p = at(ball(0.2, petal, 24), Math.cos(a) * 0.42, Math.sin(a) * 0.42, -0.06);
      p.scale.set(1, 1, 0.45);
      head.add(p);
      petals.push([p, a]);
    }
    head.add(at(upright(shape, 0.62, 0.14, glaze(tint)), 0, 0, 0.06));
    g.add(head);
    /* The paint it opened from: a splash on the ground (the forest's). */
    const splash = FOREST ? at(mesh(new THREE.CylinderGeometry(0.62, 0.7, 0.03, 40), glaze(tint)), 0, 0.02, 0) : null;
    if (splash) {
      splash.castShadow = false;
      g.add(splash);
    }
    const backOut = (t) => 1 + 2.2 * (t - 1) ** 3 + 1.2 * (t - 1) ** 2;
    g.bloom = (b) => {
      g.visible = b > 0;
      if (splash) splash.scale.setScalar(Math.max(0.001, Math.min(1, b * 4)));
      const up = Math.min(1, b / 0.5);
      grow.scale.set(1, Math.max(0.001, up * (2 - up)) * 1.35, 1);
      const open = Math.max(0, Math.min(1, (b - 0.38) / 0.62));
      head.position.y = 1.35 * up * (2 - up) + 0.05;
      head.scale.setScalar(Math.max(0.001, backOut(open)));
      head.rotation.z = (1 - open) * -0.9;
      for (const [p, a] of petals) p.position.set(Math.cos(a) * 0.42 * (0.4 + 0.6 * open), Math.sin(a) * 0.42 * (0.4 + 0.6 * open), -0.06);
    };
    g.bloom(0);
    return g;
  }

  /* My Garden's word: the lesson's thing, big, on a round cream plinth with a
     pink rim — about 2.4 tall in all (a tree a little more). */
  /* A garden thing standing on the lawn itself, no base (2026-11-09): it grows
     out of the ground during the entry move (`growth`, in `window.garden.move`). */
  function lawnThing(kind) {
    const g = new THREE.Group();
    const thing = gardenThing(kind);
    const size = new THREE.Box3().setFromObject(thing).getSize(new THREE.Vector3());
    thing.scale.setScalar((kind === "tree" ? 2.6 : 1.9) / Math.max(size.y, size.x * 0.85));
    g.add(thing);
    return g;
  }

  /* Bloo's island: one big tree of a season, on the lawn. */
  function seasonTree(season) {
    const t = gardenScenery("tree", SEAS_SEASONS.indexOf(season) * 4);
    t.scale.setScalar(2.6);
    return t;
  }
  /* Bloo's farm's places (2026-11-08): hay bales, a feeding trough. */
  function hayStack() {
    const g = new THREE.Group();
    for (const [x, y] of [[-0.6, 0], [0.6, 0], [0, 0.95]]) g.add(at(hayBale(), x, y, 0));
    return g;
  }
  /* The Animals lesson's word step (2026-11-10, the user: the animal IN the world, not
     hay): its picture standing on the lawn, sharp; `setAnimal` lays the file in. */
  let animalPlane = null;
  function animalBoard() {
    const g = new THREE.Group();
    animalPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, toneMapped: false, fog: false }));
    animalPlane.scale.set(3, 3, 1);
    animalPlane.rotation.x = -0.1;
    animalPlane.userData.noMerge = true;
    g.add(animalPlane);
    return g;
  }
  function trough() {
    const g = new THREE.Group();
    const wood = soft(0xd9a76a, { roughness: 0.85 });
    g.add(at(rbox(2.6, 0.12, 1.0, wood, 0.04), 0, 0.3, 0));
    for (const z of [-0.5, 0.5]) g.add(at(rbox(2.6, 0.55, 0.1, wood, 0.04), 0, 0.5, z));
    for (const x of [-1.25, 1.25]) g.add(at(rbox(0.1, 0.55, 1.0, wood, 0.04), x, 0.5, 0));
    const feed = at(ball(0.6, soft(0xf3d77f, { roughness: 0.95 }), 24), 0, 0.5, 0);
    feed.scale.set(2, 0.45, 0.7);
    g.add(feed);
    for (const x of [-1.1, 1.1]) for (const z of [-0.4, 0.4]) g.add(at(rbox(0.14, 0.34, 0.14, wood, 0.04), x, 0.17, z));
    return g;
  }

  /* ---- The forest's props (Colors, 2026-11-05) ---- */
  /* The mix: a tree stump with the two paints spilled on it. */
  function stumpMix(a, b) {
    const g = new THREE.Group();
    g.add(at(mesh(new THREE.CylinderGeometry(1.75, 1.95, 0.8, 64), soft(0xb08a66, { roughness: 0.9 })), 0, 0.4, 0));
    g.add(at(mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.05, 64), soft(0xf1d9b0)), 0, 0.82, 0));
    for (const r of [0.5, 1.0, 1.45]) {
      const ring = at(mesh(new THREE.TorusGeometry(r, 0.014, 8, 64), soft(0xc9a47c)), 0, 0.855, 0);
      ring.rotation.x = Math.PI / 2;
      g.add(ring);
    }
    for (const [color, x] of [[a, -0.8], [b, 0.8]]) {
      const puddle = paintBlob(PAINT[color]);
      puddle.scale.setScalar(0.62);
      puddle.rotation.x = -Math.PI / 2;
      puddle.position.set(x, 0.86, 0);
      g.add(puddle);
    }
    return g;
  }
  /* The review's sorting: four open boxes, one per colour. */
  function colorBoxes(list = ["red", "yellow", "green", "purple"]) {
    const g = new THREE.Group();
    list.forEach((c, i) => {
      const box = new THREE.Group();
      const m = soft(PAINT[c]);
      box.add(at(rbox(0.95, 0.08, 0.95, m, 0.03), 0, 0.04, 0));
      for (const [x, z, wd, dp] of [[0, 0.44, 0.95, 0.08], [0, -0.44, 0.95, 0.08], [0.44, 0, 0.08, 0.95], [-0.44, 0, 0.08, 0.95]]) box.add(at(rbox(wd, 0.7, dp, m, 0.03), x, 0.35, z));
      box.position.set((i - 1.5) * 1.15, 0, 0);
      box.rotation.y = (i - 1.5) * -0.08;
      g.add(box);
    });
    return g;
  }

  /* ---- Nova's kitchen (2026-11-06, Vegetables' world — it was her garden and
     cottage on 2026-11-05; the user then moved the whole course indoors): the
     room alone, the counter with the five vegetables and the basket, Pinki's
     picture behind it. Three cameras (`kitchenCam`): the entry crane, the wide
     view the word and the spelling are blurred behind, and the counter Basket
     Time is played at. A lesson is the entry and one move in; the review the
     entry alone. `?garden=<1-6>&world=veg`, `render.cjs veg 1 6`. ---- */
  const VEG_KINDS = ["carrot", "broccoli", "potato", "tomato", "pepper"];
  /* Lesson 6 is the review: no one vegetable. */
  const VEG_KIND = VEG ? VEG_KINDS[LESSON - 1] ?? null : null;
  const KX = 16, KY = 1.5, KK = 0.5, ROOM_Z = -10, FRONT_Z = -4.2;
  const toWorld = ([x, y, z]) => [KX + x * KK, KY + y * KK, ROOM_Z + z * KK];
  const vegKeep = [];
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const easeOut = (t) => 1 - (1 - t) ** 3;

  const jumbled = (word) => {
    const letters = [...word.toUpperCase()];
    for (let i = letters.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [letters[i], letters[j]] = [letters[j], letters[i]];
    }
    return letters;
  };
  const textMat = (text, { size = 92, w = 128, ink = "#ffffff", paper = null } = {}) => {
    const cv = document.createElement("canvas");
    cv.width = w;
    cv.height = 128;
    const cx = cv.getContext("2d");
    if (paper) {
      cx.fillStyle = paper;
      cx.fillRect(0, 0, w, 128);
    }
    cx.fillStyle = ink;
    cx.font = `bold ${size}px 'Arial Rounded MT Bold', Arial, sans-serif`;
    cx.textAlign = "center";
    cx.textBaseline = "middle";
    cx.fillText(text, w / 2, 70);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    return new THREE.MeshStandardMaterial({ map: tex, transparent: !paper, roughness: 0.7 });
  };
  /* The word's sign, on a post by the bed, the vegetable sat on top. */
  function vegSign(word) {
    const g = new THREE.Group();
    g.add(at(rbox(0.26, 3.1, 0.26, WOOD, 0.08), 0, 1.5, 0));
    g.add(at(rbox(3.5, 1.45, 0.16, soft(0xf6e6c8), 0.1), 0, 2.45, 0.14));
    const board = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.15), textMat(word, { w: 356, size: word.length > 6 ? 62 : 80, ink: "#7a5f9e" }));
    board.position.set(0, 2.45, 0.235);
    g.add(board);
    if (VEG_KIND) {
      const thing = VIDEO_THINGS[VEG_KIND]();
      thing.scale.setScalar(0.78);
      thing.position.set(0, 3.25, 0.14);
      g.add(thing);
      /* Coloured per vertex: never merged. */
      vegKeep.push(thing);
    }
    return g;
  }
  const kitchen = {};
  if (VEG) {
    const F = SCENES.kitchen.frames[portrait ? "portrait" : "landscape"];
    kitchen.F = F;
    /* ---- Inside: the kitchen's room and counter, at KK ---- */
    const root = new THREE.Group();
    root.position.set(KX, KY, ROOM_Z);
    root.scale.setScalar(KK);
    scene.add(root);
    const { room, counter } = kitchenRoom(F.counter[0], F.counter[1]);
    root.add(room, counter);
    kitchen.root = root;
    kitchen.counter = counter;
    /* All indoors: no lawn — a floor under the cupboards and the wall running
       on past the room's own, so a wide shot never sees out. */
    scene.remove(lawn);
    const floor = mesh(new THREE.PlaneGeometry(200, 120), soft(0xf3dfbd, { roughness: 0.7 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(KX, KY - 2.24, ROOM_Z);
    floor.castShadow = false;
    scene.add(floor);
    const wallOn = mesh(new THREE.PlaneGeometry(200, 80), soft(0xfbefdc, { roughness: 0.8 }));
    wallOn.position.set(0, 7, F.counter[0] - 3.4 - 0.03);
    wallOn.castShadow = false;
    root.add(wallOn);

    /* The things on the counter: each stands on its top, in the same place
       in every lesson. */
    for (const [name, it] of Object.entries(F.items)) {
      const thing = ITEMS[it.model ?? name](it.arg);
      place(thing, it);
      thing.updateMatrixWorld(true);
      thing.position.y = -new THREE.Box3().setFromObject(thing).min.y;
      root.add(thing);
      things[name] = { group: thing, shape: null, color: null, y: KY };
    }
    const [bx, bz, bs] = F.basket;
    kitchen.basket = ITEMS.basket();
    kitchen.basket.scale.setScalar(bs);
    kitchen.basket.position.set(bx, 0, bz);
    root.add(kitchen.basket);
    renderer.localClippingEnabled = true;
    /* The vegetable the child put in: rendered in the basket for the way
       out, so the room is as they left it. */
    kitchen.inBasket = (on) => {
      const t = things[VEG_KIND].group;
      t.userData.home ??= { at: t.position.clone(), k: t.scale.clone() };
      if (on) {
        t.position.set(bx, 0.5 * bs, bz);
        t.scale.copy(t.userData.home.k).multiplyScalar(0.68);
      } else {
        t.position.copy(t.userData.home.at);
        t.scale.copy(t.userData.home.k);
      }
    };
  }

  /* ---- Nova's hill (2026-11-05, The Seasons' world): one low hill, one
     tree — the islands' tree with the friends' face, grown large — and the
     camera turning round it, not walking. Each lesson is its season. The
     marker is the season itself: every step done, more of it comes over the
     tree and the ground by itself, part by part; the end shot sweeps round
     and up with all of it there. The review's camera goes all the way round,
     a season a side, the year coming back to spring at the end. ---- */
  const HILL_H = 2.4, HILL_R = 36, TREE_K = 2;
  const hillY = (x, z) => HILL_H * Math.sqrt(Math.max(0, 1 - (x * x + z * z) / (HILL_R * HILL_R)));
  const onRing = (deg, r) => {
    const a = THREE.MathUtils.degToRad(deg);
    return [Math.sin(a) * r, Math.cos(a) * r];
  };
  const hillStates = {};
  /* Letters on stones, jumbled, in the grass. */
  function letterStones(word) {
    const g = new THREE.Group();
    const letters = jumbled(word);
    const perRow = Math.ceil(letters.length / 2);
    letters.forEach((letter, i) => {
      const row = Math.floor(i / perRow), col = i % perRow;
      const one = new THREE.Group();
      const rock = ball(0.56, stone(0xe9e1d0), 32);
      rock.scale.set(1.1, 0.78, 0.8);
      rock.position.y = 0.36;
      one.add(rock);
      const face = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.72), textMat(letter, { ink: "#5f4a86" }));
      face.position.set(0, 0.42, 0.45);
      one.add(face);
      one.position.set((col - (perRow - 1) / 2) * 1.32 + (row ? 0.5 : 0), 0, row * 1.5 - 1.5);
      one.rotation.y = (rand() - 0.5) * 0.3;
      g.add(one);
    });
    return g;
  }
  /* The review's order: four saplings, a season each. */
  function fourSaplings() {
    const g = new THREE.Group();
    [0xffb7d5, 0x5cbd57, 0xf2863a, 0xf4f8ff].forEach((color, i) => {
      const t = new THREE.Group();
      t.add(at(mesh(new THREE.CylinderGeometry(0.1, 0.15, 1.1, 14), soft(0xb07b50)), 0, 0.55, 0));
      t.add(at(ball(0.62, leafy(color), 28), 0, 1.45, 0));
      t.position.x = (i - 1.5) * 1.5;
      g.add(t);
    });
    return g;
  }
  /* A tree far off on the ring, dressed for its season. */
  function ringTree(k, season) {
    const t = new THREE.Group();
    t.add(at(mesh(new THREE.CylinderGeometry(0.28, 0.42, 3.8, 14), soft(0xa9825f, { roughness: 0.9 })), 0, 1.9, 0));
    const colors = { spring: [0xa9e38a, 0x9adb7c, 0xffc4dc], summer: [0x5cbd57, 0x52b450, 0x66c45f], fall: [0xff9a3c, 0xf2683a, 0xffc24a], winter: [0xf6f9ff, 0xeaf1fb, 0xdfe9f6] }[season];
    const lobes = season === "winter" ? 5 : 8;
    for (let i = 0; i < lobes; i++) {
      const a = rand() * Math.PI * 2, up = rand();
      t.add(at(ball((1.05 + rand() * 0.7) * (1 - up * 0.25) * (season === "winter" ? 0.72 : 1), leafy(colors[i % 3]), 22), Math.cos(a) * (1.5 - up), 4 + up * 2.2, Math.sin(a) * (1.5 - up) * 0.9));
    }
    t.scale.setScalar(k);
    return t;
  }

  if (YEAR_HILL) {
    /* The ground, one colour the season turns (`grow`). */
    const groundMat = soft(0xa3e07e, { roughness: 0.92, sheen: 0.2 });
    lawn.material = groundMat;
    lawn.scale.set(1, 3, 1);
    lawn.position.set(0, -0.01, 0);
    lawn.userData.noMerge = true;
    const mound = (r, height, x, z) => {
      const m = mesh(new THREE.SphereGeometry(r, 96, 48), groundMat);
      m.scale.y = height / r;
      m.position.set(x, 0, z);
      m.castShadow = false;
      m.userData.noMerge = true;
      scene.add(m);
    };
    mound(HILL_R, HILL_H, 0, 0);
    for (let i = 0; i < 7; i++) {
      const [x, z] = onRing(i * 51 + 10, 112);
      mound(32, 7 + (i % 3) * 2.5, x, z);
    }

    /* The tree. */
    const root = new THREE.Group();
    root.scale.setScalar(TREE_K);
    root.position.y = HILL_H - SOIL_Y * TREE_K;
    scene.add(root);
    const tree = seasonTree();
    tree.position.set(0, SOIL_Y, -0.45);
    root.add(tree);

    /* What comes of each season, over `v` 0..1: a part scales in, fades in,
       falls into place, or turns from one colour to its own. */
    const stateOf = (season) => {
      const [, one, two, three] = SEASON_DEFS[season].steps;
      const crownOr = one.make();
      tree.add(crownOr);
      const second = two.make();
      (two.onTree ? tree : root).add(second);
      const third = three.make();
      root.add(third);
      const parts = [];
      const stagger = (list, from, to, kind, extra = {}) => list.forEach((obj, i) => {
        const span = (to - from) * 0.5;
        const start = from + ((to - from - span) * i) / Math.max(1, list.length - 1);
        parts.push({ obj, from: start, to: start + span, kind, full: obj.scale.clone(), y: obj.position.y, own: obj.material?.color.clone(), ...extra });
      });
      if (season === "spring") {
        stagger(crownOr.children, 0, 0.5, "scale");
        stagger(second.children, 0.48, 0.85, "scale");
        stagger(third.children, 0.6, 1, "scale");
      } else if (season === "summer") {
        stagger(crownOr.children, 0, 0.4, "tint", { from_: new THREE.Color(0xb5e596) });
        stagger(second.children, 0.35, 0.85, "scale");
        stagger([third], 0.55, 1, "rise", { by: -1.6 });
      } else if (season === "fall") {
        stagger(crownOr.children, 0, 0.55, "tint", { from_: new THREE.Color(0x74c95c) });
        stagger(second.children, 0.2, 0.92, "fall", { by: 2.4 });
        stagger([third], 0.7, 1, "scale");
      } else {
        crownOr.traverse((o) => {
          if (o.isMesh) o.material = Object.assign(o.material.clone(), { transparent: true });
        });
        stagger([crownOr], 0.25, 1, "fade");
        stagger(second.children, 0, 0.72, "fall", { by: 4.5 });
        stagger([third], 0.7, 1, "scale");
      }
      const [g0, g1] = { spring: [0xc8d596, 0xa3e07e], summer: [0x9fdb7a, 0x74cd5c], fall: [0x8dcb6a, 0xc2d36a], winter: [0xc2cda6, 0xfbfdff] }[season];
      const things = [crownOr, second, third];
      return {
        things,
        show(on) {
          things.forEach((t) => (t.visible = on));
        },
        grow(v) {
          groundMat.color.setHex(g0).lerp(new THREE.Color(g1), clamp01(v / 0.75));
          for (const part of parts) {
            const p = clamp01((v - part.from) / (part.to - part.from));
            const { obj, kind } = part;
            if (kind === "tint") {
              obj.material.color.copy(part.from_).lerp(part.own, p);
            } else if (kind === "fade") {
              obj.visible = p > 0;
              obj.traverse((o) => o.isMesh && (o.material.opacity = p));
            } else {
              obj.visible = p > 0;
              const e = easeOut(p);
              obj.scale.copy(part.full).multiplyScalar(kind === "scale" || kind === "rise" ? Math.max(0.001, e) : Math.max(0.001, Math.min(1, p * 5)));
              if (kind === "fall" || kind === "rise") obj.position.y = part.y + part.by * (1 - e);
            }
          }
        },
      };
    };
    for (const season of HILL_SEASON ? [HILL_SEASON] : YEAR) {
      hillStates[season] = stateOf(season);
      vegKeep.push(...hillStates[season].things);
    }

    /* What stands round about: a side of the ring per season in the review
       (the side the camera sees over the tree). */
    const seasonAt = (deg) => HILL_SEASON ?? YEAR[Math.round(((deg + 180) % 360) / 90) % 4];
    for (let row = 0; row < 3; row++) {
      for (let deg = 0; deg < 360; deg += 7.5 + rand() * 6) {
        const r = 44 + row * 13 + rand() * 7;
        const [x, z] = onRing(deg, r);
        add(ringTree((0.95 + row * 0.1) * (0.85 + rand() * 0.5), seasonAt(deg)), x, 0, z);
      }
    }
    for (let i = 0; i < 7; i++) {
      const [x, z] = onRing(i * 51 + 25, 135);
      add(cloud(3 + (i % 3) * 0.6), x, 24 + (i % 3) * 4, z);
    }
    /* A ring of stepping stones round the tree. */
    for (let deg = 0; deg < 360; deg += 4.2 + rand() * 1.2) {
      const [x, z] = onRing(deg, 11.5 + (rand() - 0.5) * 0.6);
      const st = mesh(new THREE.CylinderGeometry(0.32 + rand() * 0.12, 0.36 + rand() * 0.12, 0.08, 24), stone(0xf0e6d4));
      st.castShadow = false;
      add(st, x, hillY(x, z) + 0.03, z, { ry: rand() * 3 });
    }
    /* Little things in the grass, in clusters, clear of each step's place. */
    const clear = HILL_SEASON ? [40, 115] : [0, 90, 180, 270];
    const small = {
      spring: () => (rand() > 0.5 ? tulip([0xff6f7d, 0xffd23a, 0xff8cc6][Math.floor(rand() * 3)]) : hillFlower([0xffffff, 0xffc4dc, 0xffe08a][Math.floor(rand() * 3)])),
      summer: () => hillFlower([0xffd23a, 0xffffff, 0xff9d5c][Math.floor(rand() * 3)]),
      fall: () => {
        const leaf_ = mapleLeaf([0xf2683a, 0xffb43a, 0xff8a2e][Math.floor(rand() * 3)]);
        leaf_.rotation.set(-Math.PI / 2, 0, rand() * 6);
        leaf_.position.y = 0.08;
        return group(leaf_);
      },
      winter: () => {
        const heap = ball(0.34 + rand() * 0.3, soft(0xf6f9ff, { sheen: 0.9 }), 20);
        heap.scale.y = 0.45;
        return group(heap);
      },
    };
    for (let i = 0; i < 90; i++) {
      const deg = rand() * 360, r = 7 + rand() * 30;
      if (r < 13.5 && clear.some((c) => Math.abs(((deg - c + 540) % 360) - 180) < 34)) continue;
      const here = seasonAt(deg);
      for (let j = 0, n = 3 + Math.floor(rand() * 4); j < n; j++) {
        const [cx, cz] = onRing(deg, r);
        const x = cx + (rand() - 0.5) * 2.6, z = cz + (rand() - 0.5) * 2.6;
        add(small[here](), x, hillY(x, z), z, { k: 1.15 + rand() * 0.5, ry: rand() * 6 });
      }
    }
  }

  /* ---- A course's world of stops (2026-11-05, Shapes first; the user's
     picture): no map and no board — soft clay pedestals, each in its lesson's
     shape with that shape standing on it, stepping stones between them, a
     treasure chest on the last (the review). The ground and sky one pale
     pink, Pinki's; the shape garden's soul round about: its lawns, lollipop,
     cone and box topiaries, a round fountain, flowers, the shapes' own clay
     colours. The camera goes up a little and IN as the page scrolls
     (`frameAt(t)`, played by `CourseWorld`), never a flat scroll. ---- */
  const stopsApi = {};
  if (STOPS) {
    /* Pinki's pink; Nova's lavender and milk. */
    /* My Garden's: the videos' light pink, milk-white slabs. */
    const GROUND = BLOO_STOPS ? 0xbcdcf6 : GARDEN_STOPS ? 0xf7c6d8 : FRUITS_STOPS ? 0xd7c9f2 : 0xf5b2d0, LIGHT = MILK_STOPS ? 0xfbf6ee : 0xfccfe2;
    const PAL_HILL = BLOO_STOPS ? 0xa8d0f2 : GARDEN_STOPS ? 0xf2b0ca : FRUITS_STOPS ? 0xc6b5ee : 0xf2a6c8;
    lawn.material = soft(GROUND, { roughness: 0.98, sheen: 0.1 });
    lawn.scale.set(1, 3, 1);
    lawn.position.set(0, 0, -30);
    lawn.userData.noMerge = true;
    sun.color.set(0xfff4ee);
    sun.intensity = 1.55;
    sky.intensity = 1.5;
    sky.color.set(BLOO_STOPS ? 0xf2f9ff : FRUITS_STOPS ? 0xfbf7ff : 0xfff2f7);
    sky.groundColor.set(BLOO_STOPS ? 0xbcdaf4 : GARDEN_STOPS ? 0xf6c9dc : FRUITS_STOPS ? 0xcdbfee : 0xf8c2da);
    scene.environmentIntensity = 0.35;
    sun.shadow.radius = 14;
    Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, far: 120 });
    sun.shadow.camera.updateProjectionMatrix();
    /* The sky: no ground under it, the light of open air. */
    if (SKY_STOPS) {
      lawn.visible = false;
      sky.color.set(0xffffff);
      sky.groundColor.set(0xcfe4fa);
      sky.intensity = 1.7;
    }
    /* Night: moonlight — cool, lower, still bright enough for a child to read every cloud. */
    if (SKY_NIGHT) {
      sun.color.set(0xcdd8ff);
      sun.intensity = 1.2;
      sky.color.set(0xb4c0ff);
      sky.groundColor.set(0x3b4092);
      sky.intensity = 1.2;
      scene.environmentIntensity = 0.2;
    }

    /* Lessons in order: the first is the farthest, the chest the nearest. */
    const FRUIT_KINDS = ["carrot", "broccoli", "potato", "tomato", "pepper"];
    const SET_KINDS = SKY_NIGHT ? ["1", "2", "3"] : SKY_STOPS ? ["1", "2", "3", "4", "5"] : ANIMALS_STOPS ? ["cat", "dog", "fish", "elephant", "mouse", "bird", "parrot", "turtle", "gecko"] : WEATHER_STOPS ? ["spring", "summer", "fall", "winter"] : GARDEN_STOPS ? GARDEN_KINDS : FRUIT_KINDS;
    stopsApi.pictures = [];
    const SPOTS = SKY_NIGHT
      ? /* Going away: level 1 where a course's chest stands, the house the farthest. */
        [[portrait ? -1.2 : -4.8, 5], [portrait ? 1.2 : 4.8, -6], [portrait ? -1.2 : -4.8, -17], [0, -29]]
      : MILK_STOPS
      ? [...SET_KINDS.map((_, i) => [(i % 2 ? 1 : -1) * (portrait ? (SKY_STOPS ? 1.2 : 2.4) : 4.8), -6 - (SET_KINDS.length - 1 - i) * 11]), [0, portrait ? 6 : 5]]
      : COLORS_STOPS
      ? [...COLOR_LESSONS.map((_, i) => [(i % 2 ? 1 : -1) * (portrait ? 2.4 : 4.8), -6 - (COLOR_LESSONS.length - 1 - i) * 10.5]), [0, portrait ? 6 : 5]]
      : portrait
      ? [[-2.3, -39], [2.4, -28], [-2.4, -17], [2.4, -6], [0, 6]]
      : [[-4.8, -38], [4.8, -27.5], [-4.8, -17], [4.8, -6.5], [0, 5]];
    const FIRST_Z = SPOTS[0][1];
    /* The far end of the way (the first lesson's — or, at night, the house's). */
    const FAR_Z = Math.min(...SPOTS.map((spot) => spot[1]));
    /* How far the Shapes world's far scenery moves back for a longer way. */
    const DZ = COLORS_STOPS || MILK_STOPS ? FIRST_Z + (portrait ? 39 : 38) : 0;
    const KINDS = MILK_STOPS ? SET_KINDS : COLORS_STOPS ? COLOR_LESSONS : ["circle", "square", "triangle", "rectangle"];
    const slabM = soft(LIGHT, { roughness: 0.9 });
    const INK = soft(0x6a5898, { roughness: 0.7 });
    /* The picture's face: two plain dots, a small smile. */
    const dotFace = (k, ink = INK) => {
      const g = new THREE.Group();
      for (const sx of [-1, 1]) {
        const eye = mesh(new THREE.SphereGeometry(0.14 * k, 28, 20), ink);
        eye.scale.set(0.9, 1.08, 0.35);
        eye.position.set(sx * 0.36 * k, 0.08 * k, 0);
        g.add(eye);
      }
      const smile = mesh(new THREE.TorusGeometry(0.14 * k, 0.034 * k, 12, 32, Math.PI), ink);
      smile.rotation.z = Math.PI;
      smile.position.set(0, -0.04 * k, 0);
      g.add(smile);
      return g;
    };
    /* A low soft slab, the same family as the ground, a little lighter. */
    const slab = (wd, dp) => {
      const g = new THREE.Group();
      const r = Math.min(wd, dp) * 0.26;
      const shape = new THREE.Shape();
      const [x0, y0, x1, y1] = [-wd / 2 + r, -dp / 2 + r, wd / 2 - r, dp / 2 - r];
      shape.moveTo(x0, y0 - r);
      shape.lineTo(x1, y0 - r);
      shape.quadraticCurveTo(x1 + r, y0 - r, x1 + r, y0);
      shape.lineTo(x1 + r, y1);
      shape.quadraticCurveTo(x1 + r, y1 + r, x1, y1 + r);
      shape.lineTo(x0, y1 + r);
      shape.quadraticCurveTo(x0 - r, y1 + r, x0 - r, y1);
      shape.lineTo(x0 - r, y0);
      shape.quadraticCurveTo(x0 - r, y0 - r, x0, y0 - r);
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.7, bevelEnabled: true, bevelThickness: 0.42, bevelSize: 0.42, bevelSegments: 16, curveSegments: 40 });
      geo.center();
      const m = mesh(geo, slabM);
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.77;
      g.add(m);
      g.top = 1.5;
      return g;
    };
    /* The little things on a slab's corner, as in the picture. */
    const flowerColors = [0xff8fa8, 0xffffff, 0xffd267];
    const chubby = (color) => {
      const g = new THREE.Group();
      g.add(at(mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.85, 14), soft(0x8fd67c)), 0, 0.42, 0));
      const leaf = ball(0.24, soft(0x8fd67c), 20);
      leaf.scale.set(1.55, 0.5, 0.9);
      g.add(at(leaf, 0.3, 0.16, 0.05));
      const bloom = blossom(color);
      bloom.scale.setScalar(2.6);
      bloom.position.y = 1;
      bloom.rotation.x = -0.3;
      g.add(bloom);
      return g;
    };
    const sprig = () => {
      const g = new THREE.Group();
      g.add(at(mesh(new THREE.CylinderGeometry(0.11, 0.15, 2.2, 14), soft(0x8fd67c)), 0, 1.1, 0));
      for (const [y, sx] of [[0.75, 1], [0.8, -1], [1.45, 1], [1.5, -1], [2.25, 0]]) {
        const l = ball(0.34, soft(0x8fd67c), 22);
        l.scale.set(sx ? 1.5 : 0.95, sx ? 0.7 : 1.35, 0.7);
        g.add(at(l, sx * 0.46, y, 0));
      }
      return g;
    };
    /* ---- The sky's own pieces ---- */
    /* A fixed scatter (never `Math.random`: the same sky on every render). */
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const cloudM = SKY_NIGHT
      ? soft(0xe4e8ff, { roughness: 0.96, sheen: 0.9, emissive: 0x8e9bff, emissiveIntensity: 0.3 })
      : soft(0xffffff, { roughness: 0.96, sheen: 0.9, emissive: 0xffffff, emissiveIntensity: 0.16 });
    /* A cloud to stand on: a low bed with a nearly flat top, round puffs all
       about its rim and a belly under it. */
    const cloudBed = (wd, dp) => {
      const g = new THREE.Group();
      const puff = (r, x, y, z, sy = 1) => {
        const m = ball(r, cloudM, 40);
        m.scale.y = sy;
        m.position.set(x, y, z);
        m.castShadow = false;
        g.add(m);
      };
      const bed = ball(1, cloudM, 64);
      bed.scale.set(wd / 2, 0.95, dp / 2);
      bed.position.y = 0.6;
      bed.castShadow = false;
      g.add(bed);
      const n = 11;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + 0.3;
        const r = 1.05 + rnd() * 0.55;
        puff(r, Math.cos(a) * (wd / 2 - 0.25), 0.25 + rnd() * 0.25, Math.sin(a) * (dp / 2 - 0.35), 0.82);
      }
      for (const [x, z, r] of [[-wd * 0.2, 0.3, 1.5], [wd * 0.22, -0.2, 1.35], [0, 0.9, 1.25]]) puff(r, x, -0.45, z, 0.8);
      g.top = 1.5;
      /* What the page lays its link over (`boxes`): the middle of the cloud and what
         stands on it — the whole cloud is wider than the page lets a stop be on a phone. */
      const hit = new THREE.Mesh(new THREE.BoxGeometry(Math.min(wd, 6) - 0.6, 4.9, 3.6), new THREE.MeshBasicMaterial());
      hit.position.y = 2.45;
      /* Not seen — the OBJECT, not its material: a way's mask is rendered with one
         material over everything, and a box "hidden" by its material hid the stars behind it. */
      hit.visible = false;
      g.add(hit);
      g.userData.hit = hit;
      return g;
    };
    /* A five-point star, plump: rounded tips, a deep bevel. */
    const starGeo = (R, depth, bevel) => {
      const shape = new THREE.Shape();
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + Math.PI / 2;
        const r = i % 2 ? R * 0.52 : R;
        pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
      }
      /* Each corner cut and rounded with a curve through it. */
      const cut = 0.3;
      pts.forEach((pt, i) => {
        const prev = pts[(i + 9) % 10], next = pts[(i + 1) % 10];
        const a = pt.clone().lerp(prev, cut), b = pt.clone().lerp(next, cut);
        if (i === 0) shape.moveTo(a.x, a.y);
        else shape.lineTo(a.x, a.y);
        shape.quadraticCurveTo(pt.x, pt.y, b.x, b.y);
      });
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 14, curveSegments: 24 });
      geo.center();

    : VEG
    /* Nova's kitchen (2026-11-06, the user: all of it indoors, the camera

    : FARM_KIND
      ? [
          { x: 0, make: () => animalBoard(), cam: portrait ? [0, 2.2, 7.1, 0, 1.4, 0.6] : [0, 2.6, 8.4, 0, 2.0, 0.6], color: 0xffd45e },
          { x: STEP_DX, make: () => letterBlocks(FARM_KIND), k: 1.7, color: 0x9cc4f2 },

          { x: 0, make: () => hayStack(), k: 1.4, color: 0xffd45e },

    /* My Garden (2026-11-08): the word = the lesson's thing, big on a round

       (its picks) and two sets of letter blocks. */
    ? MY_KIND
      ? [
          { x: 0, make: () => lawnThing(MY_KIND), cam: portrait ? [0, 2.2, 7.1, 0, 1.4, 0.6] : [0, 2.6, 8.4, 0, 2.0, 0.6], color: 0xff8fb8 },
          { x: STEP_DX, make: () => letterBlocks(MY_KIND), k: 1.7, color: 0xc7a3f0 },
        ]
      : [
          { x: 0, make: () => easel(), color: 0xff8fb8 },
          { x: STEP_DX, make: () => easel(), color: 0xc7a3f0 },
          { x: STEP_DX * 2, make: () => letterBlocks("flower"), k: 1.7, color: 0xffd45e },
          { x: STEP_DX * 3, make: () => letterBlocks("leaf"), k: 1.7, color: 0x9cc4f2 },
        ]
    : FOREST
    ? COLOR_ID
      ? [
          /* The word: no prop — the page writes the colour's name in the sky over the path. */
          { x: 0, cam: portrait ? [0, 2.2, 9.6, 0, 3.2, -4] : [0, 2.2, 9.4, 0, 2.8, -4], color: PAINT[COLOR_ID] },
          { x: STEP_DX, make: () => letterBlocks(COLOR_ID), k: 1.7, color: PAINT[COLOR_ID] },
          ...(MIXES[COLOR_ID] ? [{ x: STEP_DX * 2, make: () => stumpMix(...MIXES[COLOR_ID]), color: PAINT[COLOR_ID] }] : []),
          { x: fx, z: FIND_Z, flower: [fx + 3.6, 3.6], color: PAINT[COLOR_ID] },
        ]
      : [
          { x: 0, make: colorBoxes, k: 1.4, color: PAINT.red },
          { x: STEP_DX, make: () => easel(), color: PAINT.yellow },
          { x: STEP_DX * 2, make: () => easel(), color: PAINT.green },
          { x: STEP_DX * 3, make: () => letterBlocks("green"), k: 1.7, color: PAINT.pink },
          { x: STEP_DX * 4, make: () => letterBlocks("pink"), k: 1.7, color: PAINT.purple },

      ? [
          { x: fx - 16, make: () => easel(undefined, SHAPE_OF_LESSON[LESSON - 1]), k: 1.25 },
          { x: fx - 10.6, make: drawingTable },
          { x: fx - 5.6, make: () => letterBlocks(SHAPE_OF_LESSON[LESSON - 1]) },
          { x: fx, z: FIND_Z, flower: [fx + 1.6, FIND_Z + 4.5] },

      : [
          { x: -6, make: shapeBoxes, shape: "circle" },
          { x: 37, make: easel, shape: "square" },
          { x: 77, make: easel, shape: "triangle" },
          { x: 117, make: drawingTable, shape: "rectangle" },
        ];
  /* My Garden's word-step thing: it grows out of the ground in the entry move. */
  const growers = [];
  const flowers = PLACES.map((place) => {
    if (place.make) {
      const prop = place.make();
      prop.scale.multiplyScalar(place.k ?? 1);
      prop.position.set(place.x, 0, PLACE_Z);

      if (place.pos) {

      }
      scene.add(prop);
      keepClear.push(new THREE.Box3().setFromObject(prop).expandByScalar(0.3));
    }
    /* No shape-flower blooms between the activities in the felt land (2026-11-09, the user). */
    if (VEG || YEAR_HILL || STOPS || LAND || FARM) return null;
    const [x, z] = place.flower ?? [place.x + 1.9, PLACE_Z + 1.5];
    const flower = ON_PATH ? shapeFlower("circle", place.color) : shapeFlower(place.shape ?? SHAPE_OF_LESSON[LESSON - 1]);
    flower.position.set(x, 0, z);

    scene.add(flower);
    keepClear.push(new THREE.Box3(new THREE.Vector3(x - 0.6, -1, z - 0.6), new THREE.Vector3(x + 0.6, 3, z + 0.6)));

  });
  /* The flowers out: those of the steps done (`done`), and the next one

  /* The hill: a lesson's season comes on as its steps are done; the review
     is the year turning, one season giving way to the next. */
  const hillGrow = (done, b) => {
    if (HILL_SEASON) return hillStates[HILL_SEASON].grow(clamp01((done + b) / PLACES.length));
    const now = YEAR[Math.max(0, done) % 4], next = YEAR[(Math.max(0, done) + 1) % 4];
    const leaving = b < 0.5;

    const n = 3 + Math.floor(rand() * 3);
    for (let j = 0; j < n; j++) {

  /* ---- The camera's stations: one per step after the reel — Shapes'

  const station = (x, look = x) =>
    ON_PATH ? (portrait ? [x, 2.5, 9.6, look, 1.1, -4] : [x, 2.5, 9.4, look, 1.2, -4]) : portrait ? [x, 2.9, 11.5, look, 2.0, -6] : [x, 2.7, 11.2, look, 1.9, -6];

  const DOWN = THREE.MathUtils.degToRad(72);

    : VEG
    ? portrait
      ? [4.5, 12, 27, 4.5, 1, -2]
      : [4.5, 7.2, 16.2, 4.5, 0.9, -2]
    : ON_PATH
    ? portrait
      ? [mid - 1, 15, 31, mid - 1, 0, -1]
      : [mid + 1, 12, 29, mid + 1, 0.2, -1.5]

        : [mid, 8.5, 17.5, mid, 0.2, -1.5]
      : portrait
        ? [117, 9, 19, 117, 0.5, -2]

  /* The kitchen's end is the counter again, blurred: the lesson's third station. */
  const STATIONS = VEG ? steps : [...steps, END];
  const ENTRY = (() => {
    if (YEAR_HILL) {

    if (SEAS) return END;

  const lookAt = new THREE.Vector3();
  function aim([x, y, z, lx, ly, lz]) {

  const BLOOM = [0.03, 0.33];
  const HOLD = 0.27;
  /* A smooth way through several points (Catmull-Rom), each [camera, look]. */
  function along(pts, e) {
    const n = pts.length - 1;

    const k = Math.floor(s), u = s - k;

  }
  function moveCam(i, t) {
    if (YEAR_HILL) {
      /* Round the tree, not across it. The way to the end has nothing to
         wait for: the season comes on as it sweeps. */
      const poses = [...PLACES.map((place) => place.pose), HILL_END];
      if (i === 0) {
        const [deg, r, y, lookR, lookY] = poses[0];
        return fromPose(lerp([deg - 35, r + 16, y + 10, lookR, lookY], poses[0], settle(t)));
      }
      const last = i === poses.length - 1;
      return fromPose(lerp(poses[i - 1], poses[i], smooth(last ? Math.min(1, t / 0.96) : Math.max(0, Math.min(1, (t - HOLD) / (0.96 - HOLD))))));
    }
    if (i === 0) return lerp(ENTRY, STATIONS[0], settle(t));
    if (VEG) return lerp(STATIONS[i - 1], STATIONS[i], smooth(Math.min(1, t / 0.96)));

    const e = smooth(Math.max(0, Math.min(1, (t - HOLD) / (0.96 - HOLD))));

  const render = (type = "image/png", quality) => {
    renderer.render(scene, view);
    return renderer.domElement.toDataURL(type, quality);
  };

  /* The way out of the kitchen: what the child put in the basket, the
     friend cheering. */
  const showBasket = (on) => {
    if (!VEG_KIND) return;
    kitchen.inBasket(on);
    if (kitchen.friend) kitchen.friend.fit(on ? kitchen.friend.joy : kitchen.friend.pic);
  };
  /* The word-step thing grows out of the ground in the second half of the
     entry move: a spring (it overshoots a little and settles), tall first and
     wide a beat later — a grower (flower, tree, leaf, grass) twists a little as
     it comes up, a nest or a bench just pops up. Exactly 1 at the move's end. */
  const growBase = growers.map((o) => ({ o, s: o.scale.clone(), ry: o.rotation.y }));

    const tall = spring(u), wide = spring(Math.max(0, u - 0.1) / 0.9);

    for (const { o, s, ry } of growBase) {
      o.visible = u > 0;
      const k = plain ? tall : wide;
      o.scale.set(s.x * Math.max(0.0001, k), s.y * Math.max(0.0001, tall), s.z * Math.max(0.0001, k));

    stations: STATIONS.length,

    shot(cam, fov) {

    /* Station i's still. */
    station(i) {

    },
    /* Frame `t` of move i. */
    move(i, t) {

    findLayers() {

      out.all = render();
      const all = Object.entries(things);
      all.forEach(([, t]) => (t.group.visible = false));
      out.background = render();
      const world = scene.children.filter((o) => o !== catcher && !o.isLight && o.visible && !all.some(([, t]) => t.group === o));

      scene.fog = null;
