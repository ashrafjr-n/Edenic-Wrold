/* ---------- The videos' look (2026-10-12) ----------
   The things as the course videos draw them (direct request: "the same
   style as the videos" — their stills in `public/things-in-videos/`):
   the vegetables smooth satin clay, true to life, no face, coloured per
   vertex (`tint`). The grain stays (`crop.py things … --grain`). The
   animals are the videos' own, cut out of the stills (`cut.py`) — the
   shell-fur 3D puppy that came first went 2026-10-13. */

/* `geo` with a part's own scale, turn and place baked in. */
function bake(geo, { scale = [1, 1, 1], at = [0, 0, 0], rot = [0, 0, 0] } = {}) {
  const m = new THREE.Matrix4().compose(new THREE.Vector3(...at), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), new THREE.Vector3(...scale));
  geo.applyMatrix4(m);
  geo.computeVertexNormals();
  return geo;
}

/* Colour per vertex: `paint(p, n)` → [THREE.Color, …] at the point `p`
   (the thing's own space) with normal `n`. */
function tint(geo, paint) {
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const colors = new Float32Array(pos.count * 3);
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    n.fromBufferAttribute(nor, i);
    const [c] = paint(p, n);
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  return geo;
}

/* Smooth satin clay for the videos' vegetables, coloured per vertex. */
const satin = (extra = {}) => new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.48, clearcoat: 0.18, clearcoatRoughness: 0.45, sheen: 0.35, sheenRoughness: 0.5, sheenColor: 0xffffff, ...extra });

const smooth = (t) => t * t * (3 - 2 * t);

/* The videos' carrot: fat at its rounded shoulder, tapering to a blunt
   round tip, curved grooves across its front (deeper orange in them),
   smooth satin clay; a fan of short, chubby olive leaves on top. No face.
   Leaning `tilt` alone; upright in Nova's carrot bed. */
function videoCarrot(tilt = -0.32) {
  const g = new THREE.Group();
  const geo = new THREE.LatheGeometry(new THREE.SplineCurve([[0, 0], [0.08, 0.02], [0.18, 0.13], [0.3, 0.42], [0.4, 0.82], [0.47, 1.17], [0.49, 1.38], [0.44, 1.53], [0.28, 1.62], [0, 1.65]].map(([x, y]) => new THREE.Vector2(x, y))).getPoints(220), 180);
  /* Each groove: its height, the way it faces and how far round it goes. */
  const GROOVES = [[0.3, 0.2, 1.2], [0.47, -0.5, 1.4], [0.64, 0.4, 1.5], [0.81, -0.2, 1.6], [0.98, 0.6, 1.5], [1.15, -0.4, 1.6], [1.31, 0.1, 1.4]];
  const deep = (v) => {
    const a = Math.atan2(v.x, v.z);
    let d = 0;
    for (const [y, face, reach] of GROOVES) {
      const off = Math.atan2(Math.sin(a - face), Math.cos(a - face));
      const arc = Math.max(0, 1 - Math.abs(off) / reach);
      /* Curved: lower at its middle, rising round the sides. */
      const at = y - 0.045 * Math.cos(off);
      d = Math.max(d, smooth(arc) * Math.exp(-(((v.y - at) / 0.026) ** 2)));
    }
    return d;
  };
  swell(geo, (v) => -0.03 * deep(v));
  const orange = new THREE.Color(0xef6e22), groove = new THREE.Color(0xbd4c16), shoulder = new THREE.Color(0xf47e2c);
  tint(geo, (v) => {
    const c = orange.clone().lerp(shoulder, Math.max(0, (v.y - 1.2) * 2));
    return [c.lerp(groove, deep(v) * 0.85), 0];
  });
  g.add(mesh(geo, satin({ roughness: 0.36, clearcoat: 0.32 })));
  /* The leaves: short chubby stalks, fanned out flat. */
  const olive = [new THREE.Color(0xa7b14c), new THREE.Color(0x95a543)];
  [[-1.05, 0.1, 0.38], [-0.62, 0.12, 0.46], [-0.2, 0.1, 0.5], [0.22, 0.1, 0.5], [0.64, 0.12, 0.46], [1.05, 0.1, 0.38]].forEach(([fan, lean, h], i) => {
    const leaf = new THREE.CapsuleGeometry(0.085, h, 12, 24);
    leaf.translate(0, h / 2 + 0.06, 0);
    bake(leaf, { scale: [1, 1, 0.8], at: [Math.sin(fan) * 0.12, 1.55, 0], rot: [lean, 0, fan] });
    tint(leaf, (v) => [olive[i % 2].clone().lerp(new THREE.Color(0xc3c76a), Math.max(0, (v.y - 1.75) * 1.4)), 0]);
    g.add(mesh(leaf, satin({ roughness: 0.55 })));
  });
  g.rotation.z = tilt;
  return g;
}

/* `tint` every mesh of a group (a `taperTube` is a tube and its two round
   caps), each at its own place in the group. */
function tintAll(g, paint) {
  g.traverse((o) => {
    if (o.isMesh) tint(o.geometry, (p, n) => paint(p.clone().add(o.position), n));
  });
  return g;
}

/* A soft value noise in 3D (seeded hash), 0–1 — for mottled skins. */
function noise3(x, y, z) {
  const h = (a, b, c) => {
    const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
    return v - Math.floor(v);
  };
  const [ix, iy, iz] = [Math.floor(x), Math.floor(y), Math.floor(z)];
  const [fx, fy, fz] = [x - ix, y - iy, z - iz].map((t) => t * t * (3 - 2 * t));
  let v = 0;
  for (const [dx, wx] of [[0, 1 - fx], [1, fx]]) for (const [dy, wy] of [[0, 1 - fy], [1, fy]]) for (const [dz, wz] of [[0, 1 - fz], [1, fz]]) v += h(ix + dx, iy + dy, iz + dz) * wx * wy * wz;
  return v;
}

/* The videos' potato: a plump oval, tan with soft darker patches, a few
   small dark eyes sunk in it, a little lumpy. */
function videoPotato() {
  const geo = bake(new THREE.SphereGeometry(1, 128, 96), { scale: [0.62, 0.44, 0.46] });
  const EYES = [[0.2, 0.18, 0.4], [-0.32, 0.1, 0.35], [0.42, -0.05, 0.22], [-0.05, 0.3, 0.28], [-0.45, -0.12, 0.2], [0.1, -0.22, 0.38], [0.5, 0.2, 0], [-0.2, -0.3, 0.3], [0.32, 0.32, 0.1], [-0.12, 0.05, 0.45], [0.05, 0.42, -0.1], [-0.4, 0.28, 0.05], [0.28, -0.28, 0.2], [-0.3, -0.05, -0.3], [0.45, 0.05, -0.25], [0.0, -0.4, 0.05], [-0.15, 0.25, -0.35], [0.18, -0.08, -0.42]];
  const eyeAt = (v) => EYES.reduce((d, e) => Math.max(d, Math.exp(-((v.distanceTo(new THREE.Vector3(...e).normalize().multiply(new THREE.Vector3(0.62, 0.44, 0.46))) / 0.026) ** 2))), 0);
  swell(geo, (v) => 0.035 * (noise3(v.x * 3, v.y * 3, v.z * 3) - 0.5) - 0.024 * eyeAt(v));
  const tan = new THREE.Color(0xa8653a), dark = new THREE.Color(0x834826), eye = new THREE.Color(0x4a2a12);
  tint(geo, (v) => {
    const m = noise3(v.x * 5 + 3, v.y * 5, v.z * 5);
    return [tan.clone().lerp(dark, smooth(Math.min(1, Math.max(0, (m - 0.35) / 0.45))) * 0.75).lerp(eye, eyeAt(v)), 0];
  });
  const g = group(mesh(geo, satin({ roughness: 0.6, clearcoat: 0.14, sheen: 0.12 })));
  g.rotation.set(0.25, -0.35, 0.12);
  return g;
}

/* The same potato growing in Nova's potato bed: lying on the soil, a
   little sprout of leaves on top. */
function videoPotatoPlant() {
  const g = new THREE.Group();
  const potato = videoPotato();
  potato.rotation.set(0, -0.2, 0);
  potato.position.y = 0.44;
  g.add(potato);
  const green = satin({ roughness: 0.55 });
  const leafG = new THREE.Color(0x5f9e36);
  g.add(tintAll(taperTube([[0, 0.8, -0.05], [0.01, 0.96, -0.05], [0, 1.08, -0.05]], 0.035, 0.03, green), () => [leafG.clone(), 0]));
  for (const [a, y] of [[-0.9, 0.98], [0.9, 1.02], [-0.35, 1.12], [0.4, 1.15]]) {
    const leaf = bake(new THREE.SphereGeometry(0.12, 24, 12), { scale: [1.5, 0.4, 0.8], at: [Math.sin(a) * 0.16, y, -0.05], rot: [0, 0, a * 0.6] });
    tint(leaf, () => [leafG.clone().lerp(new THREE.Color(0x86bd4c), 0.3), 0]);
    g.add(mesh(leaf, green));
  }
  return g;
}

/* The videos' broccoli: pale green stalks branching up into dense florets,
   each a mound of small round buds, dark green with lighter tips. */
function videoBroccoli() {
  const g = new THREE.Group();
  const stalk = satin({ roughness: 0.5 });
  const pale = new THREE.Color(0x9cc456), paler = new THREE.Color(0xc4dc84);
  const tube = (pts, r0, r1) => tintAll(taperTube(pts, r0, r1, stalk), (v) => [pale.clone().lerp(paler, Math.max(0, 0.7 - v.y) * 0.9), 0]);
  /* A short thick stalk, branching into a stem per floret. */
  g.add(tube([[0, 0, 0], [0, 0.25, 0], [0, 0.45, 0]], 0.2, 0.17));
  const HEADS = [[0, 1.08, 0.06, 0.34], [-0.44, 0.92, 0.02, 0.29], [0.44, 0.92, 0.04, 0.29], [-0.24, 0.94, 0.34, 0.27], [0.26, 0.92, 0.34, 0.27], [-0.2, 1.16, -0.28, 0.26], [0.22, 1.14, -0.26, 0.26]];
  const bud = new THREE.SphereGeometry(1, 12, 8);
  const dark = new THREE.Color(0x3e7d2c), mid = new THREE.Color(0x5a9a38), light = new THREE.Color(0x86b955);
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (const [x, y, z, r] of HEADS) {
    g.add(tube([[x * 0.15, 0.4, z * 0.15], [x * 0.55, 0.62, z * 0.55], [x, y - r * 0.55, z]], 0.075, 0.06));
    const mound = bake(new THREE.SphereGeometry(r * 0.86, 48, 32), { scale: [1, 0.8, 1], at: [x, y, z] });
    tint(mound, () => [dark.clone(), 0]);
    g.add(mesh(mound, satin({ roughness: 0.8 })));
    /* Buds all over the mound's top, small and close, in a few clusters
       (a floret is florets): each cluster a bump of buds. */
    const n = Math.round(r * r * 5200);
    const buds = new THREE.InstancedMesh(bud, new THREE.MeshPhysicalMaterial({ roughness: 0.7, sheen: 0.3, sheenColor: 0xd8ffb0 }), n);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
    for (let i = 0; i < n; i++) {
      const u = rnd() * Math.PI * 2, w = Math.acos(1 - rnd() * 1.25);
      const d = new THREE.Vector3(Math.sin(w) * Math.cos(u), Math.cos(w) * 0.8, Math.sin(w) * Math.sin(u));
      const bump = 0.08 * noise3(d.x * 6 + x * 9, d.y * 6, d.z * 6 + z * 9);
      const k = r * (0.04 + rnd() * 0.025);
      m.compose(new THREE.Vector3(x, y, z).addScaledVector(d, r * (0.84 + bump)), q, new THREE.Vector3(k, k, k));
      buds.setMatrixAt(i, m);
      buds.setColorAt(i, c.copy(dark).lerp(mid, 0.4 + rnd() * 0.6).lerp(light, Math.max(0, bump * 6 - 0.2) * 0.5 + rnd() * 0.15));
    }
    buds.castShadow = true;
    buds.receiveShadow = true;
    g.add(buds);
  }
  return g;
}

/* The videos' pumpkin: round and a little squat, deep ribs, glossy orange,
   a thick dark curly stem. (The video's is a carved lantern — no face
   here: the vegetables carry none.) */
function videoPumpkin() {
  const g = new THREE.Group();
  const geo = bake(new THREE.SphereGeometry(1, 192, 96), { scale: [0.78, 0.6, 0.78] });
  const RIBS = 9;
  swell(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    const rib = Math.abs(Math.cos((a * RIBS) / 2));
    const side = Math.sqrt(Math.max(0, 1 - (v.y / 0.6) ** 2));
    return -0.075 * (1 - rib) ** 2.2 * side;
  });
  /* The top and bottom pressed in round the stem. */
  swell(geo, (v) => -0.12 * Math.exp(-((v.x * v.x + v.z * v.z) / 0.02)));
  const orange = new THREE.Color(0xe45a18), deep = new THREE.Color(0xa83a0c);
  tint(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    const rib = Math.abs(Math.cos((a * RIBS) / 2));
    return [orange.clone().lerp(deep, (1 - rib) ** 2 * 0.8), 0];
  });
  g.add(mesh(geo, satin({ roughness: 0.4, clearcoat: 0.3 })));
  const stem = taperTube([[0, 0.44, 0], [0.02, 0.62, 0.01], [0.08, 0.76, 0.02], [0.18, 0.8, 0.03]], 0.1, 0.06, satin({ roughness: 0.7 }));
  tintAll(stem, (v) => [new THREE.Color(0x4f3a22).lerp(new THREE.Color(0x6e5a32), Math.max(0, (v.y - 0.5) * 2)), 0]);
  g.add(stem);
  return g;
}

/* The videos' tomato: glossy red, a little squat with soft lobes, a green
   star of pointed leaves on top and a short stalk. */
function videoTomato() {
  const g = new THREE.Group();
  const geo = bake(new THREE.SphereGeometry(1, 160, 96), { scale: [0.62, 0.52, 0.6] });
  swell(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    return 0.018 * Math.cos(a * 5) * Math.max(0, 1 - Math.abs(v.y) / 0.52) - 0.06 * Math.exp(-((v.x * v.x + v.z * v.z) / 0.015)) * (v.y > 0 ? 1 : 0.4);
  });
  const red = new THREE.Color(0xd4261a), deep = new THREE.Color(0xa0150e), warm = new THREE.Color(0xe84a24);
  tint(geo, (v) => [red.clone().lerp(deep, Math.max(0, -v.y) * 0.7).lerp(warm, Math.max(0, v.y - 0.3) * 0.8), 0]);
  g.add(mesh(geo, satin({ roughness: 0.22, clearcoat: 0.7, clearcoatRoughness: 0.15 })));
  const green = satin({ roughness: 0.5 });
  const leafG = new THREE.Color(0x3f7a26), leafL = new THREE.Color(0x6a9e3a);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.2;
    const tip = [Math.cos(a) * 0.36, 0.42 + (i % 2) * 0.05, Math.sin(a) * 0.36];
    const leaf = taperTube([[0, 0.5, 0], [tip[0] * 0.55, 0.52, tip[2] * 0.55], tip], 0.045, 0.008, green);
    tintAll(leaf, (v) => [leafG.clone().lerp(leafL, Math.min(1, Math.hypot(v.x, v.z) * 2.5)), 0]);
    g.add(leaf);
  }
  const stalk = taperTube([[0, 0.46, 0], [0.01, 0.6, 0], [0.05, 0.68, 0.01]], 0.035, 0.028, green);
  tintAll(stalk, () => [leafG.clone(), 0]);
  g.add(stalk);
  return g;
}

/* The videos' bell pepper: blocky and glossy, four lobes at its bottom, a
   thick curved green stalk. `color`: red or green. */
function videoPepper(color = "red") {
  const g = new THREE.Group();
  const geo = new THREE.LatheGeometry(new THREE.SplineCurve([[0, 0.04], [0.22, 0.0], [0.44, 0.1], [0.54, 0.34], [0.55, 0.62], [0.5, 0.8], [0.36, 0.88], [0.14, 0.87], [0, 0.82]].map(([x, y]) => new THREE.Vector2(x, y))).getPoints(160), 160);
  /* The lathe's seam (its normals split there) turned to the back. */
  geo.rotateY(Math.PI);
  swell(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    const lobes = Math.abs(Math.cos(a * 2));
    return 0.07 * (lobes - 0.6) * Math.min(1, Math.hypot(v.x, v.z) * 2) - 0.12 * Math.max(0, 1 - lobes) ** 3 * Math.max(0, 0.5 - v.y);
  });
  const body = color === "red" ? [new THREE.Color(0xd02016), new THREE.Color(0x96110a)] : [new THREE.Color(0x4a9e2c), new THREE.Color(0x2a6e18)];
  tint(geo, (v) => {
    const a = Math.atan2(v.z, v.x);
    return [body[0].clone().lerp(body[1], (1 - Math.abs(Math.cos(a * 2))) * 0.6), 0];
  });
  g.add(mesh(geo, satin({ roughness: 0.2, clearcoat: 0.75, clearcoatRoughness: 0.12 })));
  const stalk = taperTube([[0, 0.8, 0], [0.01, 0.94, 0], [0.06, 1.06, 0.02], [0.16, 1.12, 0.03]], 0.07, 0.05, satin({ roughness: 0.45 }));
  tintAll(stalk, () => [new THREE.Color(0x5e9a34), 0]);
  g.add(stalk);
  const cap = bake(new THREE.SphereGeometry(0.16, 32, 16), { scale: [1, 0.35, 1], at: [0, 0.84, 0] });
  tint(cap, () => [new THREE.Color(0x5e9a34), 0]);
  g.add(mesh(cap, satin({ roughness: 0.5 })));
  g.rotation.z = -0.12;
  return g;
}

const VIDEO_THINGS = {
  carrot: () => videoCarrot(),
  potato: videoPotato,
  broccoli: videoBroccoli,
  pumpkin: videoPumpkin,
  tomato: videoTomato,
  pepper: () => videoPepper("red"),
  greenPepper: () => videoPepper("green"),
};
ITEMS.video = (what) => VIDEO_THINGS[what]();

/* A see-through floor that only shows shadows, for the item layers. */
const catcher = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.3 }));
catcher.rotation.x = -Math.PI / 2;
catcher.receiveShadow = true;
scene.add(catcher);

/* Lay a thing down or turn it as its scene says, then stand it on `y`. */
function place(group, it) {
  if (it.rot) group.rotation.set(...it.rot);
  if (it.rotY) group.rotation.y = it.rotY;
  if (it.scale) group.scale.setScalar(it.scale);
  group.position.set(it.at[0], 0, it.at[2]);
  if (def && def.autoGround) {
    group.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(group);
    group.position.y = it.at[1] - box.min.y;
  } else {
    group.position.y = it.at[1];
  }
}

/* White where one of `parts` is the nearest thing, black everywhere
   else: the whole world drawn black (for its depth), then each part again
   in white, cut at its z, wherever it is the nearest. */
const black = new THREE.MeshBasicMaterial({ color: 0x000000, toneMapped: false, side: THREE.DoubleSide });
function maskOf(parts) {
  renderer.setClearColor(0x000000, 1);
  scene.overrideMaterial = black;
  renderer.render(scene, camera);
  scene.overrideMaterial = null;
  const layer = new THREE.Scene();
  for (const [thing, cut] of parts) {
    thing.updateMatrixWorld(true);
    const white = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      toneMapped: false,
      side: THREE.DoubleSide,
      depthFunc: THREE.LessEqualDepth,
      clippingPlanes: cut === -Infinity ? [] : [new THREE.Plane(new THREE.Vector3(0, 0, 1), -cut)],
    });
    thing.traverse((o) => {
      if (!o.isMesh) return;
      const copy = new THREE.Mesh(o.geometry, white);
      copy.matrixAutoUpdate = false;
      copy.matrix.copy(o.matrixWorld);
      layer.add(copy);
    });
  }
  renderer.autoClear = false;
  renderer.render(layer, camera);
  renderer.autoClear = true;
  return renderer.domElement.toDataURL("image/png");
}

/* A basket's mouth on the picture, % — where what is picked piles up. */
function mouthOf(basket) {
  basket.updateMatrixWorld(true);
  const p = new THREE.Vector3();
  let [l, t, r, b] = [Infinity, Infinity, -Infinity, -Infinity];
  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * Math.PI * 2;
    basket.localToWorld(p.set(Math.cos(a) * 0.84, 0.66, Math.sin(a) * 0.84)).project(camera);
    const x = ((p.x + 1) / 2) * 100;
    const y = ((1 - p.y) / 2) * 100;
    [l, t, r, b] = [Math.min(l, x), Math.min(t, y), Math.max(r, x), Math.max(b, y)];
  }
  return [l, t, r - l, b - t].map((v) => Math.round(v * 100) / 100);
}

const THING = params.get("thing");
const HARVEST = params.get("harvest");
const BASKET = params.has("basket");
const SEASON = params.get("season");
const WEATHERSTEPS = params.get("weathersteps");
const BACKDROP = params.get("backdrop");
const CLASSROOM = params.get("classroom");
const def = THING || HARVEST || BASKET || SEASON || WEATHERSTEPS || BACKDROP ? null : SCENES[SCENE];

if (THING) {
  /* ---------- One thing alone, seen from the front and a little above ---------- */
  const arg = params.get("arg");
  const group = ITEMS[THING](arg ?? undefined);
  /* The friends' look (Nova's cup; Bloo's animals' homes, the weather and
     what is worn for it; the videos' vegetables): a softer, fuller light —
     their felt is evenly lit, with no hard dark side. */
  if (["cup", "catBed", "kennel", "fishbowl", "wear", "weather", "weatherbit", "video"].includes(THING)) {
    sun.intensity = 1.9;
    sky.intensity = 1.15;
    scene.environmentIntensity = 0.5;
  }
  /* The videos' light: warm and soft from the front, a pink sky, a blue
     ground, and a rim of light from behind that the fur catches. */
  if (THING === "video") {
    sun.color.set(0xfff0e4);
    sun.intensity = 1.7;
    sun.position.set(-3, 8, 10);
    sky.color.set(0xfff0f6);
    sky.groundColor.set(0xc8d4ff);
    sky.intensity = 1.35;
    scene.environmentIntensity = 0.55;
    const rim = new THREE.DirectionalLight(0xffe6f2, 1.6);
    rim.position.set(4, 6, -8);
    scene.add(rim);
  }
  scene.add(group);
  catcher.position.y = 0.001;
  /* `?shadow=0`: a thing that floats (a balloon) casts no ground shadow. */
  catcher.visible = params.get("shadow") !== "0";
  group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group);
  const centre = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z) * 0.78;
  const lift = THREE.MathUtils.degToRad(Number(params.get("lift") ?? (["pot", "soupPot"].includes(THING) ? 32 : 24)));
  /* `?lift=` for a thing best seen from higher up (a leaf, a foot).
     `?px=2` draws it at twice the pixels — the videos' fine detail needs it, and the
     crop scales it down smooth. */
  renderer.setPixelRatio(Number(params.get("px") ?? 1));
  renderer.setSize(800, 800);
  camera.left = -span; camera.right = span; camera.top = span; camera.bottom = -span;
  camera.position.set(centre.x, centre.y + Math.sin(lift) * 30, centre.z + Math.cos(lift) * 30);
  camera.lookAt(centre);
  camera.updateProjectionMatrix();
  renderer.setClearColor(0x000000, 0);
  window.renderLayers = () => {
    const out = { [THING]: frame() };
    let face = false;
    group.traverse((o) => (face ||= Boolean(o.userData.shiny)));
    if (face) out.face = shinyMask();
    return out;
  };
  window.itemsMeta = () => ({});
} else if (HARVEST) {
  /* ---------- Nova's garden: the world, the five foods, and what stands
     in front of them (the basket's near half, a bed's near half) ---------- */
  const garden = GARDENS[HARVEST];
  /* A garden of several plants is wider than the phone's 4:5. */
  if (garden.size) {
    const [w, h] = garden.size;
    renderer.setSize(w, h);
    Object.assign(camera, { left: -garden.view / 2, right: garden.view / 2, top: (garden.view * h) / w / 2, bottom: -(garden.view * h) / w / 2 });
    camera.updateProjectionMatrix();
  }
  const lift = THREE.MathUtils.degToRad(garden.lift ?? 12);
  camera.position.set(0, garden.centreY + Math.sin(lift) * 30, Math.cos(lift) * 30);
  camera.lookAt(0, garden.centreY, 0);
  renderer.localClippingEnabled = true;
  catcher.visible = false;

  const world = new THREE.Group();
  scene.add(world);
  const { group: grown, front = [], far } = garden.world();
  world.add(gardenGround(far, garden.size ? 16 : 6), grown);
  /* A one-food garden has its basket on the grass; the exams' gardens have
     none — their basket stands beside the garden (`?basket`). */
  const basket = garden.basket && ITEMS.basket();
  if (basket) {
    const [bx, bz, bs] = garden.basket;
    basket.scale.setScalar(bs);
    basket.position.set(bx, 0, bz);
    world.add(basket);
  }
  /* [thing, z]: the part of the thing nearer than z. In FRONT of the food:
     a bed's near half and the whole basket; over what is piled in the
     basket, its near half (the rim). */
  const frontParts = basket ? [...front, [basket, -Infinity]] : front;

  /* Each kind of food and where it grows — one kind, unless the garden
     lists several. */
  const kinds = garden.foods ?? [{ ...garden, food: garden.food ?? HARVEST }];
  const foods = kinds.flatMap((kind) =>
    kind.at.map(([x, y, z]) => {
      const food = (kind.make ?? ITEMS[kind.food])();
      if (kind.rot) food.rotation.set(...kind.rot);
      food.scale.setScalar(kind.scale);
      food.position.set(x, y, z);
      scene.add(food);
      return food;
    }),
  );

  window.renderLayers = () => {
    const out = {};
    renderer.setClearColor(SKY, 1);
    out.all = frame();
    foods.forEach((f) => (f.visible = false));
    out.background = frame();
    if (frontParts.length) out.frontmask = maskOf(frontParts);
    if (basket) out.rimmask = maskOf([[basket, garden.basket[1]]]);
    world.visible = false;
    renderer.setClearColor(0x000000, 0);
    foods.forEach((f, k) => {
      foods.forEach((o) => (o.visible = o === f));
      out[`item${k}`] = frame();
    });
    return out;
  };
  window.itemsMeta = () => ({
    count: foods.length,
    basket: basket ? mouthOf(basket) : null,
    foods: kinds.flatMap((kind) => kind.at.map(() => kind.food)),
    tilt: kinds.flatMap((kind) => kind.tilt ?? kind.at.map(() => 0)),
    pivot: garden.pivot ?? "top",
  });
} else if (BASKET) {
  /* ---------- Nova's basket alone — the Fruits review's exams, where it
     stands beside her garden: the basket (no shadow — the page gives it
     one, in its shadow hue), a mask of its near
     half (the rim, over what is piled in it — cut in front of the handle,
     so all of the pile lies over that) and its mouth ---------- */
  const basket = ITEMS.basket();
  scene.add(basket);
  catcher.visible = false;
  renderer.setSize(800, 800);
  renderer.localClippingEnabled = true;
  const lift = THREE.MathUtils.degToRad(Number(params.get("lift") ?? 26));
  const span = 1.25;
  Object.assign(camera, { left: -span, right: span, top: span, bottom: -span });
  camera.position.set(0, 0.55 + Math.sin(lift) * 30, Math.cos(lift) * 30);
  camera.lookAt(0, 0.55, 0);
  camera.updateProjectionMatrix();
  window.renderLayers = () => {
    renderer.setClearColor(0x000000, 0);
    const out = { basket: frame() };
    /* The wicker only — the floor inside lies under the pile. */
    out.rimmask = maskOf(basket.children.filter((m) => m.geometry.type !== "CircleGeometry").map((m) => [m, 0.1]));
    return out;
  };
  window.itemsMeta = () => ({ mouth: mouthOf(basket) });
} else if (WEATHERSTEPS) {
  /* ---------- Making the weather: each state of the hill, then each thing
     in its sky alone — one camera for all, the weather pictures' own (the
     framing `?thing=weather` gets from its unseen box), in the friends'
     felt light. No ground shadow. ---------- */
  const def = WEATHER_STEPS[WEATHERSTEPS];
  catcher.visible = false;
  sun.intensity = 1.9;
  sky.intensity = 1.15;
  scene.environmentIntensity = 0.5;
  renderer.setSize(800, 800);
  const span = 5.6 * 0.78;
  Object.assign(camera, { left: -span, right: span, top: span, bottom: -span });
  const lift = THREE.MathUtils.degToRad(24);
  camera.position.set(0, 2.8 + Math.sin(lift) * 30, Math.cos(lift) * 30);
  camera.lookAt(0, 2.8, 0);
  camera.updateProjectionMatrix();
  window.renderLayers = () => {
    renderer.setClearColor(0x000000, 0);
    const out = {};
    const shoot = (name, thing) => {
      scene.add(thing);
      out[name] = frame();
      let face = false;
      thing.traverse((o) => (face ||= Boolean(o.userData.shiny)));
      if (face) out[`${name}.face`] = shinyMask();
      scene.remove(thing);
    };
    def.states.forEach((make, k) => shoot(`frame${k}`, weatherGroup(make())));
    def.sky.forEach((make, i) => shoot(`sky${i}`, make()));
    return out;
  };
  window.itemsMeta = () => ({});
} else if (SEASON) {
  /* ---------- Nova's seasons: the island, then one frame per step, each
     with everything before it. The camera is the same for all four, so
     the four pictures match (`crop.py seasons` cuts them on one box). No
     ground shadow — the page draws one. ---------- */
  const season = SEASON_DEFS[SEASON];
  const island = seasonIsland(season.band);
  scene.add(island.group);
  const tree = seasonTree();
  tree.position.set(0, SOIL_Y, -0.45);
  scene.add(tree);
  /* What grows on the tree (and its spot) is in the tree's own frame. */
  const steps = season.steps.map(({ make, onTree }) => {
    const thing = make();
    (onTree ? tree : scene).add(thing);
    return thing;
  });
  catcher.visible = false;
  renderer.setSize(1000, 1000);
  const span = 3.95;
  Object.assign(camera, { left: -span, right: span, top: span, bottom: -span });
  const lift = THREE.MathUtils.degToRad(18);
  camera.position.set(0, 2.95 + Math.sin(lift) * 30, Math.cos(lift) * 30);
  camera.lookAt(0, 2.95, 0);
  camera.updateProjectionMatrix();
  window.renderLayers = () => {
    renderer.setClearColor(0x000000, 0);
    const out = {};
    for (let k = 0; k <= steps.length; k++) {
      steps.forEach((thing, i) => (thing.visible = i < k));
      /* Every season's first step is its ground, over the soil. */
      island.soil.visible = k === 0;
      out[`frame${k}`] = frame();
    }
    return out;
  };
  /* Each step's spot, % of the picture. */
  window.itemsMeta = () => ({
    spots: season.steps.map(({ spot, onTree }) => {
      const p = new THREE.Vector3(...spot);
      if (onTree) tree.localToWorld(p);
      p.project(camera);
      return [Math.round(((p.x + 1) / 2) * 10000) / 100, Math.round(((1 - p.y) / 2) * 10000) / 100];
    }),
  });
} else if (CLASSROOM) {
  /* ---------- A friend's classroom (Pinki's 2026-10-14; Nova's and
     Bloo's 2026-10-23 — `THEMES` below): their hub and course
     pages. The board itself is the page's (HTML, sharp in every language);
     this is everything round it — a pink wall with shape bunting, the
     class's crayon drawings pinned up, a "Small Steps, Big Dreams" poster
     and, on a landscape wall, a sunny window with a plant and a globe on
     its sill — and, alone, the child's own desk in the front
     (`&layer=front`). Placed where the page leaves the wall in sight (the
     right above Pinki and the left edge on a desktop; under the board's
     left on a phone or tablet). `crop.py classroom` keeps the wall sharp
     and blurs the desk. `?classroom=pinki&frame=portrait|landscape`. ---------- */
  /* The poster's words are in the site's own Fredoka. */
  const fonts = document.createElement("link");
  fonts.rel = "stylesheet";
  fonts.href = "https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block";
  document.head.append(fonts);
  await new Promise((done) => { fonts.onload = done; });
  await document.fonts.load("700 100px Fredoka");
  const portrait = params.get("frame") === "portrait";
  const [w, h] = portrait ? [1080, 1920] : [1920, 1080];
  renderer.setSize(w, h);

     beside the rainbow). */
  const poster = (x, y, wd, ht, tall) => {
    const W2 = tall ? 640 : 960, H2 = Math.round(W2 * (ht / wd));
    const c = document.createElement("canvas");
    c.width = W2; c.height = H2;
    const g = c.getContext("2d");
    g.fillStyle = "#fffaf0";
    g.fillRect(0, 0, W2, H2);
    g.strokeStyle = THEME.poster.frame; g.lineWidth = 18;
    g.strokeRect(22, 22, W2 - 44, H2 - 44);
    const word = (text, cx, cy, size, color, room = W2 * 0.84) => {
      /* Never wider than the poster leaves it (Nova's and Bloo's words are
         longer than Pinki's). */
      g.font = `700 ${size}px Fredoka`;
      size = Math.min(size, (size * room) / g.measureText(text).width);
      g.font = `700 ${size}px Fredoka`;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.lineJoin = "round"; g.lineWidth = size * 0.16; g.strokeStyle = "#ffffff";
      g.strokeText(text, cx, cy);
      g.fillStyle = color;
      g.fillText(text, cx, cy);
    };
    const star = (cx, cy, r, color) => {
      g.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + (k * Math.PI) / 5, rr = k % 2 ? r * 0.45 : r; g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
      g.closePath(); g.fillStyle = color; g.fill();
    };
    const rainbow = (cx, cy, r, band) => {
      g.lineCap = "round";
      ["#ee4645", "#ff8c2e", "#ffd31a", "#4fbf5a", "#3f86e8", "#9257de"].forEach((col, i) => {
        g.beginPath(); g.arc(cx, cy, r - i * band, Math.PI, Math.PI * 2); g.lineWidth = band * 0.92; g.strokeStyle = col; g.stroke();
      });
      for (const side of [-1, 1]) { g.beginPath(); g.arc(cx + side * (r - band * 2.5), cy + band * 0.3, band * 1.6, 0, Math.PI * 2); g.fillStyle = "#e3f1ff"; g.fill(); }
    };
    /* Nova's sprout in its pot; Bloo's sun peeping over a cloud. */
    const sprout = (cx, cy, k) => {
      g.fillStyle = "#e8924a";
      g.beginPath(); g.moveTo(cx - k * 0.7, cy - k * 0.2); g.lineTo(cx + k * 0.7, cy - k * 0.2); g.lineTo(cx + k * 0.5, cy + k * 0.8); g.lineTo(cx - k * 0.5, cy + k * 0.8); g.closePath(); g.fill();
      g.fillStyle = "#c97534"; g.fillRect(cx - k * 0.78, cy - k * 0.36, k * 1.56, k * 0.26);
      g.strokeStyle = "#4fbf5a"; g.lineWidth = k * 0.16; g.lineCap = "round";
      g.beginPath(); g.moveTo(cx, cy - k * 0.36); g.lineTo(cx, cy - k * 1.1); g.stroke();
      g.fillStyle = "#7cc66a";
      g.beginPath(); g.ellipse(cx - k * 0.42, cy - k * 1.12, k * 0.42, k * 0.22, -0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(cx + k * 0.42, cy - k * 1.3, k * 0.42, k * 0.22, 0.5, 0, Math.PI * 2); g.fill();
    };
    const sunCloud = (cx, cy, k) => {
      g.fillStyle = "#ffc93a";
      g.beginPath(); g.arc(cx + k * 0.35, cy - k * 0.3, k * 0.62, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#ffb02e"; g.lineWidth = k * 0.12; g.lineCap = "round";
      for (let i = 0; i < 8; i++) { const a = -Math.PI + (i / 7) * Math.PI; g.beginPath(); g.moveTo(cx + k * 0.35 + Math.cos(a) * k * 0.8, cy - k * 0.3 + Math.sin(a) * k * 0.8); g.lineTo(cx + k * 0.35 + Math.cos(a) * k * 1.05, cy - k * 0.3 + Math.sin(a) * k * 1.05); g.stroke(); }
      g.fillStyle = "#e3f1ff";
      for (const [dx, dy, r] of [[-0.45, 0.25, 0.42], [0.05, 0.1, 0.55], [0.55, 0.3, 0.4]]) { g.beginPath(); g.arc(cx + dx * k, cy + dy * k, r * k, 0, Math.PI * 2); g.fill(); }
    };
    const emblem = (cx, cy, k) =>
      THEME.poster.emblem === "sprout" ? sprout(cx, cy, k) : THEME.poster.emblem === "sun" ? sunCloud(cx, cy, k) : null;
    const [t1, t2, t3, t4] = THEME.poster.tall;
    const [w1, w2] = THEME.poster.wide;
    const [s1, s2] = THEME.poster.stars;
    if (tall) {
      word(t1[0], W2 / 2, H2 * 0.13, 128, t1[1], W2 * 0.62);
      word(t2[0], W2 / 2, H2 * 0.29, 128, t2[1]);
      word(t3[0], W2 / 2, H2 * 0.46, 128, t3[1], W2 * 0.5);
      star(W2 * 0.2, H2 * 0.46, 42, s1); star(W2 * 0.8, H2 * 0.46, 42, s2);
      word(t4[0], W2 / 2, H2 * 0.62, 128, t4[1]);
      if (THEME.poster.emblem === "rainbow") rainbow(W2 / 2, H2 * 0.92, W2 * 0.3, 24);
      else emblem(W2 / 2, H2 * 0.86, W2 * 0.11);
    } else {
      if (THEME.poster.emblem === "rainbow") rainbow(W2 * 0.19, H2 * 0.74, H2 * 0.36, 17);
      else emblem(W2 * 0.19, H2 * 0.62, H2 * 0.2);
      word(w1[0], W2 * 0.655, H2 * 0.34, 104, w1[1], W2 * 0.6);
      word(w2[0], W2 * 0.655, H2 * 0.7, 104, w2[1], W2 * 0.6);
      star(W2 * 0.19, H2 * 0.24, 30, s1);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    const grp = new THREE.Group();
    const sheet = mesh(new THREE.PlaneGeometry(wd, ht), matte(0xffffff, { map: tex, clearcoat: 0, sheen: 0.05 }));
    sheet.position.z = 0.03;
    grp.add(sheet);
    /* Pinned up with two clay pins. */
    for (const side of [-1, 1]) {
      const pin = mesh(new THREE.SphereGeometry(0.09, 24, 16), clay(side < 0 ? THEME.poster.pins[0] : THEME.poster.pins[1], { clearcoat: 0.6 }));
      pin.position.set(side * (wd / 2 - 0.22), ht / 2 - 0.2, 0.1);
      grp.add(pin);
    }
    return at(grp, x, y, 0);
  };

  /* A window onto a sunny morning: a sky with clouds and a green hill in
     a white clay frame, a sill with a plant and the class's globe. */
  const windowAt = (x, y, wd, ht) => {
    const c = document.createElement("canvas");
    c.width = 512; c.height = Math.round(512 * (ht / wd));
    const g = c.getContext("2d");
    const sky = g.createLinearGradient(0, 0, 0, c.height);
    sky.addColorStop(0, "#7cc8f8"); sky.addColorStop(1, "#d9f0ff");
    g.fillStyle = sky; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#ffffff";
    for (const [cx, cy, r] of [[130, 150, 46], [180, 135, 58], [235, 155, 42], [360, 300, 36], [400, 285, 46], [440, 302, 32]]) { g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill(); }
    if (THEME.view === "sea") {
      /* Bloo's: a rainbow over the sea, a sandy shore. */
      g.lineCap = "butt";
      ["#ee4645", "#ff8c2e", "#ffd31a", "#4fbf5a", "#3f86e8", "#9257de"].forEach((col, i) => { g.beginPath(); g.arc(300, c.height * 0.78, 210 - i * 16, Math.PI, Math.PI * 2); g.lineWidth = 15; g.strokeStyle = col; g.stroke(); });
      g.fillStyle = "#4da3ec"; g.fillRect(0, c.height * 0.68, c.width, c.height * 0.32);
      g.fillStyle = "#8fd0ff";
      for (let y = c.height * 0.72; y < c.height; y += 26) for (let x = (y / 26) % 2 ? 0 : 30; x < c.width; x += 70) { g.fillRect(x, y, 34, 4); }
      g.fillStyle = "#f7dc9b";
      g.beginPath(); g.ellipse(120, c.height + 40, 260, 90, 0, 0, Math.PI * 2); g.fill();
    } else {
      g.fillStyle = "#8fd17a";
      g.beginPath(); g.ellipse(170, c.height + 60, 330, 190, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#6fbf62";
      g.beginPath(); g.ellipse(470, c.height + 90, 300, 190, 0, 0, Math.PI * 2); g.fill();
    }
    if (THEME.view === "garden") {
      /* Nova's: a vegetable patch below the hill — rows of soil, carrot
         tops and cabbages — under her sun. */
      g.fillStyle = "#ffd23a";
      g.beginPath(); g.arc(c.width - 90, 90, 46, 0, Math.PI * 2); g.fill();
      for (let r = 0; r < 3; r++) {
        const y = c.height * (0.72 + r * 0.1);
        g.fillStyle = "#b9814e"; g.fillRect(0, y, c.width, c.height * 0.055);
        for (let x = 30 + (r % 2) * 40; x < c.width; x += 80) {
          if ((x + r) % 3) {
            g.fillStyle = "#4fbf5a";
            for (const dx of [-8, 0, 8]) { g.beginPath(); g.ellipse(x + dx, y - 10, 5, 15, dx * 0.05, 0, Math.PI * 2); g.fill(); }
          } else {
            g.fillStyle = "#8fd17a"; g.beginPath(); g.arc(x, y - 4, 16, 0, Math.PI * 2); g.fill();
          }
        }
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const grp = new THREE.Group();
    const glass = mesh(new THREE.PlaneGeometry(wd, ht), new THREE.MeshBasicMaterial({ map: tex }));
    glass.position.z = 0.02;
    glass.castShadow = false;
    grp.add(glass);
    const white = matte(0xfffaf3, { clearcoat: 0.3 });
    const bar = (bw, bh, bx, by) => { const b = box(bw, bh, 0.18, white, 0.05); b.position.set(bx, by, 0.1); grp.add(b); };
    bar(wd + 0.3, 0.18, 0, ht / 2); bar(wd + 0.3, 0.18, 0, -ht / 2);
    bar(0.18, ht + 0.3, -wd / 2, 0); bar(0.18, ht + 0.3, wd / 2, 0);
    bar(0.1, ht, 0, 0); bar(wd, 0.1, 0, ht * 0.1);
    const sill = box(wd + 0.7, 0.16, 0.5, white, 0.05);
    sill.position.set(0, -ht / 2 - 0.16, 0.25);
    grp.add(sill);
    /* A plant in a yellow pot on the sill. */
    const plant = new THREE.Group();
    plant.add(mesh(new THREE.CylinderGeometry(0.26, 0.19, 0.42, 32), clay(0xffc93a)));
    for (const [px, py, r] of [[0, 0.5, 0.28], [-0.22, 0.38, 0.2], [0.22, 0.4, 0.21], [0.05, 0.72, 0.17]]) { const leaf = mesh(new THREE.SphereGeometry(r, 24, 16), matte(0x7cc66a)); leaf.position.set(px, py, 0); plant.add(leaf); }
    plant.position.set(-wd * 0.22, -ht / 2 - 0.08 + 0.21, 0.3);
    grp.add(plant);
    /* Nova's sill: a pumpkin from her seasons. Bloo's: a fishbowl. */
    if (THEME.sill === "pumpkin") {
      const pumpkin = new THREE.Group();
      for (let k = 0; k < 6; k++) {
        const lobe = mesh(new THREE.SphereGeometry(0.2, 32, 24), clay(0xff8a3d, { clearcoat: 0.35 }));
        lobe.scale.set(0.62, 0.82, 1);
        lobe.position.set(Math.cos((k / 6) * Math.PI * 2) * 0.12, 0.16, Math.sin((k / 6) * Math.PI * 2) * 0.12);
        pumpkin.add(lobe);
      }
      const stalk = mesh(new THREE.CylinderGeometry(0.03, 0.045, 0.14, 12), matte(0x5c8f3a));
      stalk.position.y = 0.36;
      pumpkin.add(stalk);
      pumpkin.position.set(wd * 0.25, -ht / 2 - 0.08, 0.3);
      grp.add(pumpkin);
      return at(grp, x, y, 0);
    }
    if (THEME.sill === "fishbowl") {
      const bowl = new THREE.Group();
      const glassBall = mesh(new THREE.SphereGeometry(0.36, 48, 32), new THREE.MeshPhysicalMaterial({ color: 0xdff3ff, transparent: true, opacity: 0.35, roughness: 0.05, clearcoat: 1 }));
      glassBall.position.y = 0.36;
      bowl.add(glassBall);
      const water = mesh(new THREE.SphereGeometry(0.32, 48, 32, 0, Math.PI * 2, Math.PI * 0.38, Math.PI * 0.62), clay(0x7fc3f5, { transparent: true, opacity: 0.75 }));
      water.position.y = 0.36;
      bowl.add(water);
      const fishBody = mesh(new THREE.SphereGeometry(0.09, 24, 16), clay(0xff8a3d, { clearcoat: 0.5 }));
      fishBody.scale.set(1.4, 0.9, 0.8);
      fishBody.position.set(-0.04, 0.32, 0.12);
      bowl.add(fishBody);
      const tail = mesh(new THREE.ConeGeometry(0.06, 0.12, 12), clay(0xff8a3d, { clearcoat: 0.5 }));
      tail.rotation.z = Math.PI / 2;
      tail.position.set(0.12, 0.32, 0.12);
      bowl.add(tail);
      bowl.position.set(wd * 0.25, -ht / 2 - 0.08, 0.3);
      grp.add(bowl);
      return at(grp, x, y, 0);
    }
    /* The class's globe: blue sea, green land, on a wooden stand. */
    const map = document.createElement("canvas");
    map.width = 256; map.height = 128;
    const mg = map.getContext("2d");
    mg.fillStyle = "#4da3ec"; mg.fillRect(0, 0, 256, 128);
    mg.fillStyle = "#7cc66a";
    for (const [cx, cy, rx, ry] of [[50, 45, 26, 20], [70, 85, 14, 24], [140, 40, 34, 18], [150, 80, 16, 22], [210, 90, 18, 12], [200, 40, 22, 14]]) { mg.beginPath(); mg.ellipse(cx, cy, rx, ry, 0.3, 0, Math.PI * 2); mg.fill(); }
    const mapTex = new THREE.CanvasTexture(map);
    mapTex.colorSpace = THREE.SRGBColorSpace;
    const globe = new THREE.Group();
    const ball = mesh(new THREE.SphereGeometry(0.34, 48, 32), clay(0xffffff, { map: mapTex, clearcoat: 0.5 }));
    ball.position.y = 0.52;
    ball.rotation.set(0.4, -0.6, 0.35);
    globe.add(ball);
    const stem = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 12), matte(0xc98f55));
    stem.position.y = 0.12;
    globe.add(stem);
    globe.add(mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.06, 32), matte(0xc98f55)));
    globe.position.set(wd * 0.25, -ht / 2 - 0.08, 0.3);
    grp.add(globe);
    return at(grp, x, y, 0);
  };

  if (portrait) {
    // bunting above the board; the poster under its left, beside Pinki;
    // a drawing at each side above the board (seen on a phone)
    bunting(-5, 5, 10.25);
    poster(-1.95, 2.95, 3.4, 1.45, false);
    pinUp(THEME.drawings.phoneTop[0], -3.5, 11.35, 0.55, 0.06);
    pinUp(THEME.drawings.phoneTop[1], 3.5, 11.35, 0.55, -0.05);
    pinUp(THEME.drawings.phoneLow, 3.9, 2.4, 0.7, -0.05);
  } else {
    // the window at the left edge; the poster at the right, over Pinki's
    // head; drawings round it; bunting along the top, under the header
    bunting(-9, 9, 7.75);
    windowAt(-6.85, 4.6, 2.2, 2.6);
    poster(4.75, 5.55, 2.0, 2.5, true);
    [[THEME.drawings.wide[0], 6.95, 6.05, 0.62, 0.04], [THEME.drawings.wide[1], 6.95, 4.35, 0.62, -0.05]].forEach(([n, x, y, k, t]) => pinUp(n, x, y, k, t));
  }

  /* The class in front of the camera (2026-10-14, from the user's
     picture): chair backs in clay with a star cut in, the corner of a desk
     with a pencil cup and books — `crop.py classroom` blurs them, the
     camera's focus on the board. Kept low, where the page has no board. */
  const desk = new THREE.Group();
  const starShape = (r, inner = 0.45) => {
    const st = new THREE.Shape();
    for (let k = 0; k < 10; k++) {
      const a = Math.PI / 2 + (k * Math.PI) / 5, rr = k % 2 ? r * inner : r;
      k ? st.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : st.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    st.closePath();
    return st;
  };
  /* A chair's back: a soft rounded slab on two posts, a star pressed in. */
  const chairAt = (color, starColor, x, y, z, wd = 1.5, ht = 0.95, turn = 0) => {
    const g = new THREE.Group();
    const r = 0.32;
    const sh = new THREE.Shape();
    sh.moveTo(-wd / 2, -ht / 2);
    sh.lineTo(wd / 2, -ht / 2);
    sh.lineTo(wd / 2, ht / 2 - r);
    sh.quadraticCurveTo(wd / 2, ht / 2, wd / 2 - r, ht / 2);
    sh.lineTo(-wd / 2 + r, ht / 2);
    sh.quadraticCurveTo(-wd / 2, ht / 2, -wd / 2, ht / 2 - r);
    sh.closePath();
    const back = mesh(roundedShapeExtrude(sh, 0.12, 0.06), clay(color, { clearcoat: 0.25, roughness: 0.55, sheen: 0.4 }));
    g.add(back);
    /* High on the back: the camera sees only the chair's top. */
    const st = mesh(roundedShapeExtrude(starShape(ht * 0.21), 0.04, 0.03), clay(starColor, { clearcoat: 0.3 }));
    st.position.set(0, ht * 0.16, 0.17);
    g.add(st);
    for (const side of [-1, 1]) {
      const post = mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.4, 16), clay(color, { clearcoat: 0.25 }));
      post.position.set(side * wd * 0.36, -ht / 2 - 1.2, 0.05);
      g.add(post);
    }
    g.position.set(x, y, z);
    g.rotation.y = turn;
    desk.add(g);
    return g;
  };
  /* A desk's corner: a light wood top, its thickness showing. */
  const deskAt = (x, y, z, wd, dp) => {
    const top = box(wd, 0.16, dp, matte(0xe9bd85, { roughness: 0.6 }), 0.06);
    top.position.set(x, y, z);
    desk.add(top);
  };
  /* A pencil cup (blue, a yellow star on it) full of pencils. */
  const pencilCup = (x, y, z, k = 1) => {
    const g = new THREE.Group();
    const cup = mesh(new THREE.CylinderGeometry(0.3, 0.27, 0.62, 48), clay(0x6aa6f0, { clearcoat: 0.35 }));
    cup.position.y = 0.31;
    g.add(cup);
    const st = mesh(roundedShapeExtrude(starShape(0.13), 0.02, 0.015), clay(0xffd23a, { clearcoat: 0.4 }));
    st.position.set(0, 0.31, 0.29);
    g.add(st);
    [[0xffc93a, -0.12, 0.18], [0xf776ac, 0.02, -0.05], [0x9257de, 0.13, -0.2], [0x5cc56b, -0.02, 0.08]].forEach(([c, px, tilt], i) => {
      const pencil = new THREE.Group();
      const body = mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 6), clay(c, { clearcoat: 0.3 }));
      pencil.add(body);
      const wood = mesh(new THREE.ConeGeometry(0.05, 0.14, 6), matte(0xf3d3a6));
      wood.position.y = 0.52;
      pencil.add(wood);
      pencil.position.set(px, 0.62 + 0.2 + i * 0.03, (i % 2 ? -0.06 : 0.05));
      pencil.rotation.z = tilt;
      g.add(pencil);
    });
    g.position.set(x, y, z);
    g.scale.setScalar(k);
    desk.add(g);
  };
  /* Two books lying on the desk, the top one purple. */
  const books = (x, y, z, turn) => {
    const g = new THREE.Group();
    [[0xff86c2, 0.0, 0], [0x9257de, 0.15, 0.12]].forEach(([c, h, t]) => {
      const cover = box(1.0, 0.13, 0.72, clay(c, { clearcoat: 0.3 }), 0.04);
      cover.position.set(0, h + 0.065, 0);
      cover.rotation.y = t;
      g.add(cover);
      const pages = box(0.94, 0.09, 0.66, matte(0xfffaf0), 0.02);
      pages.position.set(0.03, h + 0.065, 0);
      pages.rotation.y = t;
      g.add(pages);
    });
    g.position.set(x, y, z);
    g.rotation.y = turn;
    desk.add(g);
  };
  if (portrait) {
    // a phone: over its bottom bar, under Pinki's feet — the blue chair at
    // the left, the pink one under Pinki, a desk's corner at the right (no
    // cup: it would stand in front of her)
    chairAt(...THEME.chairs[0], -1.15, 3.35, 9.0, 1.3, 0.85, 0.12);
    deskAt(1.3, 3.1, 8.6, 1.9, 1.4);
    chairAt(...THEME.chairs[1], 0.25, 3.15, 9.6, 1.2, 0.8, -0.05);
  } else {
    // the blue chair at the bottom left, the pink one under the board's
    // right, a desk at the right with the cup and the books
    chairAt(...THEME.chairs[0], -2.15, 2.3, 9.0, 1.45, 0.95, 0.18);
    deskAt(-2.6, 2.2, 8.2, 2.0, 1.4);
    chairAt(...THEME.chairs[1], 0.3, 2.33, 9.1, 1.35, 0.9, -0.08);
    deskAt(2.2, 2.35, 8.4, 2.6, 1.5);
    books(1.55, 2.43, 8.35, 0.2);
    pencilCup(2.55, 2.43, 8.3, 0.68);
  }
  scene.add(desk);

  const shot = () => { renderer.render(scene, view); return renderer.domElement.toDataURL("image/png"); };
  window.renderLayers = () => {
    desk.visible = false;
    const back = shot();
    scene.children.forEach((o) => { if (o !== desk && !o.isLight) o.visible = false; });
    desk.visible = true;
    const front = shot();
    return { back, front };
  };
  window.itemsMeta = () => ({});
} else if (BACKDROP) {
  /* ---------- A course's backdrop (2026-10-13): its world behind every
     step, rendered sharp here and blurred by `crop.py backdrop`. Shapes:
     Pinki's picnic meadow, one per lesson — the same sky, grass and hills,
     and everything in it the lesson's shape (the user: "in the circle
     lesson, circles in the background"): the blanket, what is on it, the
     trees, what is in the sky and at the near right. The middle stays
     quiet grass and sky for the step. The other courses' worlds follow
     the same plan below (`WORLDS`), each lesson's things its own.
     `?backdrop=<circle|square|triangle|rectangle|review>` (Shapes) or
     `<colors|veg|seasons|animals|weather>-<lesson>`, `&frame=portrait|landscape`. ---------- */
  const portrait = params.get("frame") === "portrait";
  const [w, h] = portrait ? [900, 1600] : [1600, 900];
  renderer.setSize(w, h);
  scene.background = new THREE.Color(0xcfe6fb);
  const view = new THREE.PerspectiveCamera(portrait ? 62 : 38, w / h, 0.1, 200);
  view.position.set(0, portrait ? 2.4 : 2.0, 10);
  view.lookAt(0, portrait ? 1.0 : 1.5, 0);
  catcher.visible = false;
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
  const leafy = (color = 0x7cc66a) => clay(color, { clearcoat: 0.15, roughness: 0.75 });
  const put = (thing, x, y, z, k = 1) => {
    thing.scale.setScalar(k);
    thing.position.set(x, y, z);
    scene.add(thing);
    return thing;
  };
  const trunk = (height) => {
    const t = mesh(new THREE.CylinderGeometry(0.22, 0.3, height, 24), clay(0xb98a5e, { clearcoat: 0.1, roughness: 0.8 }));
    t.position.y = height / 2;
    return t;
  };

  /* The trees, one kind per shape. */
  const TREES = {
    circle() {
      const g = new THREE.Group();
      g.add(trunk(2.2));
      for (const [cx, cy, cr] of [[0, 2.9, 1.25], [-0.8, 2.4, 0.85], [0.85, 2.45, 0.9], [0.1, 3.6, 0.8]]) {
        const puff = mesh(new THREE.SphereGeometry(cr, 48, 32), leafy());
        puff.position.set(cx, cy, 0);
        g.add(puff);
      }
      return g;
    },
    // a box hedge on a short trunk
    square() {
      const g = new THREE.Group();
      g.add(trunk(1.2));
      const box = mesh(new RoundedBoxGeometry(2.6, 2.6, 2.6, 6, 0.3), leafy(0x78c468));
      box.position.y = 2.4;
      g.add(box);
      return g;
    },
    // a pine: three cones
    triangle() {
      const g = new THREE.Group();
      g.add(trunk(1.0));
      for (const [y, r, hh] of [[1.6, 1.6, 2.0], [2.7, 1.25, 1.8], [3.7, 0.9, 1.6]]) {
        const cone = mesh(new THREE.ConeGeometry(r, hh, 48), leafy(0x5fb26a));
        cone.position.y = y;
        g.add(cone);
      }
      return g;
    },
    // a tall clipped hedge
    rectangle() {
      const g = new THREE.Group();
      g.add(trunk(1.0));
      const box = mesh(new RoundedBoxGeometry(1.7, 3.6, 1.7, 6, 0.25), leafy(0x78c468));
      box.position.y = 2.7;
      g.add(box);
      return g;
    },
  };

  /* The blankets, one per shape (the review's is the rectangle's). */
  const blanketCloth = (color) => clay(color, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 });
  const cream = clay(0xffe3ee, { clearcoat: 0.05, roughness: 0.9, sheen: 0.2 });
  const BLANKET = {
    circle() {
      const g = new THREE.Group();
      g.add(mesh(new THREE.CylinderGeometry(2.75, 2.75, BH, 160), blanketCloth(0xf58fb8)));
      for (const r of [2.4, 1.5]) {
        const ring = mesh(new THREE.TorusGeometry(r, 0.12, 12, 160), cream);
        ring.rotation.x = Math.PI / 2;
        ring.scale.z = 0.25;
        ring.position.y = BH / 2;
        g.add(ring);
      }
      g.position.y = BH / 2;
      return g;
    },
    // pink with cream squares
    square() {
      const g = new THREE.Group();
      const S = 4.8;
      g.add(mesh(new RoundedBoxGeometry(S, BH, S, 6, 0.06), blanketCloth(0xf58fb8)));
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
        if ((i + j) % 2) continue;
        const tile = mesh(new RoundedBoxGeometry(0.86, 0.02, 0.86, 2, 0.01), cream);
        tile.position.set(i * 0.94, BH / 2, j * 0.94);
        g.add(tile);
      }
      g.position.y = BH / 2;
      return g;
    },
    // a triangle, a cream triangle inside it
    triangle() {
      const tri = (r) => {
        const s = new THREE.Shape();
        for (let k = 0; k < 3; k++) {
          const a = Math.PI / 2 + (k * 2 * Math.PI) / 3;
          k ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        s.closePath();
        return s;
      };
      const g = new THREE.Group();
      g.add(flat(tri(3.4), BH, 0.04, blanketCloth(0xf58fb8)));
      const inner = flat(tri(1.7), 0.02, 0.01, cream);
      inner.position.y = BH + 0.02;
      g.add(inner);
      return g;
    },
    rectangle: () => BLANKETS.pinkStripes(),
  };
  BLANKET.review = BLANKET.rectangle;

  /* What lies on the blanket ([thing, x, z, scale, turn] in its own
     coordinates), what stands at the near right, and the sky's own. */
  const LESSONS = {
    circle: {
      picnic: [["plate", -0.9, -0.7, 1, 0], ["donut", 0.9, -0.6, 1, 0.4], ["cookie", -0.5, 1.0, 1, 0], ["orange", 0.9, 0.9, 0.9, 0]],
      near: () => ITEMS.ball(),
      trees: ["circle", "circle", "circle", "circle"],
      sky() {
        // the sun, a round one, and three round balloons
        const disc = mesh(new THREE.SphereGeometry(2.4, 64, 48), clay(0xffd45e, { emissive: 0xffc93a, emissiveIntensity: 0.5 }));
        disc.scale.z = 0.4;
        disc.castShadow = false;
        put(disc, portrait ? -3.2 : -3.5, portrait ? 9.4 : 5.2, -22);
        for (const [color, x, y] of portrait ? [["pink", 1.2, 4.6], ["blue", 1.9, 5.1], ["yellow", 1.6, 4.1]] : [["pink", 3.4, 2.4], ["blue", 4.2, 2.9], ["yellow", 3.8, 1.9]]) put(ITEMS.balloon(color), x, y, -3, 0.9);
      },
    },
    square: {
      picnic: [["toast", -0.9, -0.8, 1, 0.2], ["gift", 1.0, -0.7, 0.95, -0.3], ["cracker", -0.8, 1.0, 1, -0.3], ["dice", 1.0, 1.0, 1, 0.4]],
      near: () => ITEMS.gift(0x8cc4f2),
      trees: ["square", "square", "square", "square"],
      sky() {},
    },
    triangle: {
      picnic: [["pizza", 0, -0.9, 0.95, 3.3], ["cheese", -0.8, 0.8, 0.85, 0.2], ["sandwich", 0.8, 0.8, 0.9, -0.5]],
      near() {
        // a pennant stuck in the grass
        const flag = ITEMS.flag();
        flag.rotation.set(Math.PI / 2, 0, Math.PI / 2);
        const g = new THREE.Group();
        flag.position.y = 1.3;
        g.add(flag);
        return g;
      },
      trees: ["triangle", "triangle", "triangle", "triangle"],
      sky() {
        // bunting across the sky: a string with pennants hanging from it
        const span = portrait ? 4.2 : 9;
        const y0 = portrait ? 6.6 : 4.6;
        const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-span, y0 + 0.6, -4), new THREE.Vector3(0, y0 - 0.4, -4), new THREE.Vector3(span, y0 + 0.6, -4)]);
        scene.add(mesh(new THREE.TubeGeometry(curve, 64, 0.03, 8), clay(0xffffff)));
        const colors = [0xf58fb8, 0xffd45e, 0x8cc4f2];
        for (let k = 0; k <= 10; k++) {
          const p = curve.getPoint(k / 10);
          const s = new THREE.Shape(); s.moveTo(-0.32, 0); s.lineTo(0.32, 0); s.lineTo(0, -0.7); s.closePath();
          const pennant = mesh(roundedShapeExtrude(s, 0.04, 0.02), clay(colors[k % 3], { clearcoat: 0.4 }));
          pennant.position.copy(p);
          scene.add(pennant);
        }
        // a tent far off on the right
        const side = new THREE.Shape(); side.moveTo(-1.6, 0); side.lineTo(1.6, 0); side.lineTo(0, 2.4); side.closePath();
        const tent = mesh(roundedShapeExtrude(side, 3.2, 0.08), clay(0xf9c06b, { clearcoat: 0.2, roughness: 0.7 }));
        tent.rotation.y = -0.6;
        put(tent, portrait ? 4.5 : 8.5, 0, -11);
      },
    },
    rectangle: {
      picnic: [["book", -1.2, -0.8, 1, -0.3], ["chocolate", 1.2, -0.7, 0.95, 0.35], ["juice", 1.2, 1.0, 0.95, -0.2], ["ruler", -1.2, 1.1, 0.9, 1.45]],
      near: () => ITEMS.juice(),
      trees: ["rectangle", "rectangle", "rectangle", "rectangle"],
      sky() {
        // a fence of boards across the field
        const wood = clay(0xfff3e2, { clearcoat: 0.1, roughness: 0.8 });
        for (let x = -16; x <= 16; x += 0.9) {
          const board = mesh(new RoundedBoxGeometry(0.6, 1.5, 0.12, 3, 0.04), wood);
          put(board, x, 0.75, -9);
        }
        for (const y of [0.45, 1.1]) {
          const rail = mesh(new RoundedBoxGeometry(33, 0.18, 0.1, 2, 0.04), wood);
          put(rail, 0, y, -9.12);
        }
      },
    },
    review: {
      picnic: [["plate", -1.2, -0.8, 1, 0], ["toast", 1.2, -0.7, 1, 0.2], ["cheese", 1.1, 1.0, 0.85, 0.2], ["book", -1.2, 1.0, 0.9, -0.3]],
      near: () => ITEMS.ball(),
      trees: ["triangle", "circle", "square", "rectangle"],
      sky() {},
    },
  };
  /* Where things stand in each frame: the near left and near right (in
     every frame at its own edges), four spots far off at the sides, and
     the sky's left and right. */
  const NL = portrait ? [-1.9, 5.6] : [-3.6, 3.0];
  const NR = portrait ? [1.5, 6.2] : [3.6, 3.6];
  const FAR = [[-9, -12, 1.4], [-13, -18, 1.2], [10, -14, 1.5], [15, -22, 1.2]];
  const SKY_L = portrait ? [-1.8, 5.4, -3] : [-3.4, 3.2, -3];
  const SKY_R = portrait ? [1.6, 5.0, -3] : [3.8, 2.8, -3];
  /* Stand a thing on `y` (its lowest point there), wherever it is built. */
  const stand = (thing, x, y, z, k = 1, turnY = 0) => {
    thing.scale.multiplyScalar(k);
    thing.rotation.y += turnY;
    thing.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(thing);
    thing.position.set(x, y - box.min.y, z);
    return thing;
  };
  const many = (make, spots) => spots.map((spot) => put(make(), ...spot));

  /* The meadow every world shares: sky, grass, hills on the horizon,
     clouds and a few flowers. */
  function meadow({ sky = 0xcfe6fb, grass = 0x9ad67c, hills = [0xb4e39b, 0xa9dd8f, 0xbde6a6, 0xa9dd8f], cloud = 0xffffff, flowers = [0xff9ec8, 0xffffff, 0xffd45e] } = {}) {
    scene.background = new THREE.Color(sky);
    const ground = mesh(new THREE.PlaneGeometry(200, 200), turf(grass));
    ground.rotation.x = -Math.PI / 2;
    ground.castShadow = false;
    scene.add(ground);
    [[-14, -40, 16, 0.32], [10, -46, 20, 0.28], [32, -38, 14, 0.36], [-34, -44, 18, 0.3]].forEach(([x, z, r, sy], i) => {
      const hill = mesh(new THREE.SphereGeometry(r, 64, 32), turf(hills[i % hills.length]));
      hill.scale.y = sy;
      hill.position.set(x, 0, z);
      scene.add(hill);
    });
    if (cloud !== null) {
      for (const [x, y, z, k] of portrait ? [[-7, 7.5, -20, 3.2], [8, 9, -26, 3.8], [1, 11, -30, 2.6]] : [[-6, 5.4, -20, 3.2], [9, 6.2, -26, 3.8], [1.5, 7.4, -30, 2.6]]) {
        const c = ITEMS.cloud();
        // lit from inside a little: a cloud's underside read as storm grey
        c.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.material.color.set(cloud); o.material.emissive.set(cloud); o.material.emissiveIntensity = 0.45; } });
        put(c, x, y, z, k);
      }
    }
    if (flowers) [[3.5, 1], [-1.5, -2], [6.5, -1], [-6.5, -3], [1.2, 3.5], [-3.8, 7.2], [4.2, 6.8]].forEach(([x, z], i) => put(hillFlower(flowers[i % flowers.length]), x, 0, z, 1.6));
  }

  /* A round tree, its crown in `colors`, `dots` scattered over its front
     (blossoms, apples) and an optional `lean` (the wind). */
  function roundTree(colors = [0x7cc66a], { dots = null, lean = 0, snow = false } = {}) {
    const g = new THREE.Group();
    g.add(trunk(2.2));
    [[0, 2.9, 1.25], [-0.8, 2.4, 0.85], [0.85, 2.45, 0.9], [0.1, 3.6, 0.8]].forEach(([cx, cy, cr], i) => {
      const puff = mesh(new THREE.SphereGeometry(cr, 48, 32), leafy(colors[i % colors.length]));
      puff.position.set(cx, cy, 0);
      g.add(puff);
      if (snow) {
        const cap = mesh(new THREE.SphereGeometry(cr * 0.82, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2.6), clay(0xffffff, { roughness: 0.7 }));
        cap.position.set(cx, cy + cr * 0.32, 0);
        g.add(cap);
      }
    });
    if (dots) for (const [dx, dy] of [[-0.5, 3.1], [0.4, 3.4], [0.9, 2.5], [-0.9, 2.3], [0.1, 2.6], [-0.2, 3.9], [0.6, 3.0]]) {
      const dot = mesh(new THREE.SphereGeometry(0.17, 24, 16), clay(dots, { clearcoat: 0.5 }));
      dot.position.set(dx, dy, 1.0);
      g.add(dot);
    }
    g.rotation.z = lean;
    return g;
  }
  /* A bare winter tree: a trunk, four branches, snow along them. */
  function bareTree() {
    const g = new THREE.Group();
    const bark = clay(0xa47a58, { roughness: 0.8, clearcoat: 0.1 });
    g.add(taperTube([[0, 0, 0], [0.05, 1.6, 0], [0, 3.0, 0]], 0.3, 0.18, bark));
    for (const [x, y] of [[-1.2, 3.6], [1.1, 3.4], [-0.5, 4.2], [0.6, 4.3]]) {
      g.add(taperTube([[0, 2.2, 0], [x * 0.5, (2.2 + y) / 2, 0], [x, y, 0]], 0.14, 0.06, bark));
      const snow = mesh(new THREE.SphereGeometry(0.22, 24, 16), clay(0xffffff, { roughness: 0.7 }));
      snow.scale.set(1.4, 0.6, 1);
      snow.position.set(x, y + 0.12, 0);
      g.add(snow);
    }
    return g;
  }
  /* A palm: a curved trunk of rings and a crown of long leaves. */
  function palmTree() {
    const g = new THREE.Group();
    for (let i = 0; i < 9; i++) {
      const ring = mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.42, 24), clay(0xc9a27a, { roughness: 0.8 }));
      ring.position.set(Math.sin(i * 0.16) * 0.9, 0.21 + i * 0.4, 0);
      g.add(ring);
    }
    for (let k = 0; k < 7; k++) {
      const a = (k / 7) * Math.PI * 2;
      const leaf = mesh(new THREE.SphereGeometry(0.5, 32, 16), leafy(0x5fbf6a));
      leaf.scale.set(3.2, 0.25, 0.9);
      leaf.position.set(0.9 + Math.cos(a) * 1.3, 3.8 - 0.35, Math.sin(a) * 1.3);
      leaf.rotation.set(0, -a, -0.35);
      g.add(leaf);
    }
    return g;
  }
  /* An acacia: a thin trunk and a wide flat crown (the elephant's). */
  function flatTree() {
    const g = new THREE.Group();
    g.add(taperTube([[0, 0, 0], [0.2, 1.6, 0], [0, 3.0, 0]], 0.26, 0.16, clay(0xb98a5e, { roughness: 0.8 })));
    const top = mesh(new THREE.SphereGeometry(1.6, 48, 24), leafy(0x8ccf6e));
    top.scale.set(1.9, 0.38, 1.3);
    top.position.y = 3.3;
    g.add(top);
    return g;
  }
  const trees = (makers) => FAR.forEach(([x, z, k], i) => put(makers[i % makers.length](), x, 0, z, k));

  /* A blanket of one color, a paler border inside it. */
  function plainBlanket(color, border = 0xffffff) {
    const g = new THREE.Group();
    g.add(mesh(new RoundedBoxGeometry(5.7, BH, 4.8, 6, 0.06), blanketCloth(color)));
    const inner = mesh(new RoundedBoxGeometry(5.1, 0.02, 4.2, 4, 0.01), clay(border, { clearcoat: 0.05, roughness: 0.9, transparent: true, opacity: 0.35 }));
    inner.position.y = BH / 2 + 0.01;
    g.add(inner);
    g.position.y = BH / 2;
    return g;
  }
  /* A picnic at the near left: a blanket and things stood on it
     ([thing, x, z, scale, turn] in the blanket's own coordinates). */
  function picnicAt(blanket, things, k = 0.85) {
    const g = new THREE.Group();
    g.add(blanket);
    for (const [thing, x, z, s = 1, turn = 0] of things) g.add(stand(thing, x, ON_BLANKET, z, s, turn));
    g.rotation.y = 0.45;
    return put(g, NL[0], 0, NL[1], k);
  }

  /* ---------- Colors: Pinki's meadow with a painter's easel; in each
     lesson the blanket, what is on it, the pots, the balloons and the
     flowers are the lesson's color (the review: all ten, a rainbow). */
  const COLOR_THINGS = {
    red: ["apple", "strawberry", "cherries", "ladybug"], blue: ["fish", "whale", "mug", "ball"], yellow: ["banana", "lemon", "star", "duck"],
    green: ["pear", "frog", "leaf", "broccoli"], orange: ["orange", "carrot", "basketball"], purple: ["grapes", "eggplant", "book", "gift"],
    pink: ["donut", "icecream", "cupcake", "pig"], brown: ["cookie", "chocolate", "teddy", "acorn"], black: ["hat", "tire", "bowling", "ant"],
    white: ["egg", "sheep", "milk", "snowman"],
  };
  const colorThing = (name, color) => (name === "fish" || name === "ball" ? ITEMS[name](PAINT.blue) : name === "book" || name === "gift" ? ITEMS[name](PAINT.purple) : ITEMS[name]());
  /* An easel with a canvas, painted `color` (the review: a rainbow of
     stripes). */
  function easel(colors) {
    const g = new THREE.Group();
    const wood = clay(0xc98f55, { roughness: 0.7, clearcoat: 0.2 });
    for (const [x, z, tz] of [[-0.55, 0.15, 0.12], [0.55, 0.15, -0.12], [0, -0.45, 0]]) {
      const leg = mesh(new THREE.CapsuleGeometry(0.06, 2.6, 8, 16), wood);
      leg.position.set(x * 0.85, 1.3, z);
      leg.rotation.set(z < 0 ? -0.22 : 0.08, 0, tz);
      g.add(leg);
    }
    const canvas = mesh(new RoundedBoxGeometry(1.5, 1.2, 0.08, 4, 0.03), clay(0xfffaf2, { roughness: 0.8 }));
    canvas.position.set(0, 1.9, 0.22);
    g.add(canvas);
    colors.forEach((color, i) => {
      const paint = mesh(new RoundedBoxGeometry(1.3, 1.0 / colors.length, 0.02, 2, 0.01), clay(color, { clearcoat: 0.5 }));
      paint.position.set(0, 1.9 + 0.5 - (i + 0.5) / colors.length, 0.27);
      g.add(paint);
    });
    return g;
  }
  function rainbow() {
    const g = new THREE.Group();
    ["red", "orange", "yellow", "green", "blue", "purple"].forEach((c, i) => {
      const band = mesh(new THREE.TorusGeometry(7 - i * 0.42, 0.22, 16, 96, Math.PI), clay(PAINT[c], { emissive: PAINT[c], emissiveIntensity: 0.25 }));
      band.scale.z = 0.4;
      band.castShadow = false;
      g.add(band);
    });
    return g;
  }
  function colorsWorld(color) {
    const all = color === "review";
    const tone = all ? null : PAINT[color];
    meadow({ flowers: all ? [PAINT.red, PAINT.yellow, PAINT.blue, PAINT.pink] : [tone] });
    trees([() => roundTree()]);
    const things = all
      ? [["red", -1.6, -1.2], ["blue", -0.5, -1.3], ["yellow", 0.6, -1.2], ["green", 1.7, -1.2], ["orange", -1.6, 0], ["purple", 1.7, 0], ["pink", -1.6, 1.2], ["brown", -0.5, 1.3], ["black", 0.6, 1.3], ["white", 1.7, 1.2]].map(([c, x, z]) => [ITEMS.pot(c), x, z, 0.75])
      : [[ITEMS.pot(color), 0, 0, 0.9], ...COLOR_THINGS[color].map((name, i) => [colorThing(name, color), [-1.5, 1.5, -1.4, 1.4][i], [-1.1, -1.0, 1.1, 1.2][i], 0.9])];
    picnicAt(all ? plainBlanket(0xfff3dc, 0xcfe6fb) : plainBlanket(tone, color === "white" ? 0xcfe6fb : 0xffffff), things);
    put(easel(all ? ["red", "orange", "yellow", "green", "blue", "purple"].map((c) => PAINT[c]) : [tone]), NR[0], 0, NR[1], 0.95).rotation.y = -0.35;
    if (all) put(rainbow(), 0, portrait ? 5.5 : 1.0, -24, portrait ? 1.3 : 1.6);
    else many(() => ITEMS.balloon(color), [[SKY_R[0], SKY_R[1], SKY_R[2], 0.9], [SKY_R[0] + 0.8, SKY_R[1] + 0.6, SKY_R[2], 0.9], [SKY_R[0] + 0.4, SKY_R[1] - 0.5, SKY_R[2], 0.9]]);
  }

  /* ---------- Vegetables: Nova's garden — a picket fence across the
     field, a soil bed at the near left growing the lesson's vegetable,
     Nova's basket full of it at the near right (the review: all five). */
  function soilBed(plants) {
    const g = new THREE.Group();
    const earth = clay(0x8a5a3a, { roughness: 0.95, clearcoat: 0.05, sheen: 0 });
    const bed = mesh(new RoundedBoxGeometry(5.2, 0.34, 2.8, 6, 0.15), earth);
    bed.position.y = 0.17;
    g.add(bed);
    for (let i = 0; i < 40; i++) {
      const clump = mesh(new THREE.SphereGeometry(0.1 + rand() * 0.08, 16, 10), earth);
      clump.scale.y = 0.5;
      clump.position.set((rand() - 0.5) * 4.8, 0.34, (rand() - 0.5) * 2.4);
      g.add(clump);
    }
    // `sink`: how deep it grows in the soil (a carrot shows its top and leaves)
    for (const [make, x, z, k, sink = 0] of plants) g.add(stand(make(), x, 0.3 - sink * k, z, k));
    return g;
  }
  const VEG = {

  /* ---------- Seasons: the meadow in the lesson's season — its grass, its
     trees, what lies about and what is in the sky (the review: one tree
     of each season). */
  const SEASON_TREES = {
    spring: () => roundTree([0xa9e38a, 0x9adb7c], { dots: 0xffa6cf }),
    summer: () => roundTree([0x5cbd57, 0x52b450], { dots: 0xee4645 }),
    fall: () => roundTree([0xff9a3c, 0xf2683a, 0xffc24a]),
    winter: () => bareTree(),
  };
  function seasonsWorld(season) {
    const SKIES = { spring: 0xd6ecfb, summer: 0xbfe1fb, fall: 0xe6e6ee, winter: 0xe4edf6, review: 0xcfe6fb };
    const GRASS = { spring: 0xa3e07e, summer: 0x74cd5c, fall: 0xc2d36a, winter: 0xfbfdff, review: 0x9ad67c };
    const winter = season === "winter";

    if (season === "spring") {
      [[0, 0, 0xff6f7d], [0.7, 0.3, 0xffd23a], [-0.6, 0.4, 0xff8cc6], [0.2, 0.9, 0xff8cc6], [-0.3, -0.5, 0xffd23a], [0.9, -0.4, 0xff6f7d]].forEach(([dx, dz, c]) => put(tulip(c), lx + dx, 0, lz + dz, 1.4));
      sky(butterfly, [[0, 0, 1.2, 0.2], [-1.0, 0.8, 1.0, -0.3]]);
      [[0, 0, 0xff8cc6], [0.6, 0.4, 0xffffff], [-0.5, 0.5, 0xff6f7d]].forEach(([dx, dz, c]) => put(tulip(c), rx + dx, 0, rz + dz, 1.3));
    } else if (season === "summer") {
      picnicAt(plainBlanket(0xffd45e), [[ITEMS.icecream(), -1.0, -0.5, 1.1], [ITEMS.icecream(), 0.2, 0.6, 1.0, 0.5], [WEAR.sunhat(), 1.2, -0.6, 0.8], [WEAR.sunglasses(), -0.9, 1.1, 0.6]]);
      put(ITEMS.ball(), rx, 0, rz, 0.9);
      put(sunfriend(), portrait ? -2.4 : -4.2, portrait ? 7.4 : 4.6, -10, 1.8);
    } else if (season === "fall") {
      [[0, 0, 1.25], [0.9, 0.5, 0.95], [-0.8, 0.6, 1.0]].forEach(([dx, dz, k]) => put(pumpkin(), lx + dx, 0, lz + dz, k).rotation.y = dx);
      const colors = [0xf2683a, 0xffb43a, 0xff8a2e, 0xe8513a];
      for (let i = 0; i < 26; i++) put(mapleLeaf(colors[i % 4]), rx + (rand() - 0.5) * 2.4, 0.06 + rand() * 0.25, rz + (rand() - 0.5) * 1.6, 0.6).rotation.set(-Math.PI / 2 + (rand() - 0.5) * 0.6, 0, rand() * 6);
      for (let i = 0; i < 18; i++) put(mapleLeaf(colors[i % 4]), (rand() - 0.5) * 12, 0.04, (rand() - 0.2) * 8, 0.55).rotation.set(-Math.PI / 2, 0, rand() * 6);
      sky(() => mapleLeaf(0xff8a2e), [[0, 0, 0.7, 0.6], [-1.2, 0.8, 0.6, -0.5], [0.9, 1.1, 0.6, 1.4]]);
    } else if (season === "winter") {
      put(snowfriend(), lx, 0.1, lz, 0.95).rotation.y = 0.35;
      sky(snowflake, [[0, 0, 0.8, 0.2], [-1.2, 0.9, 0.7, 0.6], [0.8, 1.2, 0.6, 1.0], [-0.4, -0.7, 0.6, 0.4]]);
      sky(snowflake, [[-(SKY_R[0] - SKY_L[0]), 0.4, 0.8, 0.3], [-(SKY_R[0] - SKY_L[0]) + 0.9, -0.4, 0.6, 0.8]]);
      for (const [dx, dz, r] of [[0, 0, 0.9], [0.8, 0.4, 0.6], [-0.6, 0.5, 0.5]]) put(mesh(new THREE.SphereGeometry(r, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), clay(0xffffff, { roughness: 0.7 })), rx + dx, 0, rz + dz).scale.y = 0.6;
    } else {
      put(pumpkin(), lx, 0, lz, 1.2);
      [[0.9, 0.3, 0xff6f7d], [1.4, -0.2, 0xffd23a]].forEach(([dx, dz, c]) => put(tulip(c), lx + dx, 0, lz + dz, 1.3));
      put(snowfriend(), rx, 0, rz, 0.8).rotation.y = -0.35;
