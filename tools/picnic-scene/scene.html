  /* ---------- Animals: the videos' pastel world — a pink-lilac sky,
     pastel grass and trees, a path of pastel stones — and where the
     lesson's animal lives at the near left and right (the review: the
     three homes it sorts into). */
  const PASTEL = [0xffc9de, 0xd9c9f5, 0xc4ecd9, 0xffe0c2, 0xcfe4fb];
  const pastelTree = () => roundTree([0xa6e3b4, 0xffc4dc, 0xc9b8f2, 0xa6e3b4]);
  function stonePath() {
    for (let i = 0; i < 260; i++) {
      const z = 9 - i * 0.12 - (i * i) / 900;
      if (z < -40) break;
      const width = 0.9 + (9 - z) * 0.01;
      const x = (rand() - 0.5) * width * 2;
      // half-way to the grass: a path to walk on, not a thing to look at
      const tone = new THREE.Color(PASTEL[i % PASTEL.length]).lerp(new THREE.Color(0xbfe8b0), 0.45);
      const stone = mesh(new THREE.SphereGeometry(0.26, 24, 12), clay(tone, { roughness: 0.7, clearcoat: 0.15 }));
      stone.scale.set(1.2, 0.3, 0.9);
      stone.castShadow = false;
      put(stone, x, 0.02, z);
    }
  }
  function pond(r = 1.6) {
    const g = new THREE.Group();
    const water = mesh(new THREE.CylinderGeometry(r, r, 0.06, 64), clay(0x8fcdfc, { clearcoat: 0.9, clearcoatRoughness: 0.1, roughness: 0.2 }));
    water.position.y = 0.03;
    water.scale.z = 0.7;
    g.add(water);
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * Math.PI * 2;
      const rock = mesh(new THREE.SphereGeometry(0.22 + (k % 3) * 0.05, 24, 12), clay(PASTEL[k % PASTEL.length], { roughness: 0.6 }));
      rock.scale.y = 0.55;
      rock.position.set(Math.cos(a) * r, 0.08, Math.sin(a) * r * 0.7);
      g.add(rock);
    }
    for (const [x, z] of [[-0.5, 0.2], [0.6, -0.3]]) {
      const pad = mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.03, 32, 1, false, 0.3, Math.PI * 1.8), leafy(0x6cc46a));
      pad.position.set(x * r * 0.6, 0.08, z * r * 0.6);
      g.add(pad);
    }
    return g;
  }
  function yarn(color) {
    const g = new THREE.Group();
    g.add(mesh(new THREE.SphereGeometry(0.42, 32, 24), clay(color, { roughness: 0.8 })));
    for (let k = 0; k < 4; k++) {
      const wrap = mesh(new THREE.TorusGeometry(0.42, 0.025, 8, 64), clay(color, { roughness: 0.8 }));
      wrap.rotation.set(k * 0.8, k * 0.5, 0);
      g.add(wrap);
    }
    g.children.forEach((c) => (c.position.y = 0.42));
    return g;
  }
  function bone() {
    const g = new THREE.Group();
    const white = clay(0xfff8ec, { roughness: 0.6 });
    const bar = mesh(new THREE.CapsuleGeometry(0.12, 0.8, 8, 16), white);
    bar.rotation.z = Math.PI / 2;
    g.add(bar);
    for (const x of [-0.5, 0.5]) for (const z of [-0.11, 0.11]) {
      const knob = mesh(new THREE.SphereGeometry(0.15, 24, 16), white);
      knob.position.set(x, 0, z);
      g.add(knob);
    }
    g.position.y = 0.15;
    return group(g);
  }
  function boulders(n = 5) {
    const g = new THREE.Group();
    for (let k = 0; k < n; k++) {
      const r = 0.7 + (k % 3) * 0.3;
      const rock = mesh(new THREE.SphereGeometry(r, 48, 32), clay(PASTEL[k % PASTEL.length], { roughness: 0.7, clearcoat: 0.15 }));
      rock.scale.y = 0.75;
      rock.position.set((k - n / 2) * 0.9, r * 0.55, (k % 2) * -0.7);
      g.add(rock);
    }
    return g;
  }
  function birdhouse() {
    const g = new THREE.Group();
    const pole = mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.4, 16), clay(0xc98f55));
    pole.position.y = 1.2;
    g.add(pole);
    const house = gableHouse(0.9, 0.8, 0.8, 0.45, clay(0xffc9de, { roughness: 0.6 }), clay(0xc9b8f2, { roughness: 0.6 }));
    house.position.y = 2.4;
    g.add(house);
    const hole = mesh(new THREE.CircleGeometry(0.16, 32), clay(0x5a3a5a));
    hole.position.set(0, 2.8, 0.42);
    g.add(hole);
    return g;
  }
  function nest() {
    const g = new THREE.Group();
    const twigs = mesh(new THREE.TorusGeometry(0.55, 0.22, 16, 48), clay(0xb98a5e, { roughness: 0.9 }));
    twigs.rotation.x = Math.PI / 2;
    twigs.position.y = 0.22;
    g.add(twigs);
    for (const [x, z] of [[-0.18, 0], [0.18, 0.05], [0, -0.18]]) {
      const egg = mesh(new THREE.SphereGeometry(0.17, 24, 16), clay(0xbfe3fb, { clearcoat: 0.6 }));
      egg.scale.y = 1.3;
      egg.position.set(x, 0.3, z);
      g.add(egg);
    }
    return g;
  }
  function hayBale() {
    const bale = mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.1, 48), clay(0xf2d27a, { roughness: 0.9 }));
    bale.rotation.z = Math.PI / 2;
    bale.position.y = 0.7;
    return group(bale);
  }
  function grassTuft() {
    const g = new THREE.Group();
    for (let k = 0; k < 7; k++) g.add(taperTube([[0, 0, 0], [(k - 3) * 0.08, 0.6, 0], [(k - 3) * 0.2, 1.3 + (k % 3) * 0.2, 0.05]], 0.06, 0.015, leafy(0x8ccf6e)));
    return g;
  }
  function animalsWorld(animal) {
    meadow({ sky: 0xf4e1f0, grass: 0xbfe8b0, hills: [0xcdeec0, 0xd8f0c8, 0xc6ebc0, 0xd8f0c8], flowers: [0xffc4dc, 0xffffff, 0xd9c9f5] });
    stonePath();
    const T = { parrot: palmTree, elephant: flatTree }[animal] ?? pastelTree;
    trees([T]);
    const L = (thing, k = 1, turn = 0.3) => (put(thing, NL[0], 0, NL[1], k).rotation.y = turn);
    const R = (thing, k = 1, turn = -0.3) => (put(thing, NR[0], 0, NR[1], k).rotation.y = turn);
    if (animal === "cat") { L(catBed(), 1.5); R(yarn(0xffc4dc)); put(yarn(0xcfe4fb), NR[0] - 1.0, 0, NR[1] - 0.6, 0.8); }
    if (animal === "dog") { L(kennel(), 1.3); R(bone(), 1.6); put(ITEMS.ball(), NR[0] - 1.2, 0, NR[1] - 0.8, 0.6); }
    if (animal === "fish") { L(pond(1.8)); R(fishbowl(), 1.3, 0); }
    if (animal === "elephant") { L(pond(2.2)); R(grassTuft(), 1.4); put(grassTuft(), NR[0] - 0.9, 0, NR[1] - 0.5, 1.1); }
    if (animal === "mouse") {
      L(group(stand(ITEMS.cheese(), -0.5, 0, 0, 1.4), stand(ITEMS.cheese(), 0.6, 0, 0.3, 1.1, 1.2)), 1);
      R(hayBale(), 1.1);
      const barn = gableHouse(3, 2.4, 2, 1.2, clay(0xf4a3b8, { roughness: 0.6 }), clay(0xc9b8f2, { roughness: 0.6 }));
      put(barn, portrait ? 4 : 7.5, 0, -10, 1).rotation.y = -0.5;
    }
    if (animal === "bird") { L(nest(), 1.4); R(birdhouse(), 0.75, -0.4); }
    if (animal === "parrot") { L(group(...[[0, 0, 0xff6f9a], [0.6, 0.4, 0xffd23a], [-0.6, 0.5, 0xff8a3c]].map(([x, z, c]) => at(hillFlower(c), [x, 0, z], 2.6)))); R(palmTree(), 0.55); }
    if (animal === "turtle") { L(pond(1.9)); R(boulders(3), 0.6); }
    if (animal === "gecko") { L(boulders(5), 0.8); R(boulders(3), 0.7); }
    if (animal === "review") { L(group(at(catBed(), [-1.0, 0, 0], 1.2), at(kennel(), [1.2, 0, -0.4], 1.0))); R(fishbowl(), 1.3, 0); }
  }

  /* ---------- Weather: the meadow under the lesson's weather — its sky,
     what falls or blows, and what a child wears for it (the review: a
     little of each). */
  function weatherWorld(weather) {
    const rain = weather === "rainy", snow = weather === "snowy", wind = weather === "windy";
    meadow({
      sky: { sunny: 0xbfe3fb, rainy: 0xc8d2de, windy: 0xcfe6fb, snowy: 0xe2eaf3, review: 0xcfe6fb }[weather],
      grass: snow ? 0xfbfdff : rain ? 0x8cc77a : 0x9ad67c,
      hills: snow ? [0xf4f8fc, 0xeef4fa] : undefined,
      cloud: weather === "sunny" ? null : rain ? 0xc9d3df : 0xffffff,
      flowers: snow ? null : [0xff9ec8, 0xffffff, 0xffd45e],
    });
    trees([() => (snow ? roundTree([0xe9f1f8], { snow: true }) : roundTree([0x7cc66a], { lean: wind ? -0.22 : 0 }))]);
    const L = (thing, k = 1, turn = 0.3) => (put(thing, NL[0], 0, NL[1], k).rotation.y = turn);
    const R = (thing, k = 1, turn = -0.3) => (put(thing, NR[0], 0, NR[1], k).rotation.y = turn);
    const skyAt = (dx, dy) => [SKY_R[0] + dx, SKY_R[1] + dy, SKY_R[2]];
    if (weather === "sunny") {
      put(weatherSun(), portrait ? -1.8 : -3.8, portrait ? 6.6 : 4.4, -6, 2.0);
      picnicAt(plainBlanket(0x8cc4f2), [[WEAR.sunglasses(), -0.8, -0.4, 0.7], [WEAR.sunhat(), 0.9, 0.2, 0.9]]);
      R(ITEMS.ball(), 1.0);
    }
    if (rain) {
      put(weatherCloud(0xb9cde2), ...skyAt(-0.6, 0.8), 1.5);
      put(weatherCloud(0xc9d6e4), SKY_L[0], SKY_L[1] + 0.8, SKY_L[2], 1.2);
      for (let i = 0; i < 46; i++) put(raindrop(), (rand() - 0.5) * (portrait ? 7 : 14), 0.6 + rand() * (portrait ? 6 : 4), -2 - rand() * 6, 1.4);
      for (const [x, z, r] of [[NR[0], NR[1], 0.9], [NR[0] - 1.6, NR[1] - 1.2, 0.6], [0.4, 1.8, 0.7], [-2.5, -1.5, 0.8]]) {
        const puddle = mesh(new THREE.CylinderGeometry(r, r, 0.04, 48), velvet(0x8fcdfc));
        puddle.scale.z = 0.62;
        put(puddle, x, 0.02, z);
      }
      L(WEAR.umbrella(), 1.1, 0);
      put(WEAR.rainhat(), NL[0] + 1.4, 0, NL[1] - 0.6, 0.75);
    }
    if (wind) {
      put(WEAR.kite(), ...skyAt(0.2, 0.8), 1.3).rotation.set(0, 0, -0.35);
      [[-1.0, 0.0, 2.3], [-1.6, -0.9, 1.9], [0.0, -1.5, 1.7]].forEach(([dx, dy, len]) => put(windSwirl(len), SKY_L[0] + dx + 1, SKY_L[1] + dy, SKY_L[2] + 1, 1.0));
      [[0x78cf5c, 0.5], [0xffa53a, -0.6], [0x63c84e, 1.2], [0xf2683a, -0.2], [0xffa53a, 0.9]].forEach(([c, turn], i) => put(plumpLeaf(0.32, 0.15, velvet(c)), (i - 2) * (portrait ? 0.9 : 1.8), 2.2 + (i % 2) * 1.1, -1, 1.6).rotation.set(0.3, 0.2, turn));
      L(WEAR.pinwheel(), 0.9, 0);
      R(WEAR.scarf(), 0.7);
    }
    if (snow) {
      L(weatherSnowman(), 1.1, 0.3);
      for (let i = 0; i < 30; i++) put(velvetFlake(), (rand() - 0.5) * (portrait ? 7 : 14), 0.8 + rand() * (portrait ? 6 : 4), -2 - rand() * 6, 0.7 + rand() * 0.4).rotation.z = rand() * 3;
      R(WEAR.beanie(), 0.7);
      put(WEAR.scarf(), NR[0] - 1.3, 0, NR[1] - 0.6, 0.6);
    }
    if (weather === "review") {
      put(weatherSun(), SKY_L[0], SKY_L[1] + 0.6, SKY_L[2], 1.3);
      put(weatherCloud(0xc9d6e4), ...skyAt(0, 0.6), 1.2);
      for (const [dx, dy] of [[-0.4, -0.5], [0.2, -0.9], [0.6, -0.4]]) put(raindrop(), ...skyAt(dx, dy), 1.4);
      L(WEAR.umbrella(), 1.0, 0);
      R(weatherSnowman(), 0.9);
    }
  }

  /* ---------- Play (2026-10-23): a game card's picture — `play-cups`,
     Nova's Cups. Her garden (the meadow, its fence, a tree, the sun), her
     three gold cups on the grass at the near left, the near one lifted off
     a carrot, and her basket of vegetables at the near right. The middle
     stays open grass and sky: the card's button sits there. Landscape
     only; `crop.py playcard cups`. ---------- */
  function playWorld(which) {
    if (which !== "cups") throw new Error(`No play card ${which}`);
    meadow({ sky: 0xd8ebfb, flowers: [0xffd45e, 0xffffff, 0xff9ec8] });
    trees([() => roundTree(), () => roundTree([0x8fd474, 0x7cc66a], { dots: 0xff8a3d })]);
    picketFence(-7);
    put(ITEMS.sun(), -5.5, 6.0, -24, 2.4);
    const cups = [[-4.1, 2.2, 0.15], [-2.85, 2.75, -0.1], [-1.55, 3.3, 0.2]];
    cups.forEach(([x, z, turnY], i) => {
      /* The near cup is up: the carrot it hid lies on the grass under it. */
      const c = ITEMS.cup();
      /* Tipped up on one side, the way a hand lifts it. */
      if (i === 2) c.rotation.z = -0.55;
      scene.add(stand(c, i === 2 ? x + 0.3 : x, i === 2 ? 0.04 : 0, z, 0.66, turnY));
      if (i === 2) {
        const carrot = new THREE.Group();
        const body = videoCarrot(0);
        body.rotation.z = Math.PI / 2;
        carrot.add(body);
        scene.add(stand(carrot, x + 0.15, 0, z + 0.15, 0.36, 0.2));
      }
    });
    const basket = ITEMS.basket();
    [[-0.3, 0.6, -0.2, "broccoli"], [0.3, 0.62, 0.1, "potato"], [0, 0.75, 0.3, "carrot"], [-0.2, 0.8, 0.05, "tomato"]].forEach(([x, y, z, food], i) => basket.add(at(VEG[food].loose(), [x, y, z], 0.34, [0, i, 0])));
    put(basket, 3.15, 0, 3.0, 0.82);
    put(VEG.pepper.loose(), 2.0, 0.1, 3.6, 0.5);
  }

  const WORLDS = { colors: colorsWorld, veg: vegetablesWorld, seasons: seasonsWorld, animals: animalsWorld, weather: weatherWorld, play: playWorld };
  const [course, which] = BACKDROP.includes("-") ? BACKDROP.split("-") : ["shapes", BACKDROP];
  if (course === "shapes") {
    const lesson = LESSONS[which];
    meadow();
    FAR.forEach(([x, z, k], i) => put(TREES[lesson.trees[i]](), x, 0, z, k));
    lesson.sky();
    // the picnic at the near left
    const picnic = new THREE.Group();
    picnic.add(BLANKET[which]());
    for (const [name, x, z, k, rotY] of lesson.picnic) {
      const thing = ITEMS[name]();
      place(thing, { at: [x, ON_BLANKET, z], scale: k, rotY });
      picnic.add(thing);
    }
    picnic.rotation.y = 0.45;
    put(picnic, NL[0], 0, NL[1], 0.85);
    put(lesson.near(), NR[0], 0, NR[1], 0.9);
  } else {
    WORLDS[course](which);
  }
  window.renderLayers = () => {
    renderer.render(scene, view);
    return { backdrop: renderer.domElement.toDataURL("image/png") };
  };
  window.itemsMeta = () => ({});
} else {
  /* ---------- The world ---------- */
  const world = new THREE.Group();
  scene.add(world);

  // grass
  const grass = mesh(new THREE.PlaneGeometry(30, 30), clay(0x8fd16e, { clearcoat: 0.05, roughness: 0.9, sheen: 0 }));
  grass.rotation.x = -Math.PI / 2;
  grass.castShadow = false;
  world.add(grass);

  // tufts of grass — little clay blades, never round, never under a thing
  const onGrass = Object.values(def.items).filter((it) => it.at[1] === 0).map((it) => [it.at[0], it.at[2]]);
  for (let i = 0; i < 70; i++) {
    const x = (rand() - 0.5) * 7.5, z = (rand() - 0.5) * 9.5;
    if (Math.abs(x) < 3.0 && Math.abs(z - 0.05) < 2.5) continue;
    if (onGrass.some(([a, c]) => Math.hypot(x - a, z - c) < 1.2)) continue;
    const tuft = new THREE.Group();
    const n = 3 + Math.floor(rand() * 3);
    for (let j = 0; j < n; j++) {
      const blade = mesh(new THREE.ConeGeometry(0.05, 0.32 + rand() * 0.18, 12), clay(rand() > 0.5 ? 0x86c96b : 0x94d27a));
      blade.position.set((rand() - 0.5) * 0.18, 0.16, (rand() - 0.5) * 0.18);
      blade.rotation.z = (rand() - 0.5) * 0.7;
      blade.rotation.x = (rand() - 0.5) * 0.7;
      tuft.add(blade);
    }
    tuft.position.set(x, 0, z);
    world.add(tuft);
  }

  world.add(BLANKETS[def.blanket]());

  const items = {};
  for (const [name, it] of Object.entries(def.items)) {
    const group = ITEMS[it.model ?? name](it.arg);
    place(group, it);
    scene.add(group);
    items[name] = { group, at: it.at };
  }

  window.renderLayers = () => {
    const out = {};
    // everything, for a preview
    catcher.visible = false;
    out.all = frame();
    // the world alone
    Object.values(items).forEach((it) => (it.group.visible = false));
    out.background = frame();
    // each item alone, on a shadow catcher at its own surface height
    world.visible = false;
    catcher.visible = true;
    renderer.setClearColor(0x000000, 0);
    for (const [name, it] of Object.entries(items)) {
      Object.values(items).forEach((o) => (o.group.visible = o === it));
      catcher.position.y = it.at[1] + 0.001;
      out[name] = frame();
      catcher.visible = false;
      out[name + "__hit"] = frame();
      catcher.visible = true;
    }
    return out;
  };
  window.itemsMeta = () =>
    Object.fromEntries(Object.entries(def.items).map(([k, it]) => [k, { shape: SHAPE_OF[it.model ?? k] ?? null, color: it.color ?? COLOR_OF[it.model ?? k] ?? null }]));
}
window.ready = true;
</script>
</body>
</html>
