    /* Bloo's farm: the animal's picture, as a data URL, onto its board. */
    async setAnimal(url) {
      const tex = await new Promise((done) => new THREE.TextureLoader().load(url, done));
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      const h = 3.2, aspect = tex.image.width / tex.image.height;
      animalPlane.material.map = tex;
      animalPlane.material.needsUpdate = true;
      const cap = portrait ? 2.9 : 4.6; /* a wide animal (the fish) must fit a phone's width */
      animalPlane.scale.set(Math.min(h * aspect, cap), Math.min(h, cap / aspect), 1);
    },
    async setFriend(picture, cheer) {
      const load = (url) =>
        new Promise((done) => {
          new THREE.TextureLoader().load(url, (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            done(tex);
          });
        });
      const [pic, joy] = await Promise.all([load(picture), load(cheer)]);
      const [fx_, fz, fh] = kitchen.F.friend;
      const height = fh * KK;
      aim(kitchenCam());
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: pic, transparent: true, depthWrite: false, toneMapped: false, fog: false }));
      plane.quaternion.copy(view.quaternion);
      plane.userData.noMerge = true;
      /* Its foot well under the counter's edge. */
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(view.quaternion);
      const foot = new THREE.Vector3(KX + fx_ * KK, KY - height * 0.38, ROOM_Z + fz * KK);
      const fit = (tex) => {
        plane.material.map = tex;
        plane.material.needsUpdate = true;
        const aspect = tex.image.width / tex.image.height;
        plane.scale.set(height * aspect, height, 1);
        plane.position.copy(foot).addScaledVector(up, height / 2);
      };
      fit(pic);
      plane.renderOrder = 1;
      scene.add(plane);
      kitchen.friend = { plane, fit, pic, joy };
    },
    /* Basket Time's frame, layered like the Find's: the room and counter
       with nothing on it, the counter alone (it lies over the friend), each
       thing, the basket and its near half. */
    kitchenLayers() {
      const out = {};
      showBasket(false);
      aim(kitchenCam());
      out.all = render();
      const { plane } = kitchen.friend;
      plane.visible = false;
      const all = Object.entries(things);
      all.forEach(([, t]) => (t.group.visible = false));
      kitchen.basket.visible = false;
      out.background = render();
      out.countermask = maskOf([[kitchen.counter, -Infinity]], view);
      const world = scene.children.filter((o) => o !== catcher && !o.isLight && o !== kitchen.root && o.visible);
      world.forEach((o) => (o.visible = false));
      kitchen.counter.visible = false;
      kitchen.root.children.forEach((o) => {
        if (o !== kitchen.basket && !all.some(([, t]) => t.group === o)) o.visible = false;
      });
      scene.background = null;
      scene.fog = null;
      renderer.setClearColor(0x000000, 0);
      catcher.visible = true;
      catcher.material.opacity = 0.26;
      catcher.position.set(KX, KY + 0.002, ROOM_Z);
      const layer = (name, group_) => {
        group_.visible = true;
        out[name] = render();
        catcher.visible = false;
        out[name + "__hit"] = render();
        catcher.visible = true;
        group_.visible = false;
      };
      for (const [name, t] of all) layer(name, t.group);
      layer("basket", kitchen.basket);
      catcher.visible = false;
      kitchen.basket.visible = true;
      const [, bz, bs] = kitchen.F.basket;
      out.rimmask = maskOf(kitchen.basket.children.filter((m) => m.geometry?.type !== "CircleGeometry").map((m) => [m, ROOM_Z + (bz + 0.1 * bs) * KK]), view);
      return out;
    },
    kitchenMeta() {
      aim(kitchenCam());
      const { plane, pic, fit } = kitchen.friend;
      fit(pic);
      plane.updateMatrixWorld(true);
      const pts = [[-0.5, 0.5], [0.5, -0.5]].map(([x, y]) => plane.localToWorld(new THREE.Vector3(x, y, 0)).project(view));
      const box = [((pts[0].x + 1) / 2) * 100, ((1 - pts[0].y) / 2) * 100, ((pts[1].x - pts[0].x) / 2) * 100, ((pts[0].y - pts[1].y) / 2) * 100];
      return {
        items: Object.fromEntries(Object.keys(things).map((k) => [k, { shape: null, color: null }])),
        mouth: mouthOf(kitchen.basket, view),
        friend: box.map((v) => Math.round(v * 100) / 100),
      };
    },
    /* Which shape each thing is — the Find's answer key. */
    meta: () => ({ items: Object.fromEntries(Object.entries(things).map(([k, t]) => [k, { shape: t.shape, color: t.color, group: t.group_ ?? null }])) }),
  };
  if (STOPS) {
    /* The camera through the stops: `t` 0 over the chest (the nearest), 1 far
       in at the first lesson — low, as in the picture, going up a little. */
    const first = Math.min(...stopsApi.spots.map((spot) => spot[1]));
    /* The wide frame (a desktop): further back, higher and a wider lens than the
       first take, whose camera was too close with everything too big. */
    const [FOV, BACK, UP] = [Number(params.get("fov") ?? 42), Number(params.get("back") ?? 6), Number(params.get("up") ?? 1.5)];
    if (!portrait) {
      view.fov = FOV;
      view.updateProjectionMatrix();
    }
    const [FROM, TO] = portrait
      ? [[0, 10.5, 24, 0, 1.6, 3], [0, 12, first + 21, 0, 2.6, first - 2]]
      : [[0, 8.4 + UP, 20.5 + BACK, 0, 1.8, 3], [0, 9.6 + UP, first + 17 + BACK, 0, 2.8, first - 2]];
    const camAt = (t) => lerp(FROM, TO, t);
    /* The chest opening (2026-11-11): `p` 0..1 over the play — a cartoon
       wobble (the lid rattling), then the lid swings open on its hinge with a
       little overshoot as the light inside comes up; 1 = open and lit. */
    const chestState = (p) => {
      if (stopsApi.last) return stopsApi.last.state(p);
      const c = stopsApi.chest;
      if (!c) return;
      const k = (a, b) => Math.max(0, Math.min(1, (p - a) / (b - a)));
      const shake = k(0, 0.4);
      const fade = shake < 1 ? Math.sin(Math.PI * shake) : 0;
      const wob = Math.sin(shake * Math.PI * 6) * 0.07 * fade;
      c.chest.rotation.z = wob;
      c.chest.rotation.y = c.base.ry + wob * 0.4;
      c.chest.scale.set(1 + 0.03 * fade * Math.cos(shake * Math.PI * 12), 1 - 0.03 * fade * Math.cos(shake * Math.PI * 12), 1);
      const rattle = Math.abs(Math.sin(shake * Math.PI * 9)) * 0.1 * fade;
      const o = k(0.4, 0.82);
      /* Ease out with a small overshoot, then settle (back ease). */
      const back = (x) => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2;
      c.lid.rotation.x = -(rattle + 1.95 * (o > 0 ? back(o) : 0));
      const g = k(0.44, 0.9);
      const glow = g * g * (3 - 2 * g);
      c.glowM.color.setHex(0xc9762a).lerp(new THREE.Color(0xfffcf2), glow);
      c.inner.intensity = 9 * glow;
      c.halo.material.opacity = 0.45 * glow;
    };
    window.garden = {
      frameAt(t) {
        aim(camAt(t));
        return render("image/jpeg", 0.95);
      },
      /* The night world's entry scene (2026-11-12), `p` 0..1 over ~7 s: the camera
         looks up at the night sky, a star falls across it with its tail of light and
         is gone in the clouds far ahead (a soft burst), then the camera comes down to
         the trail and lands where the page opens (`endT`, level 1's place). */
      introAt(p, endT) {
        const fall = stopsApi.fall;
        if (!fall) return null;
        const ease = (v) => v * v * (3 - 2 * v);
        const k = (a, b) => Math.max(0, Math.min(1, (p - a) / (b - a)));
        const farZ = first;
        /* The star: in from high left, down and away to the right, into the sea. */
        const f = k(0.06, 0.52);
        /* Across open sky, right of the way, so nothing on the trail hides it. */
        const from = new THREE.Vector3(portrait ? -12 : -30, 40, -14), to = new THREE.Vector3(portrait ? 16 : 44, -20, farZ - 36);
        const pos = from.clone().lerp(to, f * f * 0.35 + f * 0.65);
        fall.faller.visible = f > 0 && f < 1;
        fall.faller.position.copy(pos);
        const dir = to.clone().sub(from).normalize();
        fall.tail.rotation.z = Math.atan2(dir.y, dir.x);
        fall.faller.children[0].rotation.z = -f * 7;
        const b = k(0.5, 0.8);
        fall.burst.visible = b > 0 && b < 1;
        fall.burst.position.set(to.x, -13, to.z - 4);
        fall.burst.material.opacity = Math.min(1, Math.sin(Math.PI * b) * 1.4);
        /* The camera: up at the sky, following the star, then down to the trail. */
        const high = [0, 13, 26, -10, 34, farZ - 70];
        const follow = [0, 12, 26, pos.x * 0.6, Math.max(2, pos.y * 0.7), Math.min(-20, pos.z)];
        const end = camAt(endT);
        const look = ease(k(0.12, 0.5));
        let pose = lerp(high, follow, look);
        const land = ease(k(0.6, 1));
        pose = lerp(pose, end, land);
        aim(pose);
        const url = render("image/jpeg", 0.92);
        fall.faller.visible = false;
        fall.burst.visible = false;
        return url;
      },
      /* The sky with nothing to land on, from the camera at `t` (the Sky Trail's
         levels are played over it, out of focus). */
      emptyAt(t) {
        const things = [...stopsApi.stops, ...stopsApi.ways];
        things.forEach((g) => (g.visible = false));
        aim(camAt(t));
        const url = render("image/jpeg", 0.95);
        things.forEach((g) => (g.visible = true));
        return url;
      },
      /* The chest at `p` of its opening, from the camera at `t`. */
      chestAt(t, p) {
        chestState(p);
        aim(camAt(t));
        const url = render("image/jpeg", 0.95);
        chestState(0);
        return url;
      },
      /* Way `k`'s stones at `t`: white where they are the nearest thing, black
         elsewhere. The page multiplies pink through it, so a white stone
         turns pink with all its shading. */
      ways: stopsApi.ways.length,
      drops: stopsApi.statues.length,
      stopCount: stopsApi.stops.length,
      wayMask(t, k) {
        aim(camAt(t));
        const [bg, fog] = [scene.background, scene.fog];
        scene.background = null;
        scene.fog = null;
        /* The sky's friend is a flat picture: its empty corners hide no star. */
        const flat = SKY_STOPS ? stopsApi.pictures.map((picture) => picture.mesh) : [];
        const shown = flat.map((m) => m.visible);
        flat.forEach((m) => (m.visible = false));
        const url = maskOf([[stopsApi.ways[k], -Infinity]], view);
        flat.forEach((m, i) => (m.visible = shown[i]));
        scene.background = bg;
        scene.fog = fog;
        return url;
      },
      /* Drop `k`'s pixels at `t`: white where it is the nearest thing. The page
         greys the ones not yet open through it. */
      dropMask(t, k) {
        aim(camAt(t));
        const [bg, fog] = [scene.background, scene.fog];
        scene.background = null;
        scene.fog = null;
        const url = maskOf([[stopsApi.statues[k], -Infinity]], view);
        scene.background = bg;
        scene.fog = fog;
        return url;
      },
      /* Each stop's box on the picture at `t`, % — what the page lays its
         link over. */
      /* Bloo's pictures (data URLs, in lesson order): an animal stands on each
         slab, or a season shows in each round window. Before the first frame. */
      async setPictures(urls) {
        const load = (url) =>
          new Promise((done) => {
            new THREE.TextureLoader().load(url, (tex) => {
              tex.colorSpace = THREE.SRGBColorSpace;
              tex.anisotropy = 8;
              done(tex);
            });
          });
        const texes = await Promise.all(urls.map(load));
        stopsApi.pictures.forEach(({ kind, mesh: m }, i) => {
          m.material.map = texes[i];
          m.material.color.set(0xffffff);
          m.material.needsUpdate = true;
          if (kind === "friend") m.scale.x = m.scale.y * (texes[i].image.width / texes[i].image.height);
          if (kind === "animal") {
            const aspect = texes[i].image.width / texes[i].image.height;
            const [wd, ht] = 4.2 * aspect > 5 ? [5, 5 / aspect] : [4.2 * aspect, 4.2];
            m.scale.set(wd, ht, 1);
          }
        });
      },
      boxes(t) {
        aim(camAt(t));
        return stopsApi.stops.map((g) => {
          const b = new THREE.Box3().setFromObject(g.children.find((c) => c.userData.hit)?.userData.hit ?? g);
          let [l, tp, r, bt] = [Infinity, Infinity, -Infinity, -Infinity];
          for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
            const p = new THREE.Vector3(x, y, z).project(view);
            const [px, py] = [((p.x + 1) / 2) * 100, ((1 - p.y) / 2) * 100];
            [l, tp, r, bt] = [Math.min(l, px), Math.min(tp, py), Math.max(r, px), Math.max(bt, py)];
          }
          return [l, tp, r - l, bt - tp].map((v) => Math.round(v * 10) / 10);
        });
      },
    };
  }
  window.renderLayers = () => ({ preview: window.garden.station ? window.garden.station(0) : window.garden.frameAt(0) });
} else if (BACKDROP) {
  /* ---------- A course's backdrop (2026-10-13): its world behind every
     step, rendered sharp here and blurred by `crop.py backdrop`. Shapes:
     Pinki's picnic meadow, one per lesson — the same sky, grass and hills,
     and everything in it the lesson's shape (the user: "in the circle
     lesson, circles in the background"): the blanket, what is on it, the
     trees, what is in the sky and at the near right. The middle stays
     quiet grass and sky for the step. The other courses' worlds follow
     the same plan below (`WORLDS`), each lesson's things its own.
     `?backdrop=<circle|square|triangle|rectangle|review>` (Shapes) or
     `<colors|veg|seasons|animals|weather>-<lesson>`, `&frame=portrait|landscape`. ---------- */
  const portrait = params.get("frame") === "portrait";
  const [w, h] = portrait ? [900, 1600] : [1600, 900];
  renderer.setSize(w, h);
  scene.background = new THREE.Color(0xcfe6fb);
  const view = new THREE.PerspectiveCamera(portrait ? 62 : 38, w / h, 0.1, 200);
  view.position.set(0, portrait ? 2.4 : 2.0, 10);
  view.lookAt(0, portrait ? 1.0 : 1.5, 0);
  catcher.visible = false;
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
  const leafy = (color = 0x7cc66a) => clay(color, { clearcoat: 0.15, roughness: 0.75 });
  const put = (thing, x, y, z, k = 1) => {
    thing.scale.setScalar(k);
    thing.position.set(x, y, z);
    scene.add(thing);
    return thing;
  };
  const trunk = (height) => {
    const t = mesh(new THREE.CylinderGeometry(0.22, 0.3, height, 24), clay(0xb98a5e, { clearcoat: 0.1, roughness: 0.8 }));
    t.position.y = height / 2;
    return t;
  };

  /* The trees, one kind per shape. */
  const TREES = {
    circle() {
      const g = new THREE.Group();
      g.add(trunk(2.2));
      for (const [cx, cy, cr] of [[0, 2.9, 1.25], [-0.8, 2.4, 0.85], [0.85, 2.45, 0.9], [0.1, 3.6, 0.8]]) {
        const puff = mesh(new THREE.SphereGeometry(cr, 48, 32), leafy());
        puff.position.set(cx, cy, 0);
        g.add(puff);
      }
      return g;
    },
    // a box hedge on a short trunk
    square() {
      const g = new THREE.Group();
      g.add(trunk(1.2));
      const box = mesh(new RoundedBoxGeometry(2.6, 2.6, 2.6, 6, 0.3), leafy(0x78c468));
      box.position.y = 2.4;
      g.add(box);
      return g;
    },
    // a pine: three cones
    triangle() {
      const g = new THREE.Group();
      g.add(trunk(1.0));
      for (const [y, r, hh] of [[1.6, 1.6, 2.0], [2.7, 1.25, 1.8], [3.7, 0.9, 1.6]]) {
        const cone = mesh(new THREE.ConeGeometry(r, hh, 48), leafy(0x5fb26a));
        cone.position.y = y;
        g.add(cone);
      }
      return g;
    },
    // a tall clipped hedge
    rectangle() {
      const g = new THREE.Group();
      g.add(trunk(1.0));
      const box = mesh(new RoundedBoxGeometry(1.7, 3.6, 1.7, 6, 0.25), leafy(0x78c468));
      box.position.y = 2.7;
      g.add(box);
      return g;
    },
  };

  /* The blankets, one per shape (the review's is the rectangle's). */
  const blanketCloth = (color) => clay(color, { clearcoat: 0.1, roughness: 0.85, sheen: 0.2 });
  const cream = clay(0xffe3ee, { clearcoat: 0.05, roughness: 0.9, sheen: 0.2 });
  const BLANKET = {
    circle() {
      const g = new THREE.Group();
      g.add(mesh(new THREE.CylinderGeometry(2.75, 2.75, BH, 160), blanketCloth(0xf58fb8)));
      for (const r of [2.4, 1.5]) {
        const ring = mesh(new THREE.TorusGeometry(r, 0.12, 12, 160), cream);
        ring.rotation.x = Math.PI / 2;
        ring.scale.z = 0.25;
        ring.position.y = BH / 2;
        g.add(ring);
      }
      g.position.y = BH / 2;
      return g;
    },
    // pink with cream squares
    square() {
      const g = new THREE.Group();
      const S = 4.8;
      g.add(mesh(new RoundedBoxGeometry(S, BH, S, 6, 0.06), blanketCloth(0xf58fb8)));
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
        if ((i + j) % 2) continue;
        const tile = mesh(new RoundedBoxGeometry(0.86, 0.02, 0.86, 2, 0.01), cream);
        tile.position.set(i * 0.94, BH / 2, j * 0.94);
        g.add(tile);
      }
      g.position.y = BH / 2;
      return g;
    },
    // a triangle, a cream triangle inside it
    triangle() {
      const tri = (r) => {
        const s = new THREE.Shape();
        for (let k = 0; k < 3; k++) {
          const a = Math.PI / 2 + (k * 2 * Math.PI) / 3;
          k ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        s.closePath();
        return s;
      };
      const g = new THREE.Group();
      g.add(flat(tri(3.4), BH, 0.04, blanketCloth(0xf58fb8)));
      const inner = flat(tri(1.7), 0.02, 0.01, cream);
      inner.position.y = BH + 0.02;
      g.add(inner);
      return g;
    },
    rectangle: () => BLANKETS.pinkStripes(),
  };
  BLANKET.review = BLANKET.rectangle;

  /* What lies on the blanket ([thing, x, z, scale, turn] in its own
     coordinates), what stands at the near right, and the sky's own. */
  const LESSONS = {
    circle: {
      picnic: [["plate", -0.9, -0.7, 1, 0], ["donut", 0.9, -0.6, 1, 0.4], ["cookie", -0.5, 1.0, 1, 0], ["orange", 0.9, 0.9, 0.9, 0]],
      near: () => ITEMS.ball(),
      trees: ["circle", "circle", "circle", "circle"],
      sky() {
        // the sun, a round one, and three round balloons
        const disc = mesh(new THREE.SphereGeometry(2.4, 64, 48), clay(0xffd45e, { emissive: 0xffc93a, emissiveIntensity: 0.5 }));
        disc.scale.z = 0.4;
        disc.castShadow = false;
        put(disc, portrait ? -3.2 : -3.5, portrait ? 9.4 : 5.2, -22);
        for (const [color, x, y] of portrait ? [["pink", 1.2, 4.6], ["blue", 1.9, 5.1], ["yellow", 1.6, 4.1]] : [["pink", 3.4, 2.4], ["blue", 4.2, 2.9], ["yellow", 3.8, 1.9]]) put(ITEMS.balloon(color), x, y, -3, 0.9);
      },
    },
    square: {
      picnic: [["toast", -0.9, -0.8, 1, 0.2], ["gift", 1.0, -0.7, 0.95, -0.3], ["cracker", -0.8, 1.0, 1, -0.3], ["dice", 1.0, 1.0, 1, 0.4]],
      near: () => ITEMS.gift(0x8cc4f2),
      trees: ["square", "square", "square", "square"],
      sky() {},
    },
    triangle: {
      picnic: [["pizza", 0, -0.9, 0.95, 3.3], ["cheese", -0.8, 0.8, 0.85, 0.2], ["sandwich", 0.8, 0.8, 0.9, -0.5]],
      near() {
        // a pennant stuck in the grass
        const flag = ITEMS.flag();
        flag.rotation.set(Math.PI / 2, 0, Math.PI / 2);
        const g = new THREE.Group();
        flag.position.y = 1.3;
        g.add(flag);
        return g;
      },
      trees: ["triangle", "triangle", "triangle", "triangle"],
      sky() {
        // bunting across the sky: a string with pennants hanging from it
        const span = portrait ? 4.2 : 9;
        const y0 = portrait ? 6.6 : 4.6;
        const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-span, y0 + 0.6, -4), new THREE.Vector3(0, y0 - 0.4, -4), new THREE.Vector3(span, y0 + 0.6, -4)]);
        scene.add(mesh(new THREE.TubeGeometry(curve, 64, 0.03, 8), clay(0xffffff)));
        const colors = [0xf58fb8, 0xffd45e, 0x8cc4f2];
        for (let k = 0; k <= 10; k++) {
          const p = curve.getPoint(k / 10);
          const s = new THREE.Shape(); s.moveTo(-0.32, 0); s.lineTo(0.32, 0); s.lineTo(0, -0.7); s.closePath();
          const pennant = mesh(roundedShapeExtrude(s, 0.04, 0.02), clay(colors[k % 3], { clearcoat: 0.4 }));
          pennant.position.copy(p);
          scene.add(pennant);
        }
        // a tent far off on the right
        const side = new THREE.Shape(); side.moveTo(-1.6, 0); side.lineTo(1.6, 0); side.lineTo(0, 2.4); side.closePath();
        const tent = mesh(roundedShapeExtrude(side, 3.2, 0.08), clay(0xf9c06b, { clearcoat: 0.2, roughness: 0.7 }));
        tent.rotation.y = -0.6;
        put(tent, portrait ? 4.5 : 8.5, 0, -11);
      },
    },
    rectangle: {
      picnic: [["book", -1.2, -0.8, 1, -0.3], ["chocolate", 1.2, -0.7, 0.95, 0.35], ["juice", 1.2, 1.0, 0.95, -0.2], ["ruler", -1.2, 1.1, 0.9, 1.45]],
      near: () => ITEMS.juice(),
      trees: ["rectangle", "rectangle", "rectangle", "rectangle"],
      sky() {
        // a fence of boards across the field
        const wood = clay(0xfff3e2, { clearcoat: 0.1, roughness: 0.8 });
        for (let x = -16; x <= 16; x += 0.9) {
          const board = mesh(new RoundedBoxGeometry(0.6, 1.5, 0.12, 3, 0.04), wood);
          put(board, x, 0.75, -9);
        }
        for (const y of [0.45, 1.1]) {
          const rail = mesh(new RoundedBoxGeometry(33, 0.18, 0.1, 2, 0.04), wood);
          put(rail, 0, y, -9.12);
        }
      },
    },
    review: {
      picnic: [["plate", -1.2, -0.8, 1, 0], ["toast", 1.2, -0.7, 1, 0.2], ["cheese", 1.1, 1.0, 0.85, 0.2], ["book", -1.2, 1.0, 0.9, -0.3]],
      near: () => ITEMS.ball(),
      trees: ["triangle", "circle", "square", "rectangle"],
      sky() {},
    },
  };
  /* Where things stand in each frame: the near left and near right (in
     every frame at its own edges), four spots far off at the sides, and
     the sky's left and right. */
  const NL = portrait ? [-1.9, 5.6] : [-3.6, 3.0];
  const NR = portrait ? [1.5, 6.2] : [3.6, 3.6];
  const FAR = [[-9, -12, 1.4], [-13, -18, 1.2], [10, -14, 1.5], [15, -22, 1.2]];
  const SKY_L = portrait ? [-1.8, 5.4, -3] : [-3.4, 3.2, -3];
  const SKY_R = portrait ? [1.6, 5.0, -3] : [3.8, 2.8, -3];
  /* Stand a thing on `y` (its lowest point there), wherever it is built. */
  const stand = (thing, x, y, z, k = 1, turnY = 0) => {
    thing.scale.multiplyScalar(k);
    thing.rotation.y += turnY;
    thing.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(thing);
    thing.position.set(x, y - box.min.y, z);
    return thing;
  };
  const many = (make, spots) => spots.map((spot) => put(make(), ...spot));

  /* The meadow every world shares: sky, grass, hills on the horizon,
     clouds and a few flowers. */
  function meadow({ sky = 0xcfe6fb, grass = 0x9ad67c, hills = [0xb4e39b, 0xa9dd8f, 0xbde6a6, 0xa9dd8f], cloud = 0xffffff, flowers = [0xff9ec8, 0xffffff, 0xffd45e] } = {}) {
    scene.background = new THREE.Color(sky);
    const ground = mesh(new THREE.PlaneGeometry(200, 200), turf(grass));
    ground.rotation.x = -Math.PI / 2;
    ground.castShadow = false;
    scene.add(ground);
    [[-14, -40, 16, 0.32], [10, -46, 20, 0.28], [32, -38, 14, 0.36], [-34, -44, 18, 0.3]].forEach(([x, z, r, sy], i) => {
      const hill = mesh(new THREE.SphereGeometry(r, 64, 32), turf(hills[i % hills.length]));
      hill.scale.y = sy;
      hill.position.set(x, 0, z);
      scene.add(hill);
    });
    if (cloud !== null) {
      for (const [x, y, z, k] of portrait ? [[-7, 7.5, -20, 3.2], [8, 9, -26, 3.8], [1, 11, -30, 2.6]] : [[-6, 5.4, -20, 3.2], [9, 6.2, -26, 3.8], [1.5, 7.4, -30, 2.6]]) {
        const c = ITEMS.cloud();
        // lit from inside a little: a cloud's underside read as storm grey
        c.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.material.color.set(cloud); o.material.emissive.set(cloud); o.material.emissiveIntensity = 0.45; } });
        put(c, x, y, z, k);
      }
    }
    if (flowers) [[3.5, 1], [-1.5, -2], [6.5, -1], [-6.5, -3], [1.2, 3.5], [-3.8, 7.2], [4.2, 6.8]].forEach(([x, z], i) => put(hillFlower(flowers[i % flowers.length]), x, 0, z, 1.6));
  }

  /* A round tree, its crown in `colors`, `dots` scattered over its front
     (blossoms, apples) and an optional `lean` (the wind). */
  function roundTree(colors = [0x7cc66a], { dots = null, lean = 0, snow = false } = {}) {
    const g = new THREE.Group();
    g.add(trunk(2.2));
    [[0, 2.9, 1.25], [-0.8, 2.4, 0.85], [0.85, 2.45, 0.9], [0.1, 3.6, 0.8]].forEach(([cx, cy, cr], i) => {
      const puff = mesh(new THREE.SphereGeometry(cr, 48, 32), leafy(colors[i % colors.length]));
      puff.position.set(cx, cy, 0);
      g.add(puff);
      if (snow) {
        const cap = mesh(new THREE.SphereGeometry(cr * 0.82, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2.6), clay(0xffffff, { roughness: 0.7 }));
        cap.position.set(cx, cy + cr * 0.32, 0);
        g.add(cap);
      }
    });
    if (dots) for (const [dx, dy] of [[-0.5, 3.1], [0.4, 3.4], [0.9, 2.5], [-0.9, 2.3], [0.1, 2.6], [-0.2, 3.9], [0.6, 3.0]]) {
      const dot = mesh(new THREE.SphereGeometry(0.17, 24, 16), clay(dots, { clearcoat: 0.5 }));
      dot.position.set(dx, dy, 1.0);
      g.add(dot);
    }
    g.rotation.z = lean;
    return g;
  }
  /* A bare winter tree: a trunk, four branches, snow along them. */
  function bareTree() {
    const g = new THREE.Group();
    const bark = clay(0xa47a58, { roughness: 0.8, clearcoat: 0.1 });
    g.add(taperTube([[0, 0, 0], [0.05, 1.6, 0], [0, 3.0, 0]], 0.3, 0.18, bark));
    for (const [x, y] of [[-1.2, 3.6], [1.1, 3.4], [-0.5, 4.2], [0.6, 4.3]]) {
      g.add(taperTube([[0, 2.2, 0], [x * 0.5, (2.2 + y) / 2, 0], [x, y, 0]], 0.14, 0.06, bark));
      const snow = mesh(new THREE.SphereGeometry(0.22, 24, 16), clay(0xffffff, { roughness: 0.7 }));
      snow.scale.set(1.4, 0.6, 1);
      snow.position.set(x, y + 0.12, 0);
      g.add(snow);
    }
    return g;
  }
  /* A palm: a curved trunk of rings and a crown of long leaves. */
  function palmTree() {
    const g = new THREE.Group();
    for (let i = 0; i < 9; i++) {
      const ring = mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.42, 24), clay(0xc9a27a, { roughness: 0.8 }));
      ring.position.set(Math.sin(i * 0.16) * 0.9, 0.21 + i * 0.4, 0);
      g.add(ring);
    }
    for (let k = 0; k < 7; k++) {
      const a = (k / 7) * Math.PI * 2;
      const leaf = mesh(new THREE.SphereGeometry(0.5, 32, 16), leafy(0x5fbf6a));
      leaf.scale.set(3.2, 0.25, 0.9);
      leaf.position.set(0.9 + Math.cos(a) * 1.3, 3.8 - 0.35, Math.sin(a) * 1.3);
      leaf.rotation.set(0, -a, -0.35);
      g.add(leaf);
    }
    return g;
  }
  /* An acacia: a thin trunk and a wide flat crown (the elephant's). */
  function flatTree() {
    const g = new THREE.Group();
    g.add(taperTube([[0, 0, 0], [0.2, 1.6, 0], [0, 3.0, 0]], 0.26, 0.16, clay(0xb98a5e, { roughness: 0.8 })));
    const top = mesh(new THREE.SphereGeometry(1.6, 48, 24), leafy(0x8ccf6e));
    top.scale.set(1.9, 0.38, 1.3);
    top.position.y = 3.3;
    g.add(top);
    return g;
  }
  const trees = (makers) => FAR.forEach(([x, z, k], i) => put(makers[i % makers.length](), x, 0, z, k));

  /* A blanket of one color, a paler border inside it. */
  function plainBlanket(color, border = 0xffffff) {
    const g = new THREE.Group();
    g.add(mesh(new RoundedBoxGeometry(5.7, BH, 4.8, 6, 0.06), blanketCloth(color)));
    const inner = mesh(new RoundedBoxGeometry(5.1, 0.02, 4.2, 4, 0.01), clay(border, { clearcoat: 0.05, roughness: 0.9, transparent: true, opacity: 0.35 }));
    inner.position.y = BH / 2 + 0.01;
    g.add(inner);
    g.position.y = BH / 2;
    return g;
  }
  /* A picnic at the near left: a blanket and things stood on it
     ([thing, x, z, scale, turn] in the blanket's own coordinates). */
  function picnicAt(blanket, things, k = 0.85) {
    const g = new THREE.Group();
    g.add(blanket);
    for (const [thing, x, z, s = 1, turn = 0] of things) g.add(stand(thing, x, ON_BLANKET, z, s, turn));
    g.rotation.y = 0.45;
    return put(g, NL[0], 0, NL[1], k);
  }

  /* ---------- Colors: Pinki's meadow with a painter's easel; in each
     lesson the blanket, what is on it, the pots, the balloons and the
     flowers are the lesson's color (the review: all ten, a rainbow). */
  const COLOR_THINGS = {
    red: ["apple", "strawberry", "cherries", "ladybug"], blue: ["fish", "whale", "mug", "ball"], yellow: ["banana", "lemon", "star", "duck"],
    green: ["pear", "frog", "leaf", "broccoli"], orange: ["orange", "carrot", "basketball"], purple: ["grapes", "eggplant", "book", "gift"],
    pink: ["donut", "icecream", "cupcake", "pig"], brown: ["cookie", "chocolate", "teddy", "acorn"], black: ["hat", "tire", "bowling", "ant"],
    white: ["egg", "sheep", "milk", "snowman"],
  };
  const colorThing = (name, color) => (name === "fish" || name === "ball" ? ITEMS[name](PAINT.blue) : name === "book" || name === "gift" ? ITEMS[name](PAINT.purple) : ITEMS[name]());
  /* An easel with a canvas, painted `color` (the review: a rainbow of
     stripes). */
  function easel(colors) {
    const g = new THREE.Group();
    const wood = clay(0xc98f55, { roughness: 0.7, clearcoat: 0.2 });
    for (const [x, z, tz] of [[-0.55, 0.15, 0.12], [0.55, 0.15, -0.12], [0, -0.45, 0]]) {
      const leg = mesh(new THREE.CapsuleGeometry(0.06, 2.6, 8, 16), wood);
      leg.position.set(x * 0.85, 1.3, z);
      leg.rotation.set(z < 0 ? -0.22 : 0.08, 0, tz);
      g.add(leg);
    }
    const canvas = mesh(new RoundedBoxGeometry(1.5, 1.2, 0.08, 4, 0.03), clay(0xfffaf2, { roughness: 0.8 }));
    canvas.position.set(0, 1.9, 0.22);
    g.add(canvas);
    colors.forEach((color, i) => {
      const paint = mesh(new RoundedBoxGeometry(1.3, 1.0 / colors.length, 0.02, 2, 0.01), clay(color, { clearcoat: 0.5 }));
      paint.position.set(0, 1.9 + 0.5 - (i + 0.5) / colors.length, 0.27);
      g.add(paint);
    });
    return g;
  }
  function rainbow() {
    const g = new THREE.Group();
    ["red", "orange", "yellow", "green", "blue", "purple"].forEach((c, i) => {
      const band = mesh(new THREE.TorusGeometry(7 - i * 0.42, 0.22, 16, 96, Math.PI), clay(PAINT[c], { emissive: PAINT[c], emissiveIntensity: 0.25 }));
      band.scale.z = 0.4;
      band.castShadow = false;
      g.add(band);
    });
    return g;
  }
  function colorsWorld(color) {
    const all = color === "review";
    const tone = all ? null : PAINT[color];
    meadow({ flowers: all ? [PAINT.red, PAINT.yellow, PAINT.blue, PAINT.pink] : [tone] });
    trees([() => roundTree()]);
    const things = all
      ? [["red", -1.6, -1.2], ["blue", -0.5, -1.3], ["yellow", 0.6, -1.2], ["green", 1.7, -1.2], ["orange", -1.6, 0], ["purple", 1.7, 0], ["pink", -1.6, 1.2], ["brown", -0.5, 1.3], ["black", 0.6, 1.3], ["white", 1.7, 1.2]].map(([c, x, z]) => [ITEMS.pot(c), x, z, 0.75])
      : [[ITEMS.pot(color), 0, 0, 0.9], ...COLOR_THINGS[color].map((name, i) => [colorThing(name, color), [-1.5, 1.5, -1.4, 1.4][i], [-1.1, -1.0, 1.1, 1.2][i], 0.9])];
    picnicAt(all ? plainBlanket(0xfff3dc, 0xcfe6fb) : plainBlanket(tone, color === "white" ? 0xcfe6fb : 0xffffff), things);
    put(easel(all ? ["red", "orange", "yellow", "green", "blue", "purple"].map((c) => PAINT[c]) : [tone]), NR[0], 0, NR[1], 0.95).rotation.y = -0.35;
    if (all) put(rainbow(), 0, portrait ? 5.5 : 1.0, -24, portrait ? 1.3 : 1.6);
    else many(() => ITEMS.balloon(color), [[SKY_R[0], SKY_R[1], SKY_R[2], 0.9], [SKY_R[0] + 0.8, SKY_R[1] + 0.6, SKY_R[2], 0.9], [SKY_R[0] + 0.4, SKY_R[1] - 0.5, SKY_R[2], 0.9]]);
  }

  /* ---------- Vegetables: Nova's garden — a picket fence across the
     field, a soil bed at the near left growing the lesson's vegetable,
     Nova's basket full of it at the near right (the review: all five). */
  function soilBed(plants) {
    const g = new THREE.Group();
    const earth = clay(0x8a5a3a, { roughness: 0.95, clearcoat: 0.05, sheen: 0 });
    const bed = mesh(new RoundedBoxGeometry(5.2, 0.34, 2.8, 6, 0.15), earth);
    bed.position.y = 0.17;
    g.add(bed);
    for (let i = 0; i < 40; i++) {
      const clump = mesh(new THREE.SphereGeometry(0.1 + rand() * 0.08, 16, 10), earth);
      clump.scale.y = 0.5;
      clump.position.set((rand() - 0.5) * 4.8, 0.34, (rand() - 0.5) * 2.4);
      g.add(clump);
    }
    // `sink`: how deep it grows in the soil (a carrot shows its top and leaves)
    for (const [make, x, z, k, sink = 0] of plants) g.add(stand(make(), x, 0.3 - sink * k, z, k));
    return g;
  }
  const VEG = {
    carrot: { plant: () => videoCarrot(0), k: 0.75, sink: 1.15, loose: () => videoCarrot(-0.5) },
    broccoli: { plant: () => videoBroccoli(), k: 0.75, loose: () => videoBroccoli() },

  function picketFence(z) {

    for (let x = -18; x <= 18; x += 0.6) put(mesh(new THREE.CapsuleGeometry(0.13, 1.05, 6, 16), paint), x, 0.66, z).scale.z = 0.45;
    for (const y of [0.4, 0.95]) put(mesh(new RoundedBoxGeometry(37, 0.12, 0.08, 3, 0.04), paint), 0, y, z - 0.1);

  function vegetablesWorld(food) {
    const foods = food === "review" ? ["carrot", "tomato", "potato", "broccoli", "pepper"] : [food, food, food, food, food];
    meadow({ sky: 0xd8ebfb, flowers: [0xffd45e, 0xffffff] });
    trees([() => roundTree()]);
    picketFence(-7);
    put(ITEMS.sun(), portrait ? -3.4 : -5.5, portrait ? 9.5 : 6.0, -24, 2.4);
    const spots = [[-1.6, -0.6], [0, -0.7], [1.6, -0.6], [-0.8, 0.7], [0.8, 0.7]];
    const bed = soilBed(spots.map(([x, z], i) => [VEG[foods[i]].plant, x, z, VEG[foods[i]].k, VEG[foods[i]].sink]));

    [[-0.3, 0.6, -0.2], [0.3, 0.62, 0.1], [0, 0.75, 0.3], [-0.2, 0.8, 0.05]].forEach(([x, y, z], i) => basket.add(at(VEG[foods[(i + 1) % foods.length]].loose(), [x, y, z], 0.34, [0, i, 0])));
    put(basket, NR[0], 0, NR[1], 0.85);
  }

  /* ---------- Seasons: the meadow in the lesson's season — its grass, its
     trees, what lies about and what is in the sky (the review: one tree
     of each season). */
  const SEASON_TREES = {
    spring: () => roundTree([0xa9e38a, 0x9adb7c], { dots: 0xffa6cf }),
    summer: () => roundTree([0x5cbd57, 0x52b450], { dots: 0xee4645 }),
    fall: () => roundTree([0xff9a3c, 0xf2683a, 0xffc24a]),
    winter: () => bareTree(),
  };
  function seasonsWorld(season) {
    const SKIES = { spring: 0xd6ecfb, summer: 0xbfe1fb, fall: 0xe6e6ee, winter: 0xe4edf6, review: 0xcfe6fb };
    const GRASS = { spring: 0xa3e07e, summer: 0x74cd5c, fall: 0xc2d36a, winter: 0xfbfdff, review: 0x9ad67c };
    const winter = season === "winter";
    meadow({ sky: SKIES[season], grass: GRASS[season], hills: winter ? [0xf4f8fc, 0xeef4fa] : undefined, flowers: { spring: [0xff8cc6, 0xffd23a, 0xff6f7d], summer: [0xffd45e, 0xffffff], fall: [0xffb43a], winter: null, review: [0xff9ec8, 0xffffff] }[season] });
    trees(season === "review" ? [SEASON_TREES.spring, SEASON_TREES.fall, SEASON_TREES.summer, SEASON_TREES.winter] : [SEASON_TREES[season]]);
    const [lx, lz] = NL, [rx, rz] = NR;
    const sky = (make, spots) => spots.forEach(([dx, dy, k, turn]) => put(make(), SKY_R[0] + dx, SKY_R[1] + dy, SKY_R[2], k).rotation.set(0, 0, turn));
    if (season === "spring") {
      [[0, 0, 0xff6f7d], [0.7, 0.3, 0xffd23a], [-0.6, 0.4, 0xff8cc6], [0.2, 0.9, 0xff8cc6], [-0.3, -0.5, 0xffd23a], [0.9, -0.4, 0xff6f7d]].forEach(([dx, dz, c]) => put(tulip(c), lx + dx, 0, lz + dz, 1.4));
      sky(butterfly, [[0, 0, 1.2, 0.2], [-1.0, 0.8, 1.0, -0.3]]);
      [[0, 0, 0xff8cc6], [0.6, 0.4, 0xffffff], [-0.5, 0.5, 0xff6f7d]].forEach(([dx, dz, c]) => put(tulip(c), rx + dx, 0, rz + dz, 1.3));
    } else if (season === "summer") {
      picnicAt(plainBlanket(0xffd45e), [[ITEMS.icecream(), -1.0, -0.5, 1.1], [ITEMS.icecream(), 0.2, 0.6, 1.0, 0.5], [WEAR.sunhat(), 1.2, -0.6, 0.8], [WEAR.sunglasses(), -0.9, 1.1, 0.6]]);
      put(ITEMS.ball(), rx, 0, rz, 0.9);
      put(sunfriend(), portrait ? -2.4 : -4.2, portrait ? 7.4 : 4.6, -10, 1.8);
    } else if (season === "fall") {
      [[0, 0, 1.25], [0.9, 0.5, 0.95], [-0.8, 0.6, 1.0]].forEach(([dx, dz, k]) => put(pumpkin(), lx + dx, 0, lz + dz, k).rotation.y = dx);
      const colors = [0xf2683a, 0xffb43a, 0xff8a2e, 0xe8513a];
      for (let i = 0; i < 26; i++) put(mapleLeaf(colors[i % 4]), rx + (rand() - 0.5) * 2.4, 0.06 + rand() * 0.25, rz + (rand() - 0.5) * 1.6, 0.6).rotation.set(-Math.PI / 2 + (rand() - 0.5) * 0.6, 0, rand() * 6);
      for (let i = 0; i < 18; i++) put(mapleLeaf(colors[i % 4]), (rand() - 0.5) * 12, 0.04, (rand() - 0.2) * 8, 0.55).rotation.set(-Math.PI / 2, 0, rand() * 6);
      sky(() => mapleLeaf(0xff8a2e), [[0, 0, 0.7, 0.6], [-1.2, 0.8, 0.6, -0.5], [0.9, 1.1, 0.6, 1.4]]);
    } else if (season === "winter") {
      put(snowfriend(), lx, 0.1, lz, 0.95).rotation.y = 0.35;
      sky(snowflake, [[0, 0, 0.8, 0.2], [-1.2, 0.9, 0.7, 0.6], [0.8, 1.2, 0.6, 1.0], [-0.4, -0.7, 0.6, 0.4]]);
      sky(snowflake, [[-(SKY_R[0] - SKY_L[0]), 0.4, 0.8, 0.3], [-(SKY_R[0] - SKY_L[0]) + 0.9, -0.4, 0.6, 0.8]]);
      for (const [dx, dz, r] of [[0, 0, 0.9], [0.8, 0.4, 0.6], [-0.6, 0.5, 0.5]]) put(mesh(new THREE.SphereGeometry(r, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), clay(0xffffff, { roughness: 0.7 })), rx + dx, 0, rz + dz).scale.y = 0.6;
    } else {
      put(pumpkin(), lx, 0, lz, 1.2);
      [[0.9, 0.3, 0xff6f7d], [1.4, -0.2, 0xffd23a]].forEach(([dx, dz, c]) => put(tulip(c), lx + dx, 0, lz + dz, 1.3));
      put(snowfriend(), rx, 0, rz, 0.8).rotation.y = -0.35;
      put(sunfriend(), portrait ? -2.4 : -4.2, portrait ? 7.4 : 4.6, -10, 1.5);
    }
  }

  /* ---------- Animals: the videos' pastel world — a pink-lilac sky,
     pastel grass and trees, a path of pastel stones — and where the
     lesson's animal lives at the near left and right (the review: the
     three homes it sorts into). */
  const PASTEL = [0xffc9de, 0xd9c9f5, 0xc4ecd9, 0xffe0c2, 0xcfe4fb];
  const pastelTree = () => roundTree([0xa6e3b4, 0xffc4dc, 0xc9b8f2, 0xa6e3b4]);
  function stonePath() {
    for (let i = 0; i < 260; i++) {
      const z = 9 - i * 0.12 - (i * i) / 900;
      if (z < -40) break;
      const width = 0.9 + (9 - z) * 0.01;
      const x = (rand() - 0.5) * width * 2;
      // half-way to the grass: a path to walk on, not a thing to look at
      const tone = new THREE.Color(PASTEL[i % PASTEL.length]).lerp(new THREE.Color(0xbfe8b0), 0.45);
      const stone = mesh(new THREE.SphereGeometry(0.26, 24, 12), clay(tone, { roughness: 0.7, clearcoat: 0.15 }));
      stone.scale.set(1.2, 0.3, 0.9);
      stone.castShadow = false;
      put(stone, x, 0.02, z);
    }
  }
  function pond(r = 1.6) {
    const g = new THREE.Group();
    const water = mesh(new THREE.CylinderGeometry(r, r, 0.06, 64), clay(0x8fcdfc, { clearcoat: 0.9, clearcoatRoughness: 0.1, roughness: 0.2 }));
    water.position.y = 0.03;
    water.scale.z = 0.7;
    g.add(water);
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * Math.PI * 2;
      const rock = mesh(new THREE.SphereGeometry(0.22 + (k % 3) * 0.05, 24, 12), clay(PASTEL[k % PASTEL.length], { roughness: 0.6 }));
      rock.scale.y = 0.55;
      rock.position.set(Math.cos(a) * r, 0.08, Math.sin(a) * r * 0.7);
      g.add(rock);
    }
    for (const [x, z] of [[-0.5, 0.2], [0.6, -0.3]]) {
      const pad = mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.03, 32, 1, false, 0.3, Math.PI * 1.8), leafy(0x6cc46a));
      pad.position.set(x * r * 0.6, 0.08, z * r * 0.6);
      g.add(pad);
    }
    return g;
  }
  function yarn(color) {
    const g = new THREE.Group();
    g.add(mesh(new THREE.SphereGeometry(0.42, 32, 24), clay(color, { roughness: 0.8 })));
    for (let k = 0; k < 4; k++) {
      const wrap = mesh(new THREE.TorusGeometry(0.42, 0.025, 8, 64), clay(color, { roughness: 0.8 }));
      wrap.rotation.set(k * 0.8, k * 0.5, 0);
      g.add(wrap);
    }
    g.children.forEach((c) => (c.position.y = 0.42));
    return g;
  }
  function bone() {
    const g = new THREE.Group();
    const white = clay(0xfff8ec, { roughness: 0.6 });
    const bar = mesh(new THREE.CapsuleGeometry(0.12, 0.8, 8, 16), white);
    bar.rotation.z = Math.PI / 2;
    g.add(bar);
    for (const x of [-0.5, 0.5]) for (const z of [-0.11, 0.11]) {
      const knob = mesh(new THREE.SphereGeometry(0.15, 24, 16), white);
      knob.position.set(x, 0, z);
      g.add(knob);
    }
    g.position.y = 0.15;
    return group(g);
  }
  function boulders(n = 5) {
    const g = new THREE.Group();
    for (let k = 0; k < n; k++) {
      const r = 0.7 + (k % 3) * 0.3;
      const rock = mesh(new THREE.SphereGeometry(r, 48, 32), clay(PASTEL[k % PASTEL.length], { roughness: 0.7, clearcoat: 0.15 }));
      rock.scale.y = 0.75;
      rock.position.set((k - n / 2) * 0.9, r * 0.55, (k % 2) * -0.7);
      g.add(rock);
    }
    return g;
  }
  function birdhouse() {
    const g = new THREE.Group();
    const pole = mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.4, 16), clay(0xc98f55));
    pole.position.y = 1.2;
    g.add(pole);
    const house = gableHouse(0.9, 0.8, 0.8, 0.45, clay(0xffc9de, { roughness: 0.6 }), clay(0xc9b8f2, { roughness: 0.6 }));
    house.position.y = 2.4;
    g.add(house);
    const hole = mesh(new THREE.CircleGeometry(0.16, 32), clay(0x5a3a5a));
    hole.position.set(0, 2.8, 0.42);
    g.add(hole);
    return g;
  }
  function nest() {
    const g = new THREE.Group();
    const twigs = mesh(new THREE.TorusGeometry(0.55, 0.22, 16, 48), clay(0xb98a5e, { roughness: 0.9 }));
    twigs.rotation.x = Math.PI / 2;
    twigs.position.y = 0.22;
    g.add(twigs);
    for (const [x, z] of [[-0.18, 0], [0.18, 0.05], [0, -0.18]]) {
      const egg = mesh(new THREE.SphereGeometry(0.17, 24, 16), clay(0xbfe3fb, { clearcoat: 0.6 }));
      egg.scale.y = 1.3;
      egg.position.set(x, 0.3, z);
      g.add(egg);
    }
    return g;
  }
  function hayBale() {
    const bale = mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.1, 48), clay(0xf2d27a, { roughness: 0.9 }));
    bale.rotation.z = Math.PI / 2;
    bale.position.y = 0.7;
    return group(bale);
  }
  function grassTuft() {
    const g = new THREE.Group();
    for (let k = 0; k < 7; k++) g.add(taperTube([[0, 0, 0], [(k - 3) * 0.08, 0.6, 0], [(k - 3) * 0.2, 1.3 + (k % 3) * 0.2, 0.05]], 0.06, 0.015, leafy(0x8ccf6e)));
    return g;
  }
  function animalsWorld(animal) {
    meadow({ sky: 0xf4e1f0, grass: 0xbfe8b0, hills: [0xcdeec0, 0xd8f0c8, 0xc6ebc0, 0xd8f0c8], flowers: [0xffc4dc, 0xffffff, 0xd9c9f5] });
    stonePath();
    const T = { parrot: palmTree, elephant: flatTree }[animal] ?? pastelTree;
    trees([T]);
    const L = (thing, k = 1, turn = 0.3) => (put(thing, NL[0], 0, NL[1], k).rotation.y = turn);
    const R = (thing, k = 1, turn = -0.3) => (put(thing, NR[0], 0, NR[1], k).rotation.y = turn);
    if (animal === "cat") { L(catBed(), 1.5); R(yarn(0xffc4dc)); put(yarn(0xcfe4fb), NR[0] - 1.0, 0, NR[1] - 0.6, 0.8); }
    if (animal === "dog") { L(kennel(), 1.3); R(bone(), 1.6); put(ITEMS.ball(), NR[0] - 1.2, 0, NR[1] - 0.8, 0.6); }
    if (animal === "fish") { L(pond(1.8)); R(fishbowl(), 1.3, 0); }
    if (animal === "elephant") { L(pond(2.2)); R(grassTuft(), 1.4); put(grassTuft(), NR[0] - 0.9, 0, NR[1] - 0.5, 1.1); }
    if (animal === "mouse") {
      L(group(stand(ITEMS.cheese(), -0.5, 0, 0, 1.4), stand(ITEMS.cheese(), 0.6, 0, 0.3, 1.1, 1.2)), 1);
      R(hayBale(), 1.1);
      const barn = gableHouse(3, 2.4, 2, 1.2, clay(0xf4a3b8, { roughness: 0.6 }), clay(0xc9b8f2, { roughness: 0.6 }));
      put(barn, portrait ? 4 : 7.5, 0, -10, 1).rotation.y = -0.5;
    }
    if (animal === "bird") { L(nest(), 1.4); R(birdhouse(), 0.75, -0.4); }
    if (animal === "parrot") { L(group(...[[0, 0, 0xff6f9a], [0.6, 0.4, 0xffd23a], [-0.6, 0.5, 0xff8a3c]].map(([x, z, c]) => at(hillFlower(c), [x, 0, z], 2.6)))); R(palmTree(), 0.55); }
    if (animal === "turtle") { L(pond(1.9)); R(boulders(3), 0.6); }
    if (animal === "gecko") { L(boulders(5), 0.8); R(boulders(3), 0.7); }
    if (animal === "review") { L(group(at(catBed(), [-1.0, 0, 0], 1.2), at(kennel(), [1.2, 0, -0.4], 1.0))); R(fishbowl(), 1.3, 0); }
  }

  /* ---------- Weather: the meadow under the lesson's weather — its sky,
     what falls or blows, and what a child wears for it (the review: a
     little of each). */
  function weatherWorld(weather) {
    const rain = weather === "rainy", snow = weather === "snowy", wind = weather === "windy";
    meadow({
      sky: { sunny: 0xbfe3fb, rainy: 0xc8d2de, windy: 0xcfe6fb, snowy: 0xe2eaf3, review: 0xcfe6fb }[weather],
      grass: snow ? 0xfbfdff : rain ? 0x8cc77a : 0x9ad67c,
      hills: snow ? [0xf4f8fc, 0xeef4fa] : undefined,
      cloud: weather === "sunny" ? null : rain ? 0xc9d3df : 0xffffff,
      flowers: snow ? null : [0xff9ec8, 0xffffff, 0xffd45e],
    });
    trees([() => (snow ? roundTree([0xe9f1f8], { snow: true }) : roundTree([0x7cc66a], { lean: wind ? -0.22 : 0 }))]);
    const L = (thing, k = 1, turn = 0.3) => (put(thing, NL[0], 0, NL[1], k).rotation.y = turn);
    const R = (thing, k = 1, turn = -0.3) => (put(thing, NR[0], 0, NR[1], k).rotation.y = turn);
    const skyAt = (dx, dy) => [SKY_R[0] + dx, SKY_R[1] + dy, SKY_R[2]];
    if (weather === "sunny") {
      put(weatherSun(), portrait ? -1.8 : -3.8, portrait ? 6.6 : 4.4, -6, 2.0);
      picnicAt(plainBlanket(0x8cc4f2), [[WEAR.sunglasses(), -0.8, -0.4, 0.7], [WEAR.sunhat(), 0.9, 0.2, 0.9]]);
      R(ITEMS.ball(), 1.0);
    }
    if (rain) {
      put(weatherCloud(0xb9cde2), ...skyAt(-0.6, 0.8), 1.5);
      put(weatherCloud(0xc9d6e4), SKY_L[0], SKY_L[1] + 0.8, SKY_L[2], 1.2);
      for (let i = 0; i < 46; i++) put(raindrop(), (rand() - 0.5) * (portrait ? 7 : 14), 0.6 + rand() * (portrait ? 6 : 4), -2 - rand() * 6, 1.4);
      for (const [x, z, r] of [[NR[0], NR[1], 0.9], [NR[0] - 1.6, NR[1] - 1.2, 0.6], [0.4, 1.8, 0.7], [-2.5, -1.5, 0.8]]) {
        const puddle = mesh(new THREE.CylinderGeometry(r, r, 0.04, 48), velvet(0x8fcdfc));
        puddle.scale.z = 0.62;
        put(puddle, x, 0.02, z);
      }
      L(WEAR.umbrella(), 1.1, 0);
      put(WEAR.rainhat(), NL[0] + 1.4, 0, NL[1] - 0.6, 0.75);
    }
    if (wind) {
      put(WEAR.kite(), ...skyAt(0.2, 0.8), 1.3).rotation.set(0, 0, -0.35);
      [[-1.0, 0.0, 2.3], [-1.6, -0.9, 1.9], [0.0, -1.5, 1.7]].forEach(([dx, dy, len]) => put(windSwirl(len), SKY_L[0] + dx + 1, SKY_L[1] + dy, SKY_L[2] + 1, 1.0));
      [[0x78cf5c, 0.5], [0xffa53a, -0.6], [0x63c84e, 1.2], [0xf2683a, -0.2], [0xffa53a, 0.9]].forEach(([c, turn], i) => put(plumpLeaf(0.32, 0.15, velvet(c)), (i - 2) * (portrait ? 0.9 : 1.8), 2.2 + (i % 2) * 1.1, -1, 1.6).rotation.set(0.3, 0.2, turn));
      L(WEAR.pinwheel(), 0.9, 0);
      R(WEAR.scarf(), 0.7);
    }
    if (snow) {
      L(weatherSnowman(), 1.1, 0.3);
      for (let i = 0; i < 30; i++) put(velvetFlake(), (rand() - 0.5) * (portrait ? 7 : 14), 0.8 + rand() * (portrait ? 6 : 4), -2 - rand() * 6, 0.7 + rand() * 0.4).rotation.z = rand() * 3;
      R(WEAR.beanie(), 0.7);
      put(WEAR.scarf(), NR[0] - 1.3, 0, NR[1] - 0.6, 0.6);
    }
    if (weather === "review") {
      put(weatherSun(), SKY_L[0], SKY_L[1] + 0.6, SKY_L[2], 1.3);
      put(weatherCloud(0xc9d6e4), ...skyAt(0, 0.6), 1.2);
      for (const [dx, dy] of [[-0.4, -0.5], [0.2, -0.9], [0.6, -0.4]]) put(raindrop(), ...skyAt(dx, dy), 1.4);
      L(WEAR.umbrella(), 1.0, 0);
      R(weatherSnowman(), 0.9);
    }
  }

  /* ---------- Play (2026-10-23): a game card's picture — `play-cups`,
     Nova's Cups. Her garden (the meadow, its fence, a tree, the sun), her
     three gold cups on the grass at the near left, the near one lifted off
     a carrot, and her basket of vegetables at the near right. The middle
     stays open grass and sky: the card's button sits there. Landscape
     only; `crop.py playcard cups`. ---------- */
  function playWorld(which) {
    if (which !== "cups") throw new Error(`No play card ${which}`);
    meadow({ sky: 0xd8ebfb, flowers: [0xffd45e, 0xffffff, 0xff9ec8] });
    trees([() => roundTree(), () => roundTree([0x8fd474, 0x7cc66a], { dots: 0xff8a3d })]);
    picketFence(-7);
    put(ITEMS.sun(), -5.5, 6.0, -24, 2.4);
    const cups = [[-4.1, 2.2, 0.15], [-2.85, 2.75, -0.1], [-1.55, 3.3, 0.2]];
    cups.forEach(([x, z, turnY], i) => {
      /* The near cup is up: the carrot it hid lies on the grass under it. */
      const c = ITEMS.cup();
      /* Tipped up on one side, the way a hand lifts it. */
      if (i === 2) c.rotation.z = -0.55;
      scene.add(stand(c, i === 2 ? x + 0.3 : x, i === 2 ? 0.04 : 0, z, 0.66, turnY));
      if (i === 2) {
        const carrot = new THREE.Group();
        const body = videoCarrot(0);
        body.rotation.z = Math.PI / 2;
        carrot.add(body);
        scene.add(stand(carrot, x + 0.15, 0, z + 0.15, 0.36, 0.2));
      }
    });
    const basket = ITEMS.basket();
    [[-0.3, 0.6, -0.2, "broccoli"], [0.3, 0.62, 0.1, "potato"], [0, 0.75, 0.3, "carrot"], [-0.2, 0.8, 0.05, "tomato"]].forEach(([x, y, z, food], i) => basket.add(at(VEG[food].loose(), [x, y, z], 0.34, [0, i, 0])));
    put(basket, 3.15, 0, 3.0, 0.82);
    put(VEG.pepper.loose(), 2.0, 0.1, 3.6, 0.5);
  }

  const WORLDS = { colors: colorsWorld, veg: vegetablesWorld, seasons: seasonsWorld, animals: animalsWorld, weather: weatherWorld, play: playWorld };
  const [course, which] = BACKDROP.includes("-") ? BACKDROP.split("-") : ["shapes", BACKDROP];
  if (course === "shapes") {
    const lesson = LESSONS[which];
    meadow();
    FAR.forEach(([x, z, k], i) => put(TREES[lesson.trees[i]](), x, 0, z, k));
    lesson.sky();
    // the picnic at the near left
    const picnic = new THREE.Group();
    picnic.add(BLANKET[which]());
    for (const [name, x, z, k, rotY] of lesson.picnic) {
      const thing = ITEMS[name]();
      place(thing, { at: [x, ON_BLANKET, z], scale: k, rotY });
      picnic.add(thing);
    }
    picnic.rotation.y = 0.45;
    put(picnic, NL[0], 0, NL[1], 0.85);
    put(lesson.near(), NR[0], 0, NR[1], 0.9);
  } else {
    WORLDS[course](which);
  }
  window.renderLayers = () => {
    renderer.render(scene, view);
    return { backdrop: renderer.domElement.toDataURL("image/png") };
  };
  window.itemsMeta = () => ({});
} else {
  /* ---------- The world ---------- */
  const world = new THREE.Group();
  scene.add(world);

  // grass
  const grass = mesh(new THREE.PlaneGeometry(30, 30), clay(0x8fd16e, { clearcoat: 0.05, roughness: 0.9, sheen: 0 }));
  grass.rotation.x = -Math.PI / 2;
  grass.castShadow = false;
  world.add(grass);

  // tufts of grass — little clay blades, never round, never under a thing
  const onGrass = Object.values(def.items).filter((it) => it.at[1] === 0).map((it) => [it.at[0], it.at[2]]);
  for (let i = 0; i < 70; i++) {
    const x = (rand() - 0.5) * 7.5, z = (rand() - 0.5) * 9.5;
    const [sx, sz] = def.deep ?? [1, 1];
    if (Math.abs(x) < 3.0 * sx && Math.abs(z - 0.05) < 2.5 * sz) continue;
    if (onGrass.some(([a, c]) => Math.hypot(x - a, z - c) < 1.2)) continue;
    const tuft = new THREE.Group();
    const n = 3 + Math.floor(rand() * 3);
    for (let j = 0; j < n; j++) {
      const blade = mesh(new THREE.ConeGeometry(0.05, 0.32 + rand() * 0.18, 12), clay(rand() > 0.5 ? 0x86c96b : 0x94d27a));
      blade.position.set((rand() - 0.5) * 0.18, 0.16, (rand() - 0.5) * 0.18);
      blade.rotation.z = (rand() - 0.5) * 0.7;
      blade.rotation.x = (rand() - 0.5) * 0.7;
      tuft.add(blade);
    }
    tuft.position.set(x, 0, z);
    world.add(tuft);
  }

  const blanket = BLANKETS[def.blanket]();
  /* `deep`: the blanket stretched [across, down] — the Shapes picnics'
     fill the picture, every thing on them, none at its edge. */
  if (def.deep) blanket.scale.set(def.deep[0], 1, def.deep[1]);
  world.add(blanket);

  const items = {};
  for (const [name, it] of Object.entries(def.items)) {
    const group = ITEMS[it.model ?? name](it.arg);
    place(group, it);
    scene.add(group);
    items[name] = { group, at: it.at };
  }

  window.renderLayers = () => {
    const out = {};
    // everything, for a preview
    catcher.visible = false;
    out.all = frame();
    // the world alone
    Object.values(items).forEach((it) => (it.group.visible = false));
    out.background = frame();
    // each item alone, on a shadow catcher at its own surface height
    world.visible = false;
    catcher.visible = true;
    renderer.setClearColor(0x000000, 0);
    for (const [name, it] of Object.entries(items)) {
      Object.values(items).forEach((o) => (o.group.visible = o === it));
      catcher.position.y = it.at[1] + 0.001;
      out[name] = frame();
      catcher.visible = false;
      out[name + "__hit"] = frame();
      catcher.visible = true;
    }
    return out;
  };
  window.itemsMeta = () =>
    Object.fromEntries(Object.entries(def.items).map(([k, it]) => [k, { shape: SHAPE_OF[it.model ?? k] ?? null, color: it.color ?? COLOR_OF[it.model ?? k] ?? null }]));
}
window.ready = true;
</script>
</body>
</html>
